<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Cómo funciona un módulo</title><desc id="desc">El host crea y activa el módulo. El módulo declara contribuciones para el contexto. Una acción del usuario llega a dispatch, que utiliza el SDK y devuelve un resultado para la interfaz del host. Los eventos actualizan el estado; al desactivar se retiran sus elementos.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}.label{font-size:20px;font-weight:700}.body{font-size:17px;fill:#334155}.small{font-size:15px;fill:#475569}.mono{font-family:Consolas,monospace;font-size:16px}.arrow{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker></defs><rect width="1120" height="640" rx="20" fill="#f8fafc"/><text x="40" y="49" class="title">Cómo funciona un módulo</text><text x="40" y="82" class="subtitle">El módulo se ejecuta en los tres entornos. Studio simula juegos y servicios del host.</text><rect x="40" y="130" width="240" height="144" rx="14" class="card"/><text x="60" y="165" class="label">Nelkano</text><text x="60" y="198" class="body">Carga el paquete</text><text x="60" y="224" class="body">y comprueba permisos.</text><rect x="340" y="130" width="330" height="144" rx="14" class="accent"/><text x="360" y="165" class="label">Módulo</text><text x="360" y="198" class="body">createModule(host)</text><text x="360" y="224" class="body">activate() prepara su estado.</text><rect x="730" y="130" width="350" height="144" rx="14" class="card"/><text x="750" y="165" class="label">Contribuciones</text><text x="750" y="198" class="body">contributions(context)</text><text x="750" y="224" class="body">Describe botones y secciones.</text><path d="M280 202 H328" class="arrow"/><path d="M670 202 H718" class="arrow"/><path d="M905 274 V348" class="arrow"/><text x="927" y="315" class="small">El usuario pulsa.</text><rect x="730" y="360" width="350" height="144" rx="14" class="accent"/><text x="750" y="395" class="label">Acción</text><text x="750" y="428" class="body">dispatch(action, payload,</text><text x="750" y="454" class="body">context) ejecuta la operación.</text><rect x="340" y="360" width="330" height="144" rx="14" class="card"/><text x="360" y="395" class="label">SDK del host</text><text x="360" y="428" class="body">Acceso a datos y servicios</text><text x="360" y="454" class="body">con los permisos declarados.</text><rect x="40" y="360" width="240" height="144" rx="14" class="card"/><text x="60" y="395" class="label">Resultado</text><text x="60" y="428" class="body">Panel, página o</text><text x="60" y="454" class="body">close-panel.</text><path d="M730 432 H682" class="arrow"/><path d="M340 432 H292" class="arrow"/><rect x="40" y="540" width="1040" height="70" rx="12" fill="#ede9fe"/><text x="60" y="568" class="body">onEvent(event): responde a los cambios de datos, sesión y ganchos.</text><text x="60" y="593" class="body">Al desactivar: deactivate() libera recursos y la app retira sus elementos.</text></svg>
