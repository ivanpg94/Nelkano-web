<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc"><title id="title">Qué comprueba cada entorno</title><desc id="desc">Android y Desktop ejecutan módulos y juegos reales. Studio ofrece una vista previa con juegos ficticios. Los tres permiten conexiones externas a destinos autorizados. Android dispone de captura de cámara con permiso; Desktop anuncia capture false; Studio simula la cámara.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.sub{font-size:17px;fill:#475569}.heading{font-size:19px;font-weight:700;fill:#5b21b6}.cell{font-size:17px}.row{font-size:17px;font-weight:700}</style><rect width="1120" height="540" rx="20" fill="#f8fafc"/><text x="40" y="49" class="title">Qué comprueba cada entorno</text><text x="40" y="82" class="sub">Consulta la disponibilidad que anuncia cada función antes de utilizarla.</text><rect x="40" y="116" width="1040" height="64" rx="12" fill="#ede9fe"/><text x="60" y="155" class="heading">Función</text><text x="355" y="155" class="heading">Android</text><text x="600" y="155" class="heading">Desktop</text><text x="845" y="155" class="heading">SDK Studio</text><rect x="40" y="180" width="1040" height="60" fill="#fff"/><text x="60" y="216" class="row">Interfaz de módulos</text><text x="355" y="216" class="cell">Real</text><text x="600" y="216" class="cell">Real</text><text x="845" y="216" class="cell">Vista previa simulada</text><rect x="40" y="240" width="1040" height="60" fill="#f1f5f9"/><text x="60" y="276" class="row">Juegos y core</text><text x="355" y="276" class="cell">Reales</text><text x="600" y="276" class="cell">Reales</text><text x="845" y="276" class="cell">Juegos ficticios</text><rect x="40" y="300" width="1040" height="60" fill="#fff"/><text x="60" y="336" class="row">Conexiones externas</text><text x="355" y="336" class="cell">Destinos autorizados</text><text x="600" y="336" class="cell">Destinos autorizados</text><text x="845" y="336" class="cell">Destinos autorizados</text><rect x="40" y="360" width="1040" height="60" fill="#f1f5f9"/><text x="60" y="396" class="row">Cámara</text><text x="355" y="396" class="cell">Sí, con permiso</text><text x="600" y="396" class="cell">No (capture: false)</text><text x="845" y="396" class="cell">Simulada</text><text x="40" y="469" class="sub">Una captura de Studio muestra una prueba del simulador, no una prueba de hardware.</text><text x="40" y="498" class="sub">Los permisos, el dispositivo y el core pueden limitar una operación en la app.</text></svg>
