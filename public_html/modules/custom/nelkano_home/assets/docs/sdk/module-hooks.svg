<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc"><title id="title">Conectar dos módulos</title><desc id="desc">El proveedor publica un gancho versionado y sus esquemas. El consumidor declara consumes y modules.hooks. El registro comprueba disponibilidad, versión, autor opcional y esquemas. contribute publica datos que el proveedor consulta con list; invoke llama a onHook y valida la respuesta.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#475569}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#f5f3ff;stroke:#a78bfa;stroke-width:2}.label{font-size:20px;font-weight:700}.body{font-size:17px;fill:#334155}.small{font-size:15px;fill:#475569}.mono{font-family:Consolas,monospace;font-size:16px}.arrow{fill:none;stroke:#7c3aed;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7c3aed" stroke-width="2"/></marker></defs><rect width="1120" height="640" rx="20" fill="#f8fafc"/><text x="40" y="49" class="title">Conectar dos módulos</text><text x="40" y="82" class="subtitle">Los módulos intercambian datos validados mediante el host; conservan sus instancias separadas.</text><rect x="40" y="128" width="310" height="148" rx="14" class="accent"/><text x="60" y="163" class="label">Consumidor</text><text x="60" y="196" class="body">consumes: proveedor, gancho,</text><text x="60" y="222" class="body">versión y optional.</text><text x="60" y="248" class="body">Permiso: modules.hooks</text><rect x="405" y="128" width="310" height="148" rx="14" class="card"/><text x="425" y="163" class="label">Registro del host</text><text x="425" y="196" class="body">Comprueba disponibilidad,</text><text x="425" y="222" class="body">versión y autor opcional.</text><text x="425" y="248" class="body">Valida los datos del contrato.</text><rect x="770" y="128" width="310" height="148" rx="14" class="accent"/><text x="790" y="163" class="label">Proveedor</text><text x="790" y="196" class="body">provides: nombre y versión.</text><text x="790" y="222" class="body">Esquemas contribution,</text><text x="790" y="248" class="body">input y output.</text><path d="M350 201 H393" class="arrow"/><path d="M770 201 H727" class="arrow"/><rect x="40" y="312" width="1040" height="117" rx="14" class="card"/><text x="60" y="344" class="label">Aportar datos</text><text x="60" y="376" class="mono">Consumidor: contribute(provider, hook, id, value)</text><path d="M590 367 H675" class="arrow"/><text x="700" y="376" class="mono">Proveedor: list(provider, hook)</text><text x="60" y="406" class="small">El proveedor decide cómo mostrar o utilizar las contribuciones.</text><rect x="40" y="453" width="1040" height="147" rx="14" class="card"/><text x="60" y="486" class="label">Pedir una operación</text><text x="60" y="518" class="mono">Consumidor: invoke(provider, hook, operation, value)</text><path d="M610 509 H695" class="arrow"/><text x="722" y="518" class="mono">Proveedor: onHook(request)</text><text x="60" y="557" class="body">El host valida input antes de llamar al proveedor y output antes de devolver la respuesta.</text><text x="60" y="583" class="small">Si el proveedor opcional no está disponible, el consumidor debe ofrecer una alternativa.</text></svg>
