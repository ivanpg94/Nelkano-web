# PC API uses dedicated Bearer credentials in every controller action.
# Cookie-based admin sessions and app player tokens are deliberately ignored.
nelkano_home.report_api_list:
  path: '/api/nelkano/v1/error-reports'
  defaults:
    _controller: '\Drupal\nelkano_home\Controller\ErrorReportApiController::listing'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

nelkano_home.report_api_detail:
  path: '/api/nelkano/v1/error-reports/{report}'
  defaults:
    _controller: '\Drupal\nelkano_home\Controller\ErrorReportApiController::detail'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    report: '\d+'
  options:
    no_cache: TRUE

nelkano_home.report_api_download:
  path: '/api/nelkano/v1/error-reports/{report}/files/{attachment}'
  defaults:
    _controller: '\Drupal\nelkano_home\Controller\ErrorReportApiController::download'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    report: '\d+'
    attachment: 'state|native_save|screenshot'
  options:
    no_cache: TRUE

nelkano_home.report_api_receipt:
  path: '/api/nelkano/v1/error-reports/{report}/receipt'
  defaults:
    _controller: '\Drupal\nelkano_home\Controller\ErrorReportApiController::receipt'
  methods: [POST]
  requirements:
    _access: 'TRUE'
    report: '\d+'
  options:
    no_cache: TRUE

