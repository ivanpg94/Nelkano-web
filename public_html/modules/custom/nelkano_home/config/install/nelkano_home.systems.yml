        Use touch controls on Android or keyboard and compatible controllers on desktop.

        Receive video and audio from games supported by the core.

        Pause, resume and restart the session.

        Keep in-game saves in a private Memory Stick.

        Enter text through Nelkano’s form when requested by the game.'
      limitations: 'Some games may fail to boot, freeze or show graphics and audio errors.

        Speed and audio continuity depend on the game and device; full speed is not guaranteed.

