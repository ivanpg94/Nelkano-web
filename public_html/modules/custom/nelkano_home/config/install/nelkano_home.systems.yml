      card_title: CHIP-8
      title: CHIP-8
      short_name: CHIP-8
      status: Muy estable
      category: Para empezar
      summary: La máquina virtual de los años 70. Alta compatibilidad, punto de entrada ideal para entender la emulación.
      tagline: El origen de todo. Una máquina virtual que empezó la historia.
      manufacturer: Joseph Weisbecker (RCA)
      year: '1977'
      formats: '.ch8

        .c8

        .chip8'
      overview: 'CHIP-8 no es una consola de verdad: es un lenguaje de interpretación virtual diseñado en 1977 por Joseph Weisbecker para facilitar el desarrollo de juegos en microcomputadoras como la COSMAC VIP. Sin hardware físico complejo que emular, Nelkano puede ejecutar CHIP-8 con gran precisión. Es el punto de entrada ideal para entender qué es la emulación.'
      features: 'Cargar archivos .ch8, .c8 y .chip8 desde tu dispositivo

        Jugar clásicos de CHIP-8 en sus versiones originales

        Usar la pantalla táctil para mapear el teclado hexadecimal 4×4

        Probar tus propios programas CHIP-8'
      limitations: 'SUPER-CHIP (SCHIP) tiene soporte parcial; algunas extensiones pueden comportarse de forma distinta

        XO-CHIP no está garantizado y puede presentar errores en programas que usen sus instrucciones extendidas'
      step_1_title: Revisa el alcance disponible
      step_1_text: Consulta las limitaciones de esta ficha y comprueba que tu versión de Nelkano incluye este sistema.
      step_2_title: Prepara tus archivos
      step_2_text: Utiliza archivos compatibles que tengas derecho a usar. Conserva juntos los archivos complementarios que necesite el juego.
      step_3_title: Abre el contenido compatible
      step_3_text: Si el sistema está disponible en tu versión, importa el contenido en la biblioteca y revisa los controles antes de jugar.
      faq_1_question: ¿Se incluyen juegos?
      faq_1_answer: No. Nelkano no incluye juegos comerciales. Utiliza tu contenido compatible con los derechos necesarios.
      faq_2_question: ¿El estado se aplica a todos los juegos?
      faq_2_answer: Las extensiones y variantes de CHIP-8 pueden comportarse de forma diferente.
      faq_3_question: ¿Puedo comunicar un problema?
      faq_3_answer: Sí. Indica la versión de Nelkano, el dispositivo, el sistema y los pasos para reproducirlo.
      seo_title: CHIP-8 en Nelkano — Emulador de máquina virtual retro en Android
      seo_description: Ejecuta programas CHIP-8 en Android con Nelkano. Compatible con archivos .ch8 y .c8. Emulador gratuito, sin publicidad.
      steps:
      - title: Consigue un archivo CHIP-8 compatible
        description: 'Necesitas archivos .ch8 o .c8 que tengas derecho a utilizar: tus propios proyectos o software que sus autores hayan publicado con esa licencia.'
      - title: Abre Nelkano y añade el archivo
        description: Abre la app, toca el botón + y selecciona tu archivo desde la memoria del dispositivo.
      - title: ¡Juega!
        description: El teclado virtual aparecerá en pantalla. Cada programa usa teclas distintas; consulta la documentación del programa si algo no responde como esperas.
      faq:
      - question: ¿Qué es exactamente CHIP-8? ¿Es una consola?
        answer: No exactamente. CHIP-8 es una especificación de máquina virtual, no un hardware físico. Eso permite que Nelkano lo interprete con gran fidelidad.
      - question: ¿Funciona SUPER-CHIP?
        answer: El soporte de SUPER-CHIP es parcial. Algunos programas funcionan bien, pero los que usan instrucciones extendidas específicas pueden no comportarse como esperas.
      - question: ¿Puedo cargar mis propios programas CHIP-8?
        answer: Sí. La especificación CHIP-8 es abierta y existen herramientas de desarrollo gratuitas. Una vez compilado el archivo, puedes cargarlo en Nelkano directamente.
      tier: jugable
      status_note: ''
