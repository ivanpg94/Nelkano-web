  nav_language: Espanol
  seo_title: Nelkano — Free multisystem emulator
  seo_description: Free emulator with a local library, customizable controls and modules. Check the features, systems and downloads available for each platform.
  seo_keywords: 'android emulator, free emulator, game boy, gba, gbc, nes, mega drive, nintendo ds, chip-8, rpg maker, nelkano'
  hero_badge: Free emulator in active development
  hero_title: Nelkano
  hero_description: Your games, your library and your controls. A free multisystem emulator for Android, Windows and Linux, extensible through modules.
  primary_cta: 'View compatible systems'
  primary_url: /en/systems
  secondary_cta: Download APK
  secondary_url: '#project-status'
  downloads_title: Downloads
  android_title: Android
  android_channel: 'Native APK'
  android_description: Check each APK’s release notes for its features and requirements. Games, ROMs and BIOS files are not included.
  android_url: /modules/custom/nelkano_home/emulator/Nelkano%201.0.0-beta.apk
