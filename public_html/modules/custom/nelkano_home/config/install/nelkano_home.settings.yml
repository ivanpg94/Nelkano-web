  about_eyebrow: 'Qué es Nelkano'
  about_title: 'Un emulador multisistema con una base cada vez más sólida'
  about_description: Nelkano reúne emulación, biblioteca local y módulos para ampliar sus funciones. Puedes jugar sin una cuenta; Amigos y Streaming requieren iniciar sesión y conexión. No incluye publicidad.
  status_eyebrow: 'Estado actual'
  status_title: 'Estado real de los sistemas'
  status_description: 'Algunos sistemas ya estan en una fase muy usable; otros siguen mejorando precision y compatibilidad. El estado se basa en pruebas tecnicas y trabajo real del emulador.'
  status_items: |-
    CHIP-8|Muy estable|Emulacion ligera y madura para programas CHIP-8, con una base estable para entrada, video y guardado.
    Game Boy|Muy estable|Emulador DMG solido para abrir archivos compatibles, guardar y cargar, con pruebas enfocadas en compatibilidad real.
    Game Boy Color|Avanzado|Compatibilidad CGB con color, bancos de memoria, paletas, HDMA y mejoras clave; sigue en pulido de precision.
    Game Boy Advance|Jugable y en mejora|Ejecuta una parte creciente de la biblioteca compatible y se sigue midiendo con pruebas reales para ampliar compatibilidad.
    NES|Jugable y muy avanzado|Emulacion NES con video, audio, mandos y muchos mappers importantes; la suite de pruebas y compatibilidad ya ofrece una base muy solida.
    RPG Maker MV/MZ|Experimental funcional|Runtime por WebView/NW.js para juegos exportados por el propio RPG Maker, con importacion, input, audio y guardados en evolucion.
    RPG Maker 2000/2003|Core propio en preparacion|El soporte se hara con un core propio de Nelkano para poder integrarlo dentro de Android sin depender de runtimes externos.
    Nintendo DS|Experimental activo|Foco tecnico actual: ARM9/ARM7, planificador interno, comunicacion entre procesadores, video 2D/3D parcial, timings, guardados y arranque de pruebas cada vez mas exigentes.
  platforms_eyebrow: Plataformas
  platforms_title: Android y escritorio
  platforms_description: Nelkano ejecuta los juegos en tu dispositivo. Las funciones y los sistemas disponibles dependen de la plataforma y de la versión; consulta las notas de cada descarga.
  platform_items:
  - title: Android
    description: Biblioteca local, controles táctiles y mandos compatibles. La importación admite archivos individuales, ZIP, RAR y 7z.
  - title: Windows y Linux
    description: Aplicación de escritorio con teclado y mandos compatibles. SteamOS no está certificado en una Steam Deck física; los sistemas y funciones pueden diferir de Android.
  - title: Módulos y SDK
    description: 'Amplía Nelkano con módulos JavaScript o TypeScript: páginas, botones, servicios y funciones para juegos. Las modificaciones de memoria y ROM temporal del SDK están disponibles en GBA.'
  - title: Cuenta Nelkano
    description: Perfil y amigos, con conexión a nelkano.com. Tu biblioteca y tus partidas se almacenan localmente; no se sincronizan con Google Drive.
  - title: Streaming web
    description: Comparte imagen y audio de una partida compatible con el visor web. Requiere cuenta, permiso de emisión y conexión; la disponibilidad depende del core.
  differentiators_eyebrow: Experiencia
  differentiators_title: 'Hecho para jugar, probar y seguir mejorando'
  differentiators_description: 'Nelkano une trabajo de bajo nivel en emulacion con una experiencia sencilla: descargar, abrir tus archivos propios compatibles y consultar un estado de compatibilidad explicado con honestidad.'
  differentiator_items:
    -
      title: 'Biblioteca local'
      description: 'Agrega tus archivos propios. Sin servidores externos ni conexión para jugar.'
      visible: '1'
    -
      title: 'Save states'
      description: 'Guarda y carga el estado de tus partidas en cualquier momento, en los sistemas que lo soportan.'
      visible: '1'
    -
      title: 'Mandos y controles'
      description: 'Soporte de controles táctiles y mandos Bluetooth, con mapeo personalizable por sistema.'
      visible: '1'
    -
      title: 'Compatibilidad transparente'
      description: 'Cada sistema indica su nivel de compatibilidad real. Sin promesas vacías.'
      visible: '1'
    -
      title: 'Sin publicidad'
      description: 'Gratis de verdad. Sin anuncios que interrumpan tus partidas.'
      visible: '1'
    -
      title: 'En desarrollo activo'
      description: 'La compatibilidad mejora con cada versión. Los sistemas experimentales evolucionan constantemente.'
      visible: '1'
  vision_eyebrow: 'Hoja de ruta'
  vision_title: 'Una base gratuita que seguira creciendo'
  vision_description: Mejorar la compatibilidad, la estabilidad y la experiencia en Android y escritorio, manteniendo un SDK documentado para ampliar Nelkano.
  vision_items:
  - text: Mejorar los cores y explicar sus limitaciones
  - text: Mantener claras las descargas y los requisitos de cada plataforma
  - text: Ampliar las posibilidades de los módulos y la modificación de juegos
  - text: Mejorar biblioteca, guardados, controles y funciones conectadas
  faq_eyebrow: FAQ
  faq_title: 'Preguntas frecuentes'
  faq_items: |-
    La web emula archivos?|No. La emulacion real vive en la app Android. Esta web sirve para descargar builds, ver streaming y explicar el estado del proyecto.
    Que sistemas soporta Nelkano?|El proyecto trabaja con CHIP-8, Game Boy, Game Boy Color, Game Boy Advance, NES, Mega Drive, RPG Maker y Nintendo DS, cada uno con un nivel de compatibilidad distinto.
    Nelkano es gratis?|Si. La descarga disponible desde esta web es gratuita. Si alguna funcion cambia o se amplia en el futuro, la pagina indicara claramente que incluye cada version.
    Incluye juegos, ROMs o BIOS?|No. Nelkano no incluye ROMs, BIOS, firmware, saves ni contenido protegido. El usuario debe usar solo archivos sobre los que tenga derechos.
    Que pasa con RPG Maker 2000/2003?|Ese soporte se prepara como core propio de Nelkano integrado en Android.
    Nintendo DS ya esta terminado?|No. Nintendo DS esta en desarrollo activo y es uno de los focos tecnicos principales.
  trust_eyebrow: 'Proyecto verificable'
  trust_title: Consulta antes de instalar
  trust_description: Revisa las notas de la versión, sus requisitos y las limitaciones conocidas. El soporte de un sistema no garantiza que funcionen todos sus juegos.
