  "en": {
    "title": "User guide",
    "eyebrow": "Documentation",
    "intro": "Nelkano guide: library, saves, controls and modules. Some features and systems depend on the platform and version.",
    "toc_label": "Contents",
    "empty_label": "The English guide is being prepared.",
    "zoom_label": "Enlarge image",
    "close_label": "Close image",
    "sections": [
      {
        "title": "Library and collections",
        "description": "Nelkano organizes your games in a local library. You can filter by system, search by name, sort and group games to suit your preferences.",
        "bullets": "Search for a game by name or filter the library by system.\nSort games alphabetically or by the date they were added.\nSwitch between compact, large and list views.\nMark games as favorites and create collections to group them.\nPress and hold a game to select several games and add them to or remove them from a collection.\nRemoving a game from a collection keeps it in your library.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Importing games",
        "description": "On Android, use the document picker to add supported files; desktop has its own picker.",
        "bullets": "On Android, tap + in Library and select a file or a ZIP, RAR or 7z archive.\nAn archive can contain several recognized games. Password prompts for encrypted archives are not supported.\nFor PlayStation, provide the CUE and all tracks together or as a complete package.\nFor RPG Maker, provide the full game folder and resources; MV/MZ projects run on Android, not desktop.\nOn desktop, import individual ROMs, CUE discs with their tracks and RPG Maker XP projects in ZIP files. Desktop ZIP import is limited to those XP projects; general ROM archives are not supported.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Play and Continue",
        "description": "Open a game's details to start it or restore a save state.",
        "bullets": "Play starts the game; in-game saves are loaded through the game’s own menus.\nContinue appears on the details page when a state exists: it prioritizes the autosave, then another available state.\nChoosing a screenshot as cover art does not change the state used by Continue.\nChoose a specific state from Saves.\nContinue playing on Home lists recently opened games; it does not guarantee they have save states.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Saves and save states",
        "description": "You can save within the game or use Nelkano save states when the system supports them.",
        "bullets": "An in-game save is loaded through the game's own menus.\nA save state captures the current game session so you can resume from that point.\nNelkano provides five manual save slots per game.\nTap Save during gameplay and choose a slot. If it already contains a state, that state will be replaced.\nEnable Autosaves in Settings to update a separate slot approximately once a minute.\nIn Saves, you can browse states, filter them by game and sort them.\nSave state support depends on the system and the game.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Customizing a game's details",
        "description": "Change how each game appears in your library.",
        "bullets": "Use Select cover on the details page to choose a screenshot from an available state or restore the image.\nAdd the game to favorites or collections.\nCover art does not determine which state Continue loads.\nDeleting a game asks for confirmation and removes its imported copy and associated data. Keep anything you need beforehand.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Physical controllers",
        "description": "Use a controller recognized by Android and map its buttons for each system.",
        "bullets": "Pair the controller in Android's Bluetooth settings.\nIn Settings → Controls → Controller, you can check which button presses Nelkano detects.\nOpen Button mapping, select a system and tap the control you want to configure.\nPress the controller button you want to assign.\nYou can save and load controller configurations or restore the defaults.\nDuring gameplay, use full-screen mode to play with the controller.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Touch control editor",
        "description": "Adjust the control layout to play comfortably on your screen.",
        "bullets": "Open Settings → Controls → Control editor.\nSelect the system and portrait or landscape orientation.\nMove the controls and adjust their size.\nUse the system's button selector to show or hide actions such as Save, Load or the speed indicator.\nCheck the preview and tap Save.\nEach system stores a separate layout for each orientation.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Buttons during gameplay",
        "description": "The emulator buttons let you control the session and adjust the display.",
        "bullets": "Pause stops and resumes emulation.\nSave and Load appear when the core supports save states.\nFull screen expands the game area; Stretch can change the image’s proportions.\nDS and 3DS offer Both, Upper or Lower through Screens.\nThe speed indicator shows progress as a percentage of normal speed when the core supplies this information; it is not an FPS counter.\nAvailable controls depend on the core and modules. AUTO, RECORD and REPLAY are not available in the current controls.\nRestart is available only when supported by the core.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Local data and connections",
        "description": "Your library and saves are stored on your device.",
        "bullets": "Nelkano does not offer integrated Google Drive synchronization.\nYour Nelkano account is used for profiles, friends and connected features; it does not sync your library.\nA module can connect to other servers with your authorization. Review its permissions and the data it sends.\nKeep copies of your files and saves before deleting data or using modifications.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Second screen for Nintendo DS and Nintendo 3DS",
        "description": "Use another Android device to display one of the game's two screens.",
        "bullets": "Open Nelkano on both devices and connect them to the same local network.\nOn the receiving device, open Settings → Second screen and enable Use as second screen.\nOn the device you will play on, tap Find screens and select the receiving device.\nAccept the connection on the receiving device.\nWhen you run a DS or 3DS game, each device will display one screen.\nUse Swap screens to change which screen appears on each device.\nIf the lower screen is on the receiving device, you can use its touch input there.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Appearance and language",
        "description": "Adjust the Nelkano interface to suit your preferences.",
        "bullets": "Open Language and theme in Settings to choose Spanish or English and one of five palettes: dark, light, navy, slate or graphite.\nSave your choice to apply it.\nChanging the interface language does not translate games.\nControl positions and sizes are adjusted in the control editor.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Apply patches to GBA and DS games",
        "description": "Apply a compatible patch and add the result as a separate game.",
        "bullets": "Import the original GBA or DS game.\nOpen Patches in Settings or Apply patch on the game’s details page.\nSelect an IPS or xdelta/VCDIFF file and the exact game version required by the patch.\nIPS cannot verify by itself that you selected the right ROM.\nA modified copy is added to the library and the original is kept.\nThe copy uses its own saves; it does not inherit the original’s saves. BPS, UPS and PPF are not supported.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Translating Nintendo DS games",
        "description": "Integrated automatic game translation is not available.",
        "bullets": "You can apply a compatible translation patch through Patches.\nChanging Nelkano’s language changes only its interface.",
        "visible": "0",
        "image_uri": ""
      },
      {
        "title": "Nelkano account and friends",
        "description": "Manage your profile and contacts from the app.",
        "bullets": "Sign in through Account in Settings. Open Friends from the library to manage contacts.\nFind users and send requests; accept or reject incoming requests, cancel sent requests and remove friends.\nYou can edit your profile through the module.\nLocal play does not require an account.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Experimental online features",
        "description": "Online functionality is provided by optional modules for specific games.",
        "bullets": "Install a compatible online module and grant its permissions.\nGBA Online and Pokémon Online have their own capabilities and requirements; they do not provide universal multiplayer and are not essential bundled modules.\nCheck the module documentation and supported game versions.\nAvailability also depends on your account, permissions and connection.",
        "visible": "0",
        "image_uri": ""
      },
      {
        "title": "Streaming gameplay to the web",
        "description": "Use Streaming to send your game's video and audio to the Nelkano website.",
        "bullets": "Sign in with an account that has streaming permission.\nOpen a game and use Streaming to start broadcasting, accepting any platform authorization requested.\nOpen the nelkano.com Streaming viewer with the same account.\nStop broadcasting from the app when finished.\nGame video and audio are shared when supported by the core. The microphone and entire desktop are not captured.\nConnection and core capture support affect the result; streaming is not guaranteed for every system.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Reporting an error",
        "description": "In-app reports are reserved for authorized testers.",
        "bullets": "On Android this requires the official reports module and an account with Tester permission.\nIt is not available to every account or as a public SDK service.\nOther users can use the website’s contact channels.",
        "visible": "0",
        "image_uri": ""
      },
      {
        "title": "Modules and SDK",
        "description": "Extend Nelkano through .nelkmod packages.",
        "bullets": "Open Modules in Settings to import a package, review its author and permissions, and manage optional modules.\nBasics, Appearance, Control editor, Friends and Patches are essential and remain active.\nThe SDK supports pages, buttons, services, events and local data through JavaScript or TypeScript.\nSDK memory and temporary ROM modifications work on GBA; other cores do not expose these operations.\nModifications act while the module is active, but effects can remain in saves. Some modules require a fresh game or their presence to load it.\nSDK Studio uses simulated games and data. A visual editor generating module code is not yet available.",
        "visible": "1",
        "image_uri": ""
      }
    ]
  }
}
