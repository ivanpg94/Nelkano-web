        "title": "Personalización",
        "description": "Nelkano ofrece varias opciones de apariencia e idioma para la interfaz de la aplicación.",
        "bullets": "Temas disponibles: Oscuro, Claro, Azul marino, Pizarra y Grafito.\nEl idioma de la interfaz puede ser español o inglés.\nCambiar el idioma de la interfaz no traduce los juegos.",
