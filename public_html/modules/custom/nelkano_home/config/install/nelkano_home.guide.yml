        "title": "Editar juego",
        "description": "Puedes personalizar cómo aparece cada juego en la biblioteca: su nombre y su carátula.",
        "bullets": "Toca el título del juego en la biblioteca para renombrarlo.\nElige una captura de los slots S1–S5 para usarla como carátula del juego.\nEl slot cuya captura uses como carátula pasará a tener prioridad en la función Continuar.",
        "visible": "1",
