      {
        "title": "Biblioteca y colecciones",
        "description": "Nelkano organiza tus juegos en una biblioteca local. Puedes filtrar por sistema, buscar por nombre, ordenar y agrupar según tus preferencias.",
        "bullets": "Busca un juego por su nombre o filtra la biblioteca por sistema.\r\nOrdena los juegos alfabéticamente o por fecha de incorporación.\r\nCambia entre las vistas compacta, grande y de lista.\r\nMarca tus juegos favoritos y crea colecciones para agruparlos.\r\nMantén pulsado un juego para seleccionar varios y añadirlos o quitarlos de una colección.\r\nQuitar un juego de una colección lo conserva en la biblioteca.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Importar juegos",
        "description": "En Android, utiliza el selector de documentos para añadir tus archivos compatibles; escritorio tiene su propio selector.",
        "bullets": "En Android, pulsa + en Biblioteca y selecciona un archivo o un paquete ZIP, RAR o 7z.\nUn comprimido puede contener varios juegos reconocidos. No se admite la petición de contraseña para comprimidos cifrados.\nPara PlayStation, aporta el CUE y todas sus pistas, juntos o en un paquete completo.\nPara RPG Maker, aporta la carpeta completa del juego y sus recursos; los proyectos MV/MZ se ejecutan en Android, no en escritorio.\nEn escritorio, importa ROMs individuales, discos CUE con sus pistas y proyectos RPG Maker XP en ZIP. El importador ZIP de escritorio está limitado a esos proyectos XP; no admite paquetes generales de ROMs.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Jugar y continuar",
        "description": "Abre la ficha de un juego para iniciarlo o recuperar un estado guardado.",
        "bullets": "Jugar inicia el juego; los guardados internos se recuperan desde los menús del propio juego.\nContinuar aparece en la ficha cuando hay un estado disponible: prioriza el autoguardado y, si no existe, otro estado.\nLa captura elegida como carátula no cambia el estado que usa Continuar.\nDesde Guardados puedes elegir un estado concreto.\nLa sección Continuar jugando de Inicio muestra los juegos abiertos recientemente; no garantiza que tengan estados.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Guardados y estados",
        "description": "Puedes guardar desde el propio juego o utilizar los estados de Nelkano cuando el sistema lo permita.",
        "bullets": "El guardado del juego se recupera desde sus propios menús.\r\nUn estado conserva la situación de la partida para retomarla desde ese punto.\r\nNelkano dispone de cinco espacios de guardado manual por juego.\r\nPulsa Guardar durante la partida y elige un espacio. Si ya contiene un estado, se sustituirá.\r\nActiva Autoguardados en Configuración para actualizar un espacio independiente aproximadamente cada minuto.\r\nDesde Guardados puedes consultar los estados, filtrarlos por juego y ordenarlos.\r\nLa disponibilidad de los estados depende del sistema y del juego.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Personalizar la ficha de un juego",
        "description": "Cambia cómo aparece cada juego en tu biblioteca.",
        "bullets": "Utiliza Seleccionar carátula en la ficha para elegir una captura de un estado disponible o restablecer la imagen.\nAñade el juego a favoritos o colecciones.\nLa carátula no determina qué partida se carga al continuar.\nEliminar un juego pide confirmación y elimina la copia importada y sus datos asociados. Conserva antes lo que quieras guardar.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Mandos físicos",
        "description": "Utiliza un mando reconocido por Android y adapta sus botones a cada sistema.",
        "bullets": "Empareja el mando desde los ajustes de Bluetooth de Android.\r\nEn Configuración → Controles → Mando puedes comprobar qué pulsaciones detecta Nelkano.\r\nAbre Asignación de botones, selecciona un sistema y pulsa el control que quieras configurar.\r\nPresiona el botón del mando que quieras asignarle.\r\nPuedes guardar y cargar configuraciones de mando o restaurar los valores predeterminados.\r\nDurante la partida, utiliza la pantalla completa para controlar el juego con el mando.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Editor de controles táctiles",
        "description": "Ajusta la distribución de los controles para jugar cómodamente en tu pantalla.",
        "bullets": "Abre Configuración → Controles → Editor de controles.\r\nSelecciona el sistema y la orientación vertical u horizontal.\r\nMueve los controles y ajusta su tamaño.\r\nEn el selector de botones del sistema puedes mostrar u ocultar acciones como Guardar, Cargar o el indicador de velocidad.\r\nComprueba el resultado con la vista previa y pulsa Guardar.\r\nCada sistema conserva una distribución independiente para cada orientación.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Botones durante la partida",
        "description": "Los botones del emulador permiten controlar la partida y ajustar su presentación.",
        "bullets": "Pausa permite detener y reanudar la emulación.\nGuardar y Cargar aparecen cuando el core admite estados.\nPantalla completa amplía la zona de juego; Estirar puede cambiar las proporciones de la imagen.\nNDS y 3DS permiten elegir Ambas, Superior o Inferior desde Pantallas.\nEl indicador de velocidad muestra el porcentaje de avance respecto a la velocidad normal, cuando el core aporta esa información; no es un contador de FPS.\nLos controles disponibles dependen del core y de los módulos. AUTO, RECORD y REPLAY no son funciones disponibles de los controles actuales.\nReiniciar solo está disponible en los cores que lo admiten.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Datos locales y conexiones",
        "description": "La biblioteca y las partidas se almacenan en tu dispositivo.",
        "bullets": "Nelkano no ofrece sincronización integrada con Google Drive.\nLa cuenta Nelkano se utiliza para perfil, amigos y funciones conectadas; no sincroniza tu biblioteca.\nUn módulo puede conectarse a otros servidores con tu autorización. Revisa sus permisos y qué datos envía.\nConserva copias de tus archivos y partidas antes de borrar datos o usar modificaciones.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Segunda pantalla para Nintendo DS y Nintendo 3DS",
        "description": "Utiliza otro dispositivo Android para mostrar una de las dos pantallas del juego.",
        "bullets": "Abre Nelkano en ambos dispositivos y conéctalos a la misma red local.\r\nEn el dispositivo receptor, entra en Configuración → Segunda pantalla y activa Usar como segunda pantalla.\r\nEn el dispositivo donde vas a jugar, pulsa Buscar pantallas y selecciona el receptor.\r\nAcepta la conexión en el dispositivo receptor.\r\nAl ejecutar un juego de DS o 3DS, cada dispositivo mostrará una pantalla.\r\nUtiliza Intercambiar pantallas para cambiar cuál aparece en cada dispositivo.\r\nSi la pantalla inferior está en el receptor, puedes tocarla desde ese dispositivo.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Apariencia e idioma",
        "description": "Adapta la interfaz de Nelkano a tus preferencias.",
        "bullets": "Abre Idioma y tema en Ajustes para elegir español o inglés y una de las cinco paletas: oscuro, claro, navy, slate o graphite.\nGuarda la elección para aplicarla.\nEl idioma de la interfaz no traduce los juegos.\nLa posición y el tamaño de los controles se ajustan en el editor de controles.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Aplicar parches a juegos GBA y NDS",
        "description": "Aplica un parche compatible y añade el resultado como un juego independiente.",
        "bullets": "Importa el juego GBA o NDS original.\nAbre Parches en Ajustes o Aplicar parche en la ficha del juego.\nSelecciona un archivo IPS o xdelta/VCDIFF y el juego exacto que requiere el parche.\nIPS no permite verificar por sí mismo que has elegido la ROM correcta.\nSe añade una copia modificada a la biblioteca y se conserva el original.\nLa copia utiliza sus propios guardados; no hereda los del original. No se admiten BPS, UPS ni PPF.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Traducir juegos de Nintendo DS",
        "description": "La traducción automática integrada de juegos no está disponible.",
        "bullets": "Puedes aplicar un parche de traducción compatible mediante Parches.\nCambiar el idioma de Nelkano solo cambia la interfaz.",
        "visible": "0",
        "image_uri": ""
      },
      {
        "title": "Cuenta Nelkano y amigos",
        "description": "Gestiona tu perfil y tus contactos desde la aplicación.",
        "bullets": "Inicia sesión desde Cuenta en Ajustes. Abre Amigos desde la biblioteca para gestionar tus contactos.\nBusca usuarios y envía solicitudes; puedes aceptar o rechazar las recibidas, cancelar las enviadas y eliminar amigos.\nDesde el módulo puedes editar tu perfil.\nNo necesitas una cuenta para jugar localmente.",
        "visible": "1",
        "image_uri": ""
      },
      {
        "title": "Funciones online experimentales",
        "description": "El online se ofrece mediante módulos opcionales y juegos concretos.",
        "bullets": "Requiere instalar un módulo online compatible y autorizar sus permisos.\nLos módulos GBA Online y Pokémon Online tienen funciones y requisitos propios; no son multijugador universal ni se incluyen entre los módulos esenciales.\nConsulta la documentación del módulo y las versiones de juego admitidas.\nLa disponibilidad depende también de la cuenta, los permisos y la conexión.",
        "visible": "0",
