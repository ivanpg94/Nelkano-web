      {
        "title": "Reportar un error",
        "description": "Los reportes desde la app están reservados a testers autorizados.",
        "bullets": "En Android requiere el módulo oficial de reportes y una cuenta con permiso de Tester.\nNo es una función disponible para todas las cuentas ni un servicio público del SDK.\nLos demás usuarios pueden utilizar las vías de contacto de la web.",
        "visible": "0",
        "image_uri": ""
      },
      {
        "title": "Módulos y SDK",
        "description": "Amplía las funciones de Nelkano con paquetes .nelkmod.",
        "bullets": "Abre Módulos en Ajustes para importar un paquete, revisar su autor y permisos y gestionar los módulos opcionales.\nBásicos, Apariencia, Editor de controles, Amigos y Parches son esenciales y permanecen activos.\nEl SDK permite programar páginas, botones, servicios, eventos y datos locales con JavaScript o TypeScript.\nLas modificaciones de memoria y ROM temporal del SDK funcionan en GBA; otros cores no ofrecen esas operaciones.\nLas modificaciones actúan mientras el módulo está activo, pero sus efectos pueden quedar en el guardado. Algunos módulos exigen una partida nueva o su presencia para cargarla.\nSDK Studio usa juegos y datos simulados. El editor visual para generar código de módulos todavía no está disponible.",
