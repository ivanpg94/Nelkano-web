      {
        "title": "Emitir la partida en la web",
        "description": "Utiliza Streaming para enviar la imagen y el audio de tu partida a la web de Nelkano.",
        "bullets": "Inicia sesión con una cuenta que tenga permiso de emisión.\nAbre una partida y utiliza Streaming para iniciar la emisión, aceptando la autorización que solicite la plataforma.\nAbre el visor Streaming de nelkano.com con la misma cuenta.\nDetén la emisión desde la aplicación cuando termines.\nSe comparte imagen y audio de la partida cuando el core lo permite. No se captura el micrófono ni todo el escritorio.\nLa conexión y la captura del core condicionan el resultado; no se garantiza emisión de todos los sistemas.",
