nelkano_ai.status:
  path: '/api/nelkano/v1/ai/status'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::status'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE
nelkano_ai.submit:
  path: '/api/nelkano/v1/ai/questions'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::submit'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE
nelkano_ai.read:
  path: '/api/nelkano/v1/ai/questions/{id}'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::read'
  requirements:
    _access: 'TRUE'
    id: '[a-f0-9-]{36}'
  methods: [GET]
  options:
    no_cache: TRUE
nelkano_ai.cancel:
  path: '/api/nelkano/v1/ai/questions/{id}/cancel'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::cancel'
  requirements:
    _access: 'TRUE'
    id: '[a-f0-9-]{36}'
  methods: [POST]
  options:
    no_cache: TRUE
nelkano_ai.heartbeat:
  path: '/api/nelkano/v1/ai/worker/heartbeat'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::heartbeat'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE
nelkano_ai.claim:
  path: '/api/nelkano/v1/ai/worker/claim'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::claim'
  requirements:
    _access: 'TRUE'
  methods: [POST]
  options:
    no_cache: TRUE
nelkano_ai.result:
  path: '/api/nelkano/v1/ai/worker/questions/{id}/result'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::result'
  requirements:
    _access: 'TRUE'
    id: '[a-f0-9-]{36}'
  methods: [POST]
  options:
    no_cache: TRUE
nelkano_ai.worker_job:
  path: '/api/nelkano/v1/ai/worker/questions/{id}'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::workerJob'
  requirements:
    _access: 'TRUE'
    id: '[a-f0-9-]{36}'
  methods: [GET]
  options:
    no_cache: TRUE
nelkano_ai.credentials:
  path: '/admin/config/services/nelkan-ai'
  defaults:
    _form: '\Drupal\nelkano_ai\Form\WorkerKeyForm'
    _title: 'Conectar el PC de Nelkan IA'
  requirements:
    _permission: 'administer site configuration'
  options:
    no_cache: TRUE

nelkano_ai.tool_results:
  path: '/api/nelkano/v1/ai/questions/{id}/tool-results'
  defaults:
    _controller: '\Drupal\nelkano_ai\Controller\AiController::toolResults'
  requirements:
    _access: 'TRUE'
    id: '[a-f0-9-]{36}'
  methods: [POST]
  options:
    no_cache: TRUE
