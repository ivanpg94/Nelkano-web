      es:
        title: 'Modificar un juego'
        status: true
        body:
          value: |-
            <p>Un módulo puede cambiar el comportamiento de un juego durante la partida mediante <code>host.gameMod</code>. La base ofrece herramientas generales; tu código decide qué significan los datos y cuándo debe intervenir. No hay que añadir al emulador una función específica para cada idea.</p><p>Los primeros bloques de la etapa de modificación conectan memoria, valores numéricos, observación y reglas a GBA en Android nuevo y Windows/Linux. SDK Studio reproduce el contrato con memoria ficticia, sin ejecutar una ROM. No se anuncian las mismas herramientas para todos los cores.</p>
            <h2>Permisos y capacidades</h2><p>Añade a capabilities los permisos que utilices. Para los ejemplos completos de este capítulo:</p><pre><code>"capabilities": [
              "emulation.game-mod", "emulation.read",
              "emulation.memory.read", "emulation.memory.write", "runtime.events"
            ]</code></pre><p><code>emulation.game-mod</code> identifica el contrato nuevo y hace que un host antiguo rechace el paquete. Consultar capacidades necesita <code>emulation.read</code>; leer y listar reglas, <code>emulation.memory.read</code>; escribir y retirar reglas, <code>emulation.memory.write</code>; instalar reglas, lectura y escritura.</p><pre><code>const active = await host.emulation.snapshot();
            if (active) {
              const support = await host.gameMod.capabilities(active.session);
              console.log(support.systemId, support.spaces, support.frameRules);
            }</code></pre><p>La respuesta incluye session, gameId, systemId y simulated, los espacios disponibles y las funciones memoryRead, memoryWrite, atomicWrite, frameRules y memoryObserve. Cada espacio indica id, addressBits, byteOrder y regions; una región contiene id, start, length, readable y writable. Usa esos datos y maxRanges, maxBytes, maxRules y maxRuleBytes antes de operar. Un core sin soporte devuelve espacios vacíos, funciones false y límites cero.</p>
            <h2>Direcciones GBA</h2><p>GBA ofrece el espacio <code>cpu</code>, direcciones absolutas de 32 bits y orden little endian. EWRAM empieza en 0x02000000 y tiene 256 KiB; IWRAM empieza en 0x03000000 y tiene 32 KiB. Ambas admiten lectura y escritura. IO, paleta, VRAM, OAM y el bus de ROM se ofrecen solo para lectura. Una operación debe permanecer dentro de una región anunciada.</p><p>Las direcciones del bus de ROM no son offsets del archivo: tienen sus espejos de memoria. Para leer offsets del archivo original sigue existiendo <code>host.gameRuntime.rom</code>. La lectura utiliza un acceso de inspección que preserva el estado del cartucho y de la comunicación serie mientras consultas sus datos. El espacio cpu no permite escribir su bus ROM ni IO; el espacio rom descrito más abajo permite cambiar el cartucho cargado. El módulo debe conocer el formato y la dirección de los datos de su juego.</p>
            <h2>Leer y escribir por lotes</h2><p>El siguiente ejemplo está pensado para una ROM propia que reserve el byte 0x0203FFF0 como zona de prueba. No utilices esa dirección sobre otro juego sin investigar primero qué guarda allí.</p><pre><code>async function changeScratchByte(host, session) {
              const support = await host.gameMod.capabilities(session);
              if (!support.memoryRead || !support.atomicWrite) {
                throw new Error("Este core no permite esta modificación.");
              }
              const address = 0x0203FFF0;
              const current = await host.gameMod.read(session, {
                ranges: [{space: "cpu", address, length: 1}]
              });
              return host.gameMod.write(session, {
                writes: [{space: "cpu", address,
                  expected: current.ranges[0].data, data: "AQ=="}]
              });
            }</code></pre><p>read devuelve ranges con space, address y data en Base64. write recibe data y expected, ambos Base64 canónico de la misma longitud. <code>AQ==</code> representa un byte con valor 1. Las escrituras de un lote no pueden solaparse.</p><p>El host compara todos los bytes expected antes de escribir. Si el juego cambió alguno, devuelve <code>{applied:false, conflictIndex}</code>, con el índice del primer conflicto, sin modificar ningún byte del lote. Si se aplica todo, devuelve <code>{applied:true}</code>. Decide si quieres volver a leer; no repitas a ciegas una modificación fallida.</p>
            <h2>Trabajar directamente con números</h2><p>readValues lee u8, i8, u16, i16, u32, i32, f32 y f64. Cada entrada usa space, address y type; endian puede ser little o big y por defecto usa el orden del espacio. La respuesta incluye value, data Base64 y el endian efectivo. Un float no finito devuelve value:null y conserva data. Para comparar bits exactos, NaN, infinito o cero con signo utiliza read/write de bytes.</p>
            <pre><code>const current = await host.gameMod.readValues(session, {
              values: [{space: "cpu", address: 0x0203FFF0, type: "u16"}]
            });
            const previous = current.values[0].value;
            const result = await host.gameMod.writeValues(session, {
              writes: [{space: "cpu", address: 0x0203FFF0, type: "u16",
                expected: previous, value: (previous + 1) &amp; 65535}]
            });</code></pre><p>Este ejemplo necesita dos bytes reservados por una ROM propia. writeValues convierte y valida todo el lote antes de escribir. Conserva la comparación expected, el resultado applied/conflictIndex, la propiedad y los permisos de write. Rechaza enteros fuera de rango, fracciones en tipos enteros y desbordamientos de float. Admite hasta 32 valores. En un host anterior comprueba que readValues/writeValues existan antes de utilizarlos.</p>
            <h2>Recibir avisos cuando cambien los datos</h2><p>Además de emulation.game-mod y emulation.memory.read, observe necesita runtime.events. Consulta memoryObserve y los límites maxWatches, maxWatchBytes y maxWatchRanges. No se ejecuta JavaScript por cada frame: el adaptador toma muestras y el host entrega avisos agrupados.</p>
            <pre><code>await host.gameMod.observe(session, {
              id: "scratch-value", everyFrames: 4,
              ranges: [{space: "cpu", address: 0x0203FFF0, length: 2}]
            });
            // Dentro de onEvent(event):
            if (event.type === "game-memory-changed") {
              console.log(event.watchId, event.changes, event.ranges);
            }
            // Para dejar de observar:
            await host.gameMod.unobserve(session, "scratch-value");</code></pre><p>La base de comparación se captura al registrar. everyFrames acepta 1–600, por defecto 1. Las muestras se toman después de avanzar el juego; pausa y captura no cuentan. Se conserva la observación tras reiniciar/cargar en la misma sesión y vuelve a comparar al avanzar.</p><p>game-memory-changed contiene session, watchId, sequence, frame, changes y ranges con space, address, before y data en Base64. Cada observación mantiene como máximo un aviso pendiente: el primer before, el último data y cuántas muestras cambiaron. Incluso si un valor cambia y vuelve al inicial, changes puede ser mayor que cero con before y data iguales. No es una traza completa: cambios transitorios entre muestras pueden pasar inadvertidos.</p><p>El host consulta avisos aproximadamente cada 100 ms mientras está en primer plano, sin garantía de entrega exacta. frame es el contador del adaptador; Studio cuenta pasos sintéticos, no frames de una ROM. Tu módulo solo recibe sus observaciones. Repetir un id propio reemplaza la observación y descarta su aviso pendiente; unobserve hace lo mismo y devuelve true/false según existiera. Cerrar/cambiar sesión descarta las anteriores.</p><p>GBA comparte por sesión 16 observaciones, 32 rangos y 16 KiB observados. Observar no reserva zonas de escritura ni modifica el juego. Retirar un módulo que solo observe conserva la partida abierta.</p>
            <h2>Buscar valores que cambian</h2><p>Las búsquedas requieren emulation.game-mod y emulation.memory.read. Consulta memorySearch, maxSearches, maxScanBytes, maxSearchBytes y maxSearchResults. GBA y Studio comparten hasta cuatro búsquedas por sesión, 256 KiB por búsqueda y 1 MiB de capturas; una página devuelve hasta 128 resultados. Otros cores anuncian false/cero.</p>
            <pre><code>const search = await host.gameMod.searchStart(session, {
              space: "cpu", address: 0x02000000, length: 262144,
              type: "u16", mode: "unknown"
            });
            // Después de cambiar algo en el juego:
            const refined = await host.gameMod.searchRefine(session, {
              id: search.id, mode: "increased"
            });
            const page = await host.gameMod.searchRead(session, {
              id: search.id, offset: 0, limit: 32
            });
            await host.gameMod.searchClose(session, {id: search.id});</code></pre>
            <p>searchStart admite equal con value o unknown sin valor; los ocho tipos numéricos y endian little/big. Por defecto utiliza el orden del espacio. alignment admite 1/2/4/8, por defecto el tamaño del tipo: es el paso entre candidatos desde la dirección inicial. El rango debe caber en una región legible.</p><p>searchRefine conserva solo los candidatos que cumplen equal/notEqual (con value), changed/unchanged/increased/decreased (sin value). Compara con la última captura y actualiza esa base al terminar correctamente. changed/unchanged comparan bits; increased/decreased requieren números finitos. equal compara números, redondeando f32 a su representación. Los no finitos se entregan como null y no coinciden con un valor finito.</p>
            <p>Las respuestas incluyen id, matchCount, scannedBytes, revision, space, address, length, type, endian, alignment y paged. searchRead añade offset, results y hasMore. Los resultados incluyen dirección, tipo, orden, value y data Base64 de la última captura; no lee de nuevo en tiempo real. Se conservan todos los candidatos aunque se consulten por páginas. Las capturas usan tramos de hasta 32 KiB: con el juego en marcha no garantizan un instante simultáneo; pausa explícitamente si lo necesitas.</p><p>Las búsquedas son privadas por módulo y autor. searchClose devuelve false si no existe una búsqueda propia. Retirar un módulo que solo busca conserva la partida abierta. Cerrar o cambiar sesión descarta las búsquedas; reset/load dentro de la misma sesión conserva la captura anterior hasta refinar.</p>
            <h2>Explorador de memoria en Studio</h2><p>Pulsa Explorar memoria, abre GBA de prueba y elige dirección, tipo y rango. Puedes leer bytes y valores, buscar un número conocido o empezar con valor desconocido, conservar direcciones que cambiaron/aumentaron/disminuyeron, seleccionar un resultado y generar lectura, escritura comprobada u observación en JavaScript o TypeScript. Copiar código entrega funciones editables: incorpóralas a tu módulo y declara sus permisos. La escritura generada lee primero expected y comprueba el resultado; observar requiere también runtime.events.</p><p>Cambiar valor de prueba modifica exclusivamente RAM sintética y respeta conflictos de propiedad con módulos. Cerrar el explorador libera sus búsquedas; los cambios sintéticos se conservan hasta cerrar/restablecer la sesión. Studio no conecta con partidas reales ni modifica automáticamente los archivos del módulo. Este generador es una primera herramienta de autor; el constructor visual de páginas sigue pendiente.</p>
            <h2>Reglas que se ejecutan junto al core</h2><p>installRule registra una regla propia de la sesión. Antes de avanzar cada frame, el core compara sus condiciones y los expected de todas las escrituras. Solo aplica el lote cuando todo coincide. No llama a JavaScript ni espera red en cada frame; con el juego pausado la regla no avanza.</p><p>Ejemplo para una ROM propia que reserve también 0x0203FFF1 como señal: cuando ese byte valga 1 y el anterior valga 0, la regla escribirá 2 en el anterior.</p><pre><code>await host.gameMod.installRule(session, {
              id: "scratch-rule",
              conditions: [{space: "cpu", address: 0x0203FFF1,
                expected: "AQ=="}],
              writes: [{space: "cpu", address: 0x0203FFF0,
                expected: "AA==", data: "Ag=="}]
            });</code></pre><p>conditions es opcional. Las condiciones pueden consultar regiones de solo lectura, como IO y el bus ROM. Las escrituras solo acceden a RAM o al espacio rom cargado de GBA; no habilita escritura de IO. Una vez cambiado el byte a 2, expected ya no coincide; la regla solo volverá a aplicarse si el juego restablece los datos esperados. Reinstalar un mismo id sustituye tu regla y devuelve <code>{id}</code>.</p><pre><code>const myRules = await host.gameMod.listRules(session);
            const removed = await host.gameMod.removeRule(session, "scratch-rule");</code></pre><p>listRules devuelve únicamente tus reglas con id, conditions y writes. removeRule devuelve true si retira tu regla existente y false si no existía. Ningún módulo puede retirar o listar reglas privadas de otro módulo, aunque compartan autor.</p>
            <h2>Límites y conflictos</h2><p>GBA admite hasta 32 rangos y 32 KiB por operación. Una regla puede sumar como máximo 32 condiciones y escrituras. El conjunto de módulos comparte un máximo de 16 reglas y 32 KiB de bytes de condiciones y escrituras por sesión. Consulta los límites anunciados; no supongas que todos los hosts son iguales.</p><p>Si un módulo intenta escribir en una zona ya reservada por otro, se rechaza con <code>modification-conflict</code>. No se cambia silenciosamente de propietario. Retirar una regla detiene su ejecución, pero las zonas que ha reservado siguen perteneciendo a ese módulo hasta cerrar la sesión, porque pueden conservar sus efectos.</p><p>El mismo arbitraje evita solapamientos entre el contrato nuevo y las escrituras de <code>host.gameRuntime.patch</code>. Los módulos que solo utilizan ese puerto anterior mantienen su comportamiento de retirada; el cierre de la sesión al retirar un módulo corresponde a quien ha utilizado las nuevas escrituras o reglas de gameMod.</p>
            <h2>Retirar el módulo y conservar partidas</h2><p>La ROM original permanece intacta. Cerrar la sesión elimina las reglas y modificaciones activas. Reiniciar el juego o cargar un estado dentro de la misma sesión conserva las reglas del módulo activo; sus condiciones y expected se comprueban de nuevo antes de actuar.</p><p>Retirar una regla no restaura bytes anteriores. Desactivar, actualizar o perder el proceso de un módulo cierra la sesión que ha modificado, incluso si ya retiró su regla, para no seguir jugando con su intervención retirada a medias. Una referencia de sesión antigua deja de ser válida.</p><p>Se utilizan los guardados habituales. Los cambios que el juego haya guardado pueden permanecer después de desactivar el módulo; el usuario decide si utiliza una partida modificada. Este incremento todavía no obliga a empezar una partida nueva ni impide cargar un guardado porque falte un módulo.</p>
            <h2>Probar y ampliar</h2><p>Comprueba permisos, bytes esperados incorrectos, rangos no disponibles, conflicto entre módulos, carga/reinicio, desactivación y cambio de sesión. Studio sirve para probar contrato y código con simulated:true. Después exporta el módulo y pruébalo con una ROM propia en la app real; una simulación no verifica un core ni todos los juegos.</p><p>Los contratos anteriores de GBA Online y Pokémon Online se mantienen. La plataforma añade servicios, entidades, páginas, conexiones, tareas, archivos, credenciales y requisitos de guardados. Memoria y ROM temporal se verifican en GBA; otras familias mantienen sus capacidades explícitas. El constructor visual de páginas se consultará antes de desarrollarlo.</p>
            <h2>Introducir botones desde un módulo</h2><p>Con emulation.game-mod y emulation.input, gameMod.input(session,{buttons:[{code,pressed}]}) mantiene pulsaciones propias, combinadas con los controles del usuario y de otros módulos. Al desactivar libera solo las propias. Consulta capabilities para descubrir la función; cada core interpreta su conjunto compatible de botones. Studio simula este contrato. Esta ampliación no certifica modificación de memoria en otros cores ni implementa todavía los requisitos de módulos al cargar una partida.</p>
            <h2>Cambiar la ROM cargada sin alterar el archivo</h2><p>GBA añade el espacio rom, con direcciones desde el offset cero y longitud real del cartucho cargado. Puede utilizar las mismas lecturas, escrituras comprobadas, valores numéricos, búsquedas, observaciones y reglas. Un lote mixto de RAM y ROM se aplica entero o no aplica nada. Cambia el contenido de esa sesión: código o recursos que el propio juego interprete. Al volver a abrir se lee el archivo original. El espacio cpu conserva su bus ROM de solo lectura.</p><pre><code>const original = await host.gameMod.read(session, {ranges:[{space:"rom",address:offset,length:1}]});
            await host.gameMod.write(session, {writes:[{space:"rom",address:offset,expected:original.ranges[0].data,data:nuevoByteBase64}]});</code></pre><p>Los permisos siguen siendo emulation.game-mod y emulation.memory.read/write. No expande la longitud ni vuelve a detectar el tipo de guardado al modificar cabeceras. Los estados no contienen la ROM modificada: declara la dependencia del módulo y prepara sus cambios cuando se vuelva a cargar. Studio utiliza ROM sintética. Recursos/scripts con nombre de proyectos RPG Maker conservan gameRuntime y sus límites; no se añade un motor de scripts universal a los demás cores.</p><h2>Declarar que una partida necesita el módulo</h2><pre><code>await host.gameMod.configureSave({gameId,newGame:true});</code></pre><p>Decláralo antes de abrir el juego, con emulation.game-mod. Siempre registra al módulo y su autor como necesarios para ese guardado; newGame es opcional y exige comenzar una partida nueva. Guarda en los slots, autoguardado y batería habituales, sin perfiles separados. Al cargar, si falta un módulo o su autor no coincide, la aplicación rechaza la operación y conserva el archivo. Una partida anterior sin marca de nueva no cumple newGame aunque tenga otra dependencia.</p><p>Los guardados sin requisitos conservan sus bytes. Las cabeceras de requisitos son versionadas y admiten la versión anterior. Las sesiones con requisitos arrancan pausadas para que se preparen antes de continuar. Retirar un módulo que solo exige presencia pausa sin descartar progreso y permite guardar antes de salir; no permite continuar sin él. Los módulos que escribieron memoria, ROM o reglas mantienen el cierre de sesión de gameMod. Iniciar nuevo se admite en CHIP-8, GB/GBC, NES, SMS/GG, NGP, GBA, MD, SNES, NDS y PS1; los demás cores lo rechazan explícitamente. Studio reproduce metadatos, no batería real.</p>
          summary: ''
          format: basic_html
