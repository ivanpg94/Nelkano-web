        title: 'Amigos: cuenta, solicitudes y perfil'
        status: true
        body:
          value: |-
            <p>Amigos gestiona el acceso a la cuenta, las solicitudes y el perfil. Tu módulo puede abrir sus formularios, añadir acciones junto a los amigos o recibir avisos de cambios.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-19-friends.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-19-friends.webp" width="600" height="373" alt="Amigos y solicitudes con contactos ficticios." data-caption="Amigos y solicitudes con contactos ficticios."></a><h2>Probarlo en Studio</h2><ol><li>Abre modules/friends o crea un proyecto con Amigos (simulación).</li><li>En el visor, pulsa Amigos junto al buscador de Biblioteca o Guardados. También puedes abrirlo desde la sección CUENTA de Ajustes.</li><li>Accede con demo@nelkano.test y Nelkano123, o registra una cuenta ficticia.</li><li>Busca otro usuario escribiendo al menos dos caracteres y prueba las solicitudes.</li><li>Abre Editar perfil para cambiar el nombre, estado o color.</li></ol><p>Puedes enviar, cancelar, aceptar y rechazar solicitudes, y eliminar amistades con confirmación. El rol no es editable y la foto es simulada. Las cuentas y amistades de Studio se reinician al cerrar el servidor de desarrollo: no se consulta nelkano.com ni se envían correos. Utiliza credenciales de prueba.</p>
            <h2>Usar la cuenta en la app</h2><p>Abre Amigos desde Biblioteca o Guardados, o pulsa Iniciar sesión en Ajustes → General → CUENTA. Accede con tu cuenta de nelkano.com; si te registras, actívala desde el correo. Una vez dentro puedes gestionar amistades y editar el perfil con foto. El rol lo decide el servidor.</p>
            <h2>Crear tus propios formularios de acceso</h2><pre><code>const account = await host.account.snapshot();
            await host.account.login({email, password});
            await host.account.register({name, email, password,
              password_confirm: confirmation, terms: true});
            await host.account.logout();</code></pre><p>Declara account.session. La identidad pública incluye uid, signedIn, nombre, correo, permiso friends y rol. El módulo define sus formularios y validaciones; los tokens los conserva la app.</p>
            <h3>Consultar una ruta de cuenta autorizada</h3><pre><code>const account = await host.account.snapshot();
            const response = await host.network.request({
              method: "GET", path: "/api/nelkano/friends",
              accountUid: account.uid
            });</code></pre><p>Declara <code>network.account</code>. La app comprueba la cuenta de la petición y devuelve <code>status</code> y <code>body</code>. Android realiza la petición autenticada; Studio devuelve datos ficticios. Para un servidor propio utiliza las conexiones externas y sus permisos.</p>
            <h3>Seleccionar una foto</h3><pre><code>const image = await host.resources.pickImage();
            if (!image.cancelled) {
              // Conserva image.resourceId hasta guardar el perfil.
            }</code></pre><p>Requiere resources.image. Recibes una referencia del host y, si está disponible, una vista previa. La imagen se publica al guardar el perfil con avatarResource en POST /api/nelkano/profile; elegirla no la publica.</p><p>Se admiten PNG, JPEG y WebP de hasta 4 MiB. La referencia pertenece al módulo y a la cuenta que la eligieron y caduca a los diez minutos. Las filas pueden mostrar avatar.url; Android descarga las imágenes de nelkano.com/sites/ y Studio utiliza una foto simulada.</p>
            <h2>Conservar la sesión</h2><p>Android cifra la sesión con Android Keystore, valida los permisos firmados y renueva los tokens. Cerrar sesión elimina la copia local e intenta revocarla en el servidor. Los tokens no llegan al módulo.</p>
            <h2>Integrarte con Amigos</h2><p>Declara modules.hooks y añade a consumes el proveedor nelkano.friends, el nombre del gancho y la versión 1.0.0. Usa optional:false si tu módulo necesita Amigos activo.</p>
            <h3>Añadir una acción a un amigo</h3><pre><code>await host.hooks.contribute("nelkano.friends", "friend-actions", "invite", {label: "Invitar a mi mundo", scope: "friends"});</code></pre><ul><li><strong>scope:</strong> friends, incoming, outgoing o search. Si lo omites, la acción aparece en todos.</li><li><strong>shortLabel:</strong> etiqueta compacta opcional de 1 a 32 caracteres. Si falta, se utiliza label.</li><li><strong>Callback:</strong> Amigos llama a onHook con hook friend-actions, operation execute y value {accountUid, friend, scope}. contributionId identifica tu botón.</li><li><strong>Respuesta:</strong> devuelve {message} para mostrar el resultado.</li></ul><p>Implementa la acción en tu módulo: el ejemplo solo añade el botón de invitación. Las acciones se retiran al desactivarlo y se rechazan si la cuenta o la lista han cambiado.</p>
            <h3>Consultar las amistades</h3><pre><code>const data = await host.hooks.invoke("nelkano.friends", "friends-data", "refresh", {});</code></pre><p>refresh consulta el servidor y requiere sesión. snapshot devuelve lo ya cargado: una lista vacía no confirma que se haya consultado el servidor.</p><p>La respuesta incluye revision, account y las listas friends, incoming y outgoing. Cada usuario tiene uid, name, statusText, avatarColor y avatarUrl. No se comparten correo, contraseña ni tokens.</p>
            <h3>Recibir cambios</h3><pre><code>await host.hooks.contribute("nelkano.friends", "friends-events", "changes", {});</code></pre><p>Amigos llama a onHook con operation changed y un value que incluye el snapshot y type: session-changed, friends-updated o profile-updated. Conserva esos datos; evita llamar de vuelta a Amigos dentro del mismo callback.</p><p>Son avisos de las operaciones del módulo, no presencia en tiempo real ni notificaciones push. Se admiten hasta 16 acciones y 8 receptores. El fallo de un receptor no interrumpe la operación principal.</p>
            <h3>Ejecutar el ejemplo de integración</h3><ol><li>Ejecuta .\nelkmod.cmd example friends-hooks C:/mis-modulos/mi-integracion.</li><li>Carga Amigos y el ejemplo en Studio.</li><li>Pulsa Invitar a mi mundo (ejemplo) junto a un amigo y comprueba la respuesta.</li></ol><p>El ejemplo demuestra la llamada, sin crear un mundo ni enviar una invitación real. Se exporta por separado. Para conectar jugadores, consulta el capítulo Multijugador.</p>
            <h2>Abrir los formularios de Amigos</h2><p>Consume account-access 1.0.0 de nelkano.friends:</p><ul><li><strong>open:</strong> devuelve el modal de acceso o la lista de Amigos, según la sesión.</li><li><strong>dispatch:</strong> recibe {action, payload} y ejecuta las acciones del formulario. Conserva sus actionId al reenviarlas.</li><li><strong>snapshot:</strong> devuelve la identidad pública.</li></ul><p>El modal mantiene el contexto de la pantalla de origen. Utiliza kind:panel, layout:form, un ID estable por cuenta y dismissAction:close. Cerrar conserva sesión, búsqueda, pestaña y listas; cambiar de cuenta inicia un borrador nuevo.</p>
            <p>La búsqueda es global, por nombre o correo. Espera 350 ms tras escribir y necesita al menos dos caracteres. Las pestañas separan Amigos y Solicitudes; el contador muestra las recibidas pendientes y las enviadas tienen su propia sección. Eliminar amigo está en ⋮ y pide confirmación. La conexión entre jugadores se abre desde el modal de Multijugador.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/amigos
  -
    uuid: de520020-2026-4000-8000-000000000016
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 160
    translations:
      es:
        title: 'Mandos y segunda pantalla'
        status: true
        body:
          value: '<p>Reutiliza los formularios de Nelkano básicos para configurar mandos o conectar una segunda pantalla. Si necesitas una interfaz propia, el SDK también ofrece sus operaciones.</p><h2>Configurar un mando</h2><ol><li>Empareja el mando en los ajustes de Bluetooth de Android.</li><li>En Nelkano abre Ajustes → General → Controles → Mando Bluetooth.</li><li>Elige un sistema en Emulador, toca la asignación que quieres cambiar y pulsa el botón físico o mueve el eje.</li></ol><p>Desde el mismo formulario puedes restaurar las asignaciones del sistema o guardar y cargar perfiles con nombre.</p><p>Importar archivo y Exportar archivo abren el selector de documentos de Android o Desktop. El respaldo JSON incluye sistema, asignaciones, perfiles y máscaras PS1, hasta 96 KiB. También puedes usar Copiar / pegar asignaciones. Un respaldo inválido se rechaza sin sustituir la configuración.</p><p>Solicita <code>input.gamepad</code>. El puerto ofrece estas operaciones:</p><ul><li><code>host.input.snapshot()</code>: consultar dispositivos.</li><li><code>configure(bindings, ps1Bindings?)</code>: aplicar asignaciones.</li><li><code>capture(device?)</code>: esperar un botón durante un máximo de 30 segundos.</li><li><code>settings()</code>: abrir los ajustes Bluetooth del host.</li><li><code>release()</code>: liberar el control de las asignaciones.</li><li><code>host.input.importProfile()</code>: abrir un respaldo; devuelve state o cancelled.</li><li><code>exportProfile(state)</code>: exportarlo; devuelve saved o cancelled.</li></ul><p>El usuario elige el documento. El módulo recibe los datos, sin rutas de archivos, y debe validar state antes de aplicarlo. Las asignaciones usan valores como <code>KEY:96</code> o <code>AXIS:0:POS</code>.</p><p>Solo un módulo puede controlar las asignaciones a la vez. Al desactivarlo se liberan las teclas y se cancela cualquier captura pendiente.</p><p>Para usar <code>configure</code> y <code>capture</code> directamente, configura primero el mapa y captura después desde el mismo módulo. En la app, Nelkano básicos suele tener ese control: otro módulo recibe <code>input-owner-busy</code> si intenta sustituirlo. En ese caso utiliza su gancho <code>gamepad</code>, descrito más abajo.</p><p><code>settings()</code> solicita los ajustes Bluetooth al sistema. En Linux puede ser necesario abrirlos manualmente.</p><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-13-controller.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-13-controller.webp" width="600" height="672" alt="Asignación de botones del mando (ejemplo)." data-caption="Asignación de botones del mando (ejemplo)."></a><h2>Conectar una segunda pantalla</h2><p>Durante una partida de Nintendo DS o Nintendo 3DS, abre <strong>Pantallas</strong> → <strong>Segunda pantalla</strong>. También puedes entrar por Ajustes → General → Apariencia → Segunda pantalla.</p><p>Ambas/Superior/Inferior cambia la imagen del dispositivo principal. Al conectar se activa la pantalla completa una vez; puedes salir de ella con <strong>Pantalla completa</strong> sin desconectar el receptor. <strong>Intercambiar pantallas</strong> mantiene esa elección.</p><ol><li>Conecta ambos dispositivos a la misma red local.</li><li>En el receptor, pulsa Usar como segunda pantalla y elige Sí.</li><li>En el emisor, pulsa Buscar pantallas y Conectar junto al receptor.</li><li>Acepta el emparejamiento en el receptor si se solicita.</li></ol><p>El formulario separa RECEPTOR, EMISOR y DISPOSITIVOS RECORDADOS. Cerrarlo conserva la conexión.</p><p>Cada partida empieza enviando la pantalla superior al receptor y mostrando la inferior en el dispositivo principal. <strong>Intercambiar pantallas</strong> invierte ese reparto durante la partida; al abrir otra se restablece. La entrada táctil del receptor corresponde a la pantalla inferior. El juego debe producir dos pantallas.</p><p>Solicita <code>media.second-screen</code>. El puerto incluye <code>host.secondScreen.snapshot()</code>, <code>discover()</code>, <code>connect(id)</code>, <code>disconnect()</code>, <code>receiver(enabled)</code>, <code>pair(enabled)</code>, <code>swap()</code> y <code>forget(id)</code>.</p><p>Para conectar utiliza el ID de un receptor descubierto; no se aceptan direcciones arbitrarias.</p><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-14-second-screen.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-14-second-screen.webp" width="600" height="565" alt="Opciones de conexión de Segunda pantalla (ejemplo)." data-caption="Opciones de conexión de Segunda pantalla (ejemplo)."></a><h2>Reutilizar los formularios de Básicos</h2><p>En consumes declara el proveedor <code>nelkano.basics</code>, el gancho <code>gamepad</code> o <code>second-screen</code> y la versión <code>1.0.0</code>.</p><ul><li>gamepad: snapshot devuelve devices, bindings y settings. set recibe el respaldo completo: schemaVersion: 1, selectedSystem, bindings, profiles y ps1Bindings.</li><li>ps1Bindings contiene las máscaras PS1, incluidas combinaciones y L3/R3. En la asignación predeterminada, A físico corresponde a Cruz y B a Círculo.</li><li>second-screen: snapshot, discover, connect, disconnect, receiver, pair, swap y forget. Pasa id a connect/forget y enabled a receiver/pair.</li></ul><p>Invoca las operaciones con <code>host.hooks.invoke(provider, hook, operation, value)</code>.</p><h2>Qué reproduce Studio</h2><p>Studio simula el mando y el receptor. Importar un perfil devuelve <code>cancelled</code>; exportarlo simula el guardado sin escribir un archivo. Usa Copiar / pegar asignaciones para revisar el JSON y prueba Bluetooth y segunda pantalla en los dispositivos de destino.</p><h2>Streaming</h2><p>Para emitir una partida desde Básicos, consulta <a href="book://de520020-2026-4000-8000-000000000019/es">Streaming</a>.</p><h2>Mandos PSP, GameCube y Switch</h2><p>Controles permite asignar botones de PSP y GameCube. El SDK conserva el perfil Switch para simulación y desarrollo; Switch queda excluido de las apps Android y Desktop. PSP separa cruceta y stick; GameCube, cruceta, stick principal y C-stick. Los ejes se asignan por direcciones con umbrales digitales: no hay inclinación proporcional ni presión progresiva de gatillos. Android lee eventos del sistema y Windows/Linux usa SDL.</p><h2>Navegar por la app con el mando</h2><p>La app permite navegar con mando en Android, Windows y Linux. Usa un mapa predeterminado o las reasignaciones reconocidas. Nelkano básicos gestiona las asignaciones de juego y los perfiles guardados.</p><ul><li>Cruceta o stick: moverse entre botones, juegos y opciones. El elemento seleccionado queda resaltado.</li><li>A o Start: aceptar o abrir.</li><li>B o Select: cerrar la ventana o volver.</li><li>L/R: recorrer Home, Biblioteca, Guardados y Ajustes cuando no hay una ventana superpuesta.</li><li>X: seleccionar o quitar de la selección el juego resaltado en Biblioteca.</li></ul><p>En un campo <code>select</code>, aceptar abre la lista y vuelve a aceptar para elegir. Los selectores con pestañas tienen un botón por opción. Izquierda/derecha cambia los deslizadores de cinco en cinco; aceptar sobre un campo de texto permite editarlo. Los componentes del SDK reciben esta navegación automáticamente.</p><p>Solo el diálogo abierto recibe las acciones del mando. La app libera las pulsaciones del juego al abrir menús, pausar o perder el foco, y no transmite un botón mantenido al cerrar la ventana. Durante una captura, la pulsación sirve para asignar el botón.</p><h2>Mando durante una partida</h2><p>En pantalla completa, el mando controla la partida. Fuera de ella, navega por la interfaz. CHIP-8 también recibe el mando en su vista normal.</p><ul><li>SNES incluye X/Y.</li><li>PS1 separa L/R de L2/R2 y admite L3/R3.</li><li>El perfil simulado de Switch separa L/R de ZL/ZR.</li><li>En Android se capturan LTRIGGER, RTRIGGER, BRAKE y GAS, además de los sticks. Reasignar un gatillo sustituye su función predeterminada.</li></ul><p>Las plantillas del SDK utilizan el mismo catálogo y resolvedor que la app. Las asignaciones y los archivos de configuración existentes se conservan.</p><p>3DS convierte el stick a las direcciones admitidas por su adaptador. El perfil Switch se conserva para simulación y desarrollo del core PC, sin disponibilidad en las apps. Prueba el mando concreto y Steam Input en el dispositivo de destino; el visor de Studio solo utiliza entradas ficticias.</p><h2>Multijugador y mando PS1</h2><p>Multijugador viene incluido y ofrece conexiones de GB/GBC, GBA y NDS. La consola compartida PS1 es un prototipo técnico y no aparece en esos menús.</p><p>Si vas a usar host.sharedConsole, comprueba capabilities(session).supported. El adaptador real disponible es PS1 Android; Studio simula el contrato. El capítulo Multijugador detalla sus permisos, fragmentos y ganchos.</p><h2>Cerrar o cancelar un formulario</h2><p>Mando Bluetooth y Segunda pantalla se abren sobre Ajustes. Cancelar al guardar/cargar un perfil o al cambiar el modo de segunda pantalla vuelve a su formulario principal. La × cierra el formulario sin borrar asignaciones ni interrumpir una conexión activa.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/mandos-segunda-pantalla
  -
    uuid: de520020-2026-4000-8000-000000000017
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 170
    translations:
      es:
        title: 'Idioma y temas'
        status: true
        body:
          value: '<p>Tu módulo puede aportar un tema o un diccionario para la interfaz. Los usuarios los eligen en Ajustes → <strong>Idioma y tema</strong>, junto a los idiomas español/inglés y los temas Oscuro, Claro, Azul marino, Pizarra y Grafito.</p><p>El formulario muestra la selección guardada. Cambiar solo el idioma o el tema conserva la otra opción, tanto en Android como en Studio.</p><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-07-language-dark.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-07-language-dark.webp" width="600" height="370" alt="Apariencia con el tema Oscuro (ejemplo)." data-caption="Apariencia con el tema Oscuro (ejemplo)."></a><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-08-language-light.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-08-language-light.webp" width="600" height="370" alt="Tema Claro e interfaz en inglés (ejemplo)." data-caption="Tema Claro e interfaz en inglés (ejemplo)."></a><h2>Añadir un tema</h2><ol><li>Declara las paletas en <code>manifest.skins</code> y solicita <code>presentation.appearance</code>.</li><li>Consulta los temas instalados con <code>host.appearance.snapshot()</code> y aplica uno con <code>host.appearance.apply()</code>. Ambas llamadas necesitan también <code>appearance.locale</code>.</li></ol><p>Utiliza un ID devuelto por <code>snapshot()</code>: contiene autor, módulo y nombre del tema. No lo construyas a mano.</p><h2>Añadir un idioma</h2><p>Para ofrecer un idioma, solicita <code>appearance.locale</code> y llama a <code>host.appearance.apply({language, skinId, strings})</code>. En strings, cada clave es un texto original en español y cada valor, su traducción.</p><ul><li>Máximo: 2048 textos, claves de 512 caracteres y traducciones de 1024.</li><li>La petición completa debe caber en 128 KiB.</li><li>Un texto sin traducción conserva el original. Los nombres de juegos y los textos del usuario no se traducen automáticamente.</li></ul><h2>Ganchos de Apariencia</h2><p>El proveedor <code>nelkano.appearance</code> publica tres ganchos, versión 1.0.0:</p><ul><li>settings: snapshot consulta la selección y set aplica language/skinId.</li><li>theme-options: añade una opción con label y skinId de una paleta instalada.</li><li>locale-options: añade label, language y strings.</li></ul><p>Los datos deben caber en los límites generales de los ganchos. Para un diccionario grande, aplica el idioma desde tu módulo mediante appearance.</p><p>Apariencia cambia los colores y textos de los componentes compartidos. Para diseñar la interfaz de tu módulo utiliza los componentes del SDK; un tema no añade vistas Android ni instala un motor nativo V2.</p><p>Studio aplica temas e idiomas al visor. En la app, Apariencia es esencial y recupera la elección al iniciar. Un tema de otro módulo está disponible mientras su proveedor siga instalado y activo.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/idioma-temas
  -
    uuid: de520020-2026-4000-8000-000000000018
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 180
    translations:
      es:
        title: 'Parches de juegos'
        status: true
        body:
          value: '<p>El módulo Parches está temporalmente excluido de los paquetes cargados en Android y escritorio, pendiente de revisión. La app no muestra Aplicar parche ni registra el proveedor nelkano.patches; tampoco carga paquetes residuales ni admite importar manualmente ese módulo mientras siga excluido. Sus fuentes, el motor y host.patches se conservan: no se elimina la API ni se borran juegos, copias o guardados existentes. Studio conserva un ejemplo simulado; no acredita disponibilidad del módulo en la app.</p><h2>Aplicar un parche desde tu módulo</h2><p>El servicio del SDK crea una copia modificada de un juego GBA o NDS y conserva la ROM original.</p><ol><li>Solicita <code>resources.patch</code>.</li><li>Abre el selector con <code>host.patches.pick()</code>. Devuelve resourceId y name, o cancelled.</li><li>Aplica la selección con <code>host.patches.apply({resourceId, gameId, title})</code>. title es opcional.</li></ol><p>resourceId pertenece al módulo que abrió el selector, caduca a los diez minutos y se consume al aplicar el parche correctamente. No es una ruta ni puede utilizarlo otro módulo.</p><p>El resultado contiene gameId y title del juego creado. La copia conserva el sistema y la extensión del original; sin otro título, utiliza el original seguido de «(parche)». Repetir el mismo resultado conserva una sola identidad en la biblioteca. Si falla, no se publica un juego. Se comprueba la cabecera del resultado, pero un IPS no garantiza que hayas elegido la ROM correcta: utiliza la versión exacta que pide su autor.</p><h2>Formulario conservado como referencia</h2><p>El código del ejemplo Parches conserva el gancho <code>apply-patch</code> de <code>nelkano.patches</code>, versión <code>1.0.0</code>: formats consulta los formatos y sistemas; apply recibe gameId y title opcional, abre su propio selector y devuelve el juego creado o cancelled. No acepta referencias de otro módulo. Este proveedor no se carga en la app actual: no lo declares como dependencia disponible.</p><h2>Límites del servicio</h2><ul><li>Sistemas: GBA y NDS.</li><li>Formatos: IPS y xdelta/VCDIFF; BPS, UPS, PPF e IPS32 no están admitidos.</li><li>Tamaño máximo del parche: 64 MiB.</li></ul><p>Las operaciones de Android y Desktop aplican el parche al archivo. Studio simula el formulario y la selección. Si tu módulo utiliza este servicio, comprueba el resultado con una ROM y un parche reales en cada plataforma; una copia creada correctamente no acredita jugabilidad.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/parches
  -
    uuid: de520020-2026-4000-8000-000000000019
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 190
    translations:
      es:
        title: 'Streaming de la partida'
        status: true
        body:
          value: |-
            <p>Streaming permite ver la partida en la web. La cuenta necesita el permiso de streaming del servidor.</p><ol><li>Inicia sesión en Nelkano con Amigos y abre un juego.</li><li>En los ajustes de la partida, abre Streaming, incluido en Nelkano básicos.</li><li>Revisa las opciones y pulsa Iniciar emisión.</li></ol><p>Android pide confirmar el envío de vídeo y audio del juego por WebRTC y su respaldo HTTP a https://nelkano.com. El micrófono no se utiliza. Activar o instalar un módulo no inicia una emisión.</p><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-17-streaming-confirmation.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-17-streaming-confirmation.webp" width="460" height="258" alt="Confirmación antes de emitir una partida (ejemplo)." data-caption="Confirmación antes de emitir una partida (ejemplo)."></a><h2>Ver y detener la emisión</h2><ol><li>Abre Streaming en nelkano.com.</li><li>Inicia sesión con la misma cuenta que en la app. El visor busca su emisión activa.</li></ol><p>El panel también muestra el identificador, PIN y dirección devueltos por el servicio. El visor web actual sigue exigiendo iniciar sesión con tu cuenta.</p><p><strong>Actualizar</strong> consulta el estado y <strong>Detener emisión</strong> termina la conexión. La emisión también termina al cerrar/cambiar el juego, cambiar de cuenta o retirar el módulo emisor. Android la detiene al pasar a segundo plano; Desktop tiene su propia gestión del foco.</p><p>Básicos propone 854 × 480, 30 fps y 1800 kbps; puedes cambiarlos antes de empezar. En Android, los contadores indican fotogramas y bloques de audio enviados, no si el receptor los ha reproducido.</p><h2>Emitir desde tu módulo</h2><p>Solicita media.streaming. Solo puede emitir un módulo a la vez:</p><pre><code>const state = await host.streaming.snapshot();
            try {
              const result = await host.streaming.start({
                width: 854, height: 480, fps: 30, videoBitrateKbps: 1800
              });
              if (result.cancelled) console.log("Emisión cancelada");
            } catch (error) {
              console.log("No se inició la emisión:", error instanceof Error ? error.message : String(error));
            }
            // Más tarde, para terminar una emisión iniciada por este módulo:
            await host.streaming.stop();</code></pre><p>Si el usuario cancela, Android devuelve <code>{cancelled:true}</code> y Desktop rechaza la promesa. Contempla ambos casos, además de los errores de inicio, al mostrar el resultado.</p><p>El formulario de Básicos admite ancho 160–1920, alto 120–1080, 10–60 fps y 200–12000 kbps. El puerto directo valida los límites del host, que pueden ser distintos.</p><p><code>snapshot()</code> devuelve estado, mensaje, destino y configuración. Una emisión creada incluye <code>sessionId</code>, <code>pin</code> y <code>joinUri</code>; Android puede añadir <code>stats</code> y <code>relay</code>. Las credenciales permanecen en el host.</p><h2>Usar el gancho de Básicos</h2><p>Declara en consumes el proveedor nelkano.basics, gancho streaming, versión 1.0.0, y solicita modules.hooks. Ofrece snapshot, configure, start y stop:</p><pre><code>await host.hooks.invoke('nelkano.basics', 'streaming', 'configure', {
              width: 854, height: 480, fps: 30, videoBitrateKbps: 1800
            });
            await host.hooks.invoke('nelkano.basics', 'streaming', 'start', {});</code></pre><p>configure guarda las opciones en Básicos. start solicita igualmente la confirmación del usuario.</p><h2>Probar una emisión</h2><p>Studio simula la cuenta, sesión y receptor para probar el formulario y los ganchos. Comprueba imagen, sonido, cancelación, cortes de red y cambios de sesión con una emisión real en la plataforma de destino. Android y Desktop solicitan confirmación al empezar; aceptar los permisos de instalación no la sustituye.</p><ul><li>Android: respaldo HTTP con imágenes WebP/JPEG de calidad adaptativa y audio PCM mono de 16 kHz en bloques de 500 ms. Está disponible durante la emisión si falla WebRTC, con colas acotadas por medio.</li><li>Desktop: transporte WebRTC, sin ese respaldo HTTP ni los contadores <code>relay</code>.</li></ul><h2>Si la app se cierra inesperadamente</h2><p>Android conserva el identificador público de la emisión y la cuenta que la inició, sin PIN ni tokens. Antes de emitir de nuevo con esa cuenta intenta cerrar las emisiones anteriores; si no llega al servidor, guarda el registro para reintentar.</p><p>La app no reanuda la emisión automáticamente ni cierra las de otras cuentas. Detener libera la captura y WebRTC; el cierre en el servidor se completa en segundo plano.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/streaming
  -
    uuid: de520020-2026-4000-8000-000000000020
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 200
    translations:
      es:
        title: 'Multijugador: GB/GBC, GBA, NDS y módulos custom'
        status: true
        body:
          value: |-
            <p>Multijugador y Amigos vienen incluidos con Nelkano. Para conectar jugadores, abre un juego GB/GBC, GBA o NDS y entra en Multijugador desde los ajustes de la partida o su botón de sistema. Cada motor y adaptador determina los modos disponibles.</p><p>El Editor de controles permite mover, escalar u ocultar ese botón. Para añadir un modo de conexión, utiliza los ganchos de Multijugador y comprueba primero las capacidades de la sesión.</p>
            <h2>Elegir jugadores y conectar</h2><ol><li>Iniciad sesión con cuentas que sean amigas aceptadas y abrid juegos compatibles.</li><li>En los ajustes de la partida, entra en CONEXIONES → Multijugador.</li><li>El anfitrión elige Crear partida y selecciona a sus amigos. Los invitados eligen Unirse y seleccionan al anfitrión.</li><li>Pulsad la acción del modo que vais a utilizar. Elegir los amigos y el rol todavía no establece la conexión.</li></ol><p>Las acciones de conexión están al pie. Desconectar aparece si hay una conexión o una recuperación pendiente; la cruz superior cierra el panel.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-18-multiplayer.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-18-multiplayer.webp" width="600" height="520" alt="Crear o unirse a una partida y conectar con cable link (ejemplo)." data-caption="Crear o unirse a una partida y conectar con cable link (ejemplo)."></a><h2>Cable link de GBA</h2><p>Conectar con cable link requiere dos jugadores con la misma ROM exacta. Conectad primero y entrad después al multijugador del propio juego.</p><p>La sesión es temporal: al terminar se recupera la partida anterior y se descarta el progreso de la conexión.</p><p>El host negocia WebRTC entre cuentas amigas. La conexión entre redes depende de ICE, NAT y las redes de ambos jugadores. Studio simula el flujo.</p>
            <h3>Puerto localLink del SDK</h3><p>Comprueba que exista host.localLink y que capabilities(session) devuelva supported:true.</p><ul><li>capabilities y status requieren emulation.read.</li><li>connect(session,{friendUid,role,players:2}) requiere emulation.handoff y network.multiplayer.</li><li>stop(session) requiere emulation.handoff.</li><li>role es host o guest; friendUid identifica a un amigo aceptado.</li></ul><p>capabilities incluye systemId, players, protocol, stateFormat, maxStateBytes y transport:webrtc-friends. host y join por código ya no forman parte del puerto público. JavaScript no recibe rutas privadas, estados completos, credenciales ni handles nativos.</p><p>connect devuelve phase:connecting mientras prepara el cable. Consulta status mediante ticks de runtime, incluso con el panel cerrado:</p><ul><li>phase: idle, connecting, playing o error.</li><li>Datos: active, role, friendUid, players, delayFrames y message.</li><li>playing: la conexión nativa está establecida y el estado inicial coincide.</li><li>restored:true: se ha recuperado la partida original al cerrar.</li><li>Un error con restored:false exige reintentar la recuperación o reabrir la partida.</li></ul><p>Cada llamada valida propietario, permisos y referencia id/generation. La negociación comprueba cuenta, amistad, roles, ROM, sesión y nonce; cada copia inicial admite hasta 4 MiB. Studio simula el contrato sin conexiones físicas.</p><h2>Crear online para otro juego</h2><p>Crea un módulo que consuma game-adapters 1.0.0 de nelkano.multiplayer y registre el adaptador:</p><pre><code>await host.hooks.contribute("nelkano.multiplayer",
              "game-adapters", "mi-juego", {label: "Mi juego"});</code></pre><p>Implementa estas operaciones en onHook:</p><ul><li>identify: recibe sesión, gameId y systemId. Solo si reconoces el juego, devuelve {compatible:true, compatibilityKey:"mi-protocolo-v1", transportSystem:"gba"}. Los jugadores compatibles deben compartir la clave.</li><li>capture: devuelve los datos públicos del juego.</li><li>render: recibe peers para representarlos.</li><li>messages: recibe los paquetes de tu protocolo.</li></ul><p>Consume sessions para consultar snapshot, conectar con {friendUid, role}, desconectar o enviar con send y {type, payload, channel?}. Multijugador añade identidad de sesión y secuencia.</p><p>channel sustituye mensajes pendientes del mismo canal, útil para posiciones. Omítelo cuando debas conservar cada mensaje.</p><p>Contribuye a events para recibir changed con type, state, sessionId, peers y packets. No llames de vuelta al proveedor dentro del callback: crearías un ciclo. Amigos proporciona la cuenta y su lista; el host conserva la conexión autenticada y los tokens.</p><h2>Añadir una acción al formulario</h2><p>Contribuye a <code>connection-actions</code> <code>1.0.0</code> con <code>strategy:presence</code>, <code>adapterId</code>, <code>systems</code>, <code>minPlayers</code> y <code>maxPlayers</code>. La acción y el adaptador deben pertenecer al mismo módulo y autor.</p><p>Las salas de presencia admiten de dos a cuatro participantes, según el adaptador. El anfitrión selecciona a sus amigos y cada invitado elige al anfitrión. Cable link sigue limitado a dos jugadores.</p><p><code>sessions.connect</code> acepta <code>friendUids</code>. Si usas <code>host.online.connect</code> directamente como anfitrión en <code>ONLINE_LAYER</code>, puedes indicar hasta tres destinatarios. <code>send</code> acepta <code>peerUid</code> para elegir uno.</p><p>Cada enlace tiene su <code>sessionId</code>. El protocolo de presencia utiliza además el identificador y los miembros de la sala.</p><h2>Mantener la partida activa en presencia</h2><p>En presencia, la partida sigue avanzando desde <code>online.connect</code> hasta desconectar, fallar o retirar el módulo. El host aplica esta regla sin otro permiso. Durante Online se evita el apagado por inactividad; en Android, girar el dispositivo conserva pantalla y sesión.</p><p>El panel muestra los errores de red. Los registros de transporte guardan contadores y motivos de cierre, sin contraseñas, tokens ni cuerpos de paquetes. Puedes añadir un motivo corto con <code>online.disconnect({reason: "local-disconnect"})</code>.</p><h2>Estado y reconexión</h2><p>El estado se muestra al principio del panel para anfitrión e invitado:</p><ul><li>Conectado: han llegado datos del amigo en los últimos ocho segundos.</li><li>Reconectando: no llegan datos, pero la sesión permanece abierta.</li></ul><p>Una sesión HTTP abierta no confirma que el otro jugador esté activo.</p><p>Multijugador envía una señal de vida cada segundo y medio, también durante transiciones en las que el adaptador no puede leer la presencia. Cada remitente tiene su propia secuencia para que un jugador nuevo no herede la del anterior.</p><p>Reconectar capa online cierra la conexión y abre otra; el amigo debe entrar de nuevo. sessions.connect reutiliza una conexión con la misma configuración, por lo que la reconexión explícita se hace desde ese botón.</p><p>sessions.snapshot incluye state, transportState, peerActive y peerLastSeenAt. Los avisos events entregan el mismo estado comprobado.</p><h2>Partir del ejemplo de adaptador</h2><pre><code>.\nelkmod.cmd example multiplayer-adapter C:/mis-modulos/mi-adaptador</code></pre><p>El ejemplo usa un CHIP-8 ficticio para enseñar game-adapters, sessions y events. No sincroniza la CPU ni convierte un juego en online por sí solo.</p><ul><li>identify puede indicar connectionKind:presence y transportSystem.</li><li>shared-console necesita un core/host compatible.</li><li>sessions.send mantiene los mensajes públicos separados de los paquetes internos de tarjetas y mandos.</li><li>events incluye mode y systemId; snapshot identifica nelkano.multiplayer como proveedor.</li></ul><p>Cada adaptador define su protocolo mediante los ganchos de <code>nelkano.multiplayer</code>. Un gancho no añade soporte de CPU, cable o consola compartida a un core que no lo anuncie.</p><h2>Crear una integración de consola compartida</h2><p><code>host.sharedConsole</code> es opcional y no añade un modo al menú. Con <code>emulation.read</code>, consulta <code>capabilities(session)</code>: devuelve <code>supported</code>, sistema, tamaño/formato de tarjetas, códigos de entrada y límites.</p><p>El adaptador disponible es PS1 Android; Studio lo simula. Comprueba <code>supported</code> antes de usarlo.</p><p>Para compartir tarjetas, solicita emulation.handoff:</p><ul><li>exportCard(session,{slot,index}): exporta desde index 0 en fragmentos de 16 KiB.</li><li>stageCard(session,{index,data}): prepara los fragmentos para tu módulo/autor/sesión; caducan a los diez segundos.</li><li>beginTemporary(session) y endTemporary(session): inician y terminan la sesión temporal.</li></ul><p>El adaptador valida el formato antes de montarlo. Tu módulo define el protocolo y los juegos compatibles.</p><p>Con emulation.input puedes llamar a input(session,{sequence,keys}), controller(session,{enabled,message}) y controllerEvents(session).</p><ul><li>Las secuencias deben aumentar y los códigos pertenecer al core; no se admiten duplicados.</li><li>El anfitrión libera botones tras 1200 ms sin una entrada válida.</li><li>La superficie del invitado pausa su propia emulación, conserva el orden de pulsaciones y libera botones al perder el foco.</li><li>Esa superficie se cierra si no se consulta durante cinco segundos.</li></ul><p>Cada llamada comprueba permisos, propietario y generación.</p><p>Esta estrategia admite online.connect con continuous:false, una política local que no se envía al servidor. GBA mantiene continuous:true por defecto. La tarjeta temporal conserva intactos los guardados permanentes de ambos jugadores.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/online-gba
  -
    uuid: de520020-2026-4000-8000-000000000021
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 145
    translations:
      es:
        title: 'Modificar un juego'
        status: true
        body:
          value: |-
            <p>Usa <code>host.gameMod</code> para leer datos de una partida y cambiar su comportamiento. Tu módulo debe conocer el juego: qué representan sus datos, dónde están y cuándo es seguro modificarlos.</p><p>GBA admite lectura, escritura, valores numéricos, observaciones y reglas en Android y Windows/Linux. Studio ofrece memoria de prueba. En cualquier motor, consulta primero las capacidades de la sesión.</p>
            <h2>Comprobar permisos y capacidades</h2><p>Declara en capabilities los permisos de las operaciones que uses. Los ejemplos de este capítulo utilizan:</p><pre><code>"capabilities": [
              "emulation.game-mod", "emulation.read",
              "emulation.memory.read", "emulation.memory.write", "runtime.events"
            ]</code></pre><p><code>emulation.game-mod</code> identifica este contrato; un host antiguo rechaza el paquete. Cada operación necesita además sus permisos:</p><ul><li>Consultar capacidades: <code>emulation.read</code>.</li><li>Leer memoria o listar reglas: <code>emulation.memory.read</code>.</li><li>Escribir memoria o retirar reglas: <code>emulation.memory.write</code>.</li><li>Instalar reglas: lectura y escritura.</li></ul><pre><code>const active = await host.emulation.snapshot();
            if (active) {
              const support = await host.gameMod.capabilities(active.session);
              console.log(support.systemId, support.spaces, support.frameRules);
            }</code></pre><p>Revisa estos campos de la respuesta antes de operar:</p><ul><li>session, gameId, systemId y simulated: partida, juego, sistema y si estás en una simulación.</li><li>memoryRead, memoryWrite, atomicWrite, frameRules y memoryObserve: operaciones disponibles.</li><li>spaces: espacios con id, addressBits, byteOrder y regions. Cada región indica id, start, length, readable y writable.</li><li>maxRanges, maxBytes, maxRules y maxRuleBytes: límites anunciados por el motor.</li></ul><p>Un core sin acceso a memoria devuelve espacios vacíos, funciones de memoria en false y límites en cero. Comprueba input, saveRequirements y newGame por separado: pueden tener otra disponibilidad.</p>
            <h2>Elegir una dirección de GBA</h2><p>En GBA, el espacio <code>cpu</code> utiliza direcciones absolutas de 32 bits y orden little endian:</p><ul><li>EWRAM: 0x02000000, 256 KiB, lectura y escritura.</li><li>IWRAM: 0x03000000, 32 KiB, lectura y escritura.</li><li>IO, paleta, VRAM, OAM y bus de ROM: solo lectura.</li></ul><p>Cada operación debe quedar dentro de una región anunciada.</p><p>Las direcciones del bus ROM incluyen sus espejos de memoria; no son offsets del archivo. Para leer el archivo original utiliza <code>host.gameRuntime.rom</code>. La inspección conserva el estado del cartucho y de la comunicación serie.</p><p>cpu no permite escribir en IO ni en su bus ROM. Para cambiar el cartucho cargado, utiliza el espacio rom descrito más abajo.</p>
            <h2>Leer y escribir por lotes</h2><p>El ejemplo usa una ROM propia que reserva 0x0203FFF0 como byte de prueba. En otro juego debes localizar una dirección adecuada antes de escribir.</p><pre><code>async function changeScratchByte(host, session) {
              const support = await host.gameMod.capabilities(session);
              if (!support.memoryRead || !support.atomicWrite) {
                throw new Error("Este core no permite esta modificación.");
              }
              const address = 0x0203FFF0;
              const current = await host.gameMod.read(session, {
                ranges: [{space: "cpu", address, length: 1}]
              });
              return host.gameMod.write(session, {
                writes: [{space: "cpu", address,
                  expected: current.ranges[0].data, data: "AQ=="}]
              });
            }</code></pre><ul><li>read devuelve ranges con space, address y data en Base64.</li><li>write recibe data y expected: Base64 canónico de igual longitud.</li><li><code>AQ==</code> representa un byte con valor 1.</li><li>Las escrituras de un lote no pueden solaparse.</li></ul><p>Antes de escribir, el host compara todos los expected. Si alguno ha cambiado, devuelve <code>{applied:false, conflictIndex}</code> con el primer conflicto, sin aplicar el lote. Si coinciden, devuelve <code>{applied:true}</code>.</p><p>Ante un conflicto, decide si debes volver a leer. Repetir la escritura sin revisar los datos puede sobrescribir un cambio del juego.</p>
            <h2>Trabajar directamente con números</h2><p>readValues admite u8, i8, u16, i16, u32, i32, f32 y f64. Cada entrada lleva space, address y type; endian puede ser little o big y usa por defecto el orden del espacio.</p><p>La respuesta incluye value, data Base64 y el endian efectivo. Un float no finito devuelve value:null y conserva data. Utiliza read/write de bytes para comparar bits exactos, NaN, infinito o cero con signo.</p>
            <pre><code>const current = await host.gameMod.readValues(session, {
              values: [{space: "cpu", address: 0x0203FFF0, type: "u16"}]
            });
            const previous = current.values[0].value;
            const result = await host.gameMod.writeValues(session, {
              writes: [{space: "cpu", address: 0x0203FFF0, type: "u16",
                expected: previous, value: (previous + 1) &amp; 65535}]
            });</code></pre><p>Este ejemplo necesita dos bytes reservados por tu ROM. writeValues valida y convierte el lote completo antes de escribir:</p><ul><li>Conserva expected, applied/conflictIndex, propiedad y permisos de write.</li><li>Rechaza enteros fuera de rango, fracciones en tipos enteros y desbordamientos de float.</li><li>Admite hasta 32 valores.</li></ul><p>En hosts anteriores, comprueba que existan readValues y writeValues.</p>
            <h2>Recibir avisos cuando cambien los datos</h2><p>observe necesita emulation.game-mod, emulation.memory.read y runtime.events. Comprueba memoryObserve, maxWatches, maxWatchBytes y maxWatchRanges.</p><p>El adaptador toma muestras y el host agrupa los avisos; tu JavaScript no se ejecuta en cada frame.</p>
            <pre><code>await host.gameMod.observe(session, {
              id: "scratch-value", everyFrames: 4,
              ranges: [{space: "cpu", address: 0x0203FFF0, length: 2}]
            });
            // Dentro de onEvent(event):
            if (event.type === "game-memory-changed") {
              console.log(event.watchId, event.changes, event.ranges);
            }
            // Para dejar de observar:
            await host.gameMod.unobserve(session, "scratch-value");</code></pre><p>La primera muestra se toma al registrar. everyFrames admite 1–600, con valor inicial 1. Las siguientes muestras llegan después de avanzar el juego; pausar o capturar una imagen no cuenta.</p><p>Reiniciar o cargar dentro de la misma sesión conserva la observación. La comparación continúa cuando el juego vuelve a avanzar.</p><p>game-memory-changed entrega session, watchId, sequence, frame, changes y ranges. Cada rango contiene space, address, before y data en Base64.</p><p>Solo hay un aviso pendiente por observación: conserva el primer before, el último data y el número de muestras con cambios. Si un valor cambia y vuelve al inicial, changes puede ser mayor que cero aunque before y data coincidan. Los cambios entre muestras pueden pasar inadvertidos.</p><ul><li>El host consulta avisos aproximadamente cada 100 ms en primer plano; el intervalo de entrega puede variar.</li><li>frame es el contador del adaptador. En Studio cuenta pasos sintéticos.</li><li>Cada módulo recibe solo sus observaciones.</li><li>Repetir un id propio sustituye la observación y descarta el aviso pendiente.</li><li>unobserve descarta también ese aviso y devuelve true si existía la observación, o false si no.</li><li>Cerrar o cambiar de sesión elimina las observaciones.</li></ul><p>En GBA, todos los módulos de una sesión comparten 16 observaciones, 32 rangos y 16 KiB observados. Observar no reserva zonas de escritura. Retirar un módulo que solo observa mantiene abierta la partida.</p>
            <h2>Buscar valores que cambian</h2><p>Solicita emulation.game-mod y emulation.memory.read. Comprueba memorySearch y los límites maxSearches, maxScanBytes, maxSearchBytes y maxSearchResults.</p><p>GBA y Studio admiten por sesión hasta cuatro búsquedas, 256 KiB por búsqueda y 1 MiB de capturas en total. Cada página devuelve hasta 128 resultados. Otros motores, incluidos los V2 con un puerto propio, pueden anunciar límites distintos.</p>
            <pre><code>const search = await host.gameMod.searchStart(session, {
              space: "cpu", address: 0x02000000, length: 262144,
              type: "u16", mode: "unknown"
            });
            // Después de cambiar algo en el juego:
            const refined = await host.gameMod.searchRefine(session, {
              id: search.id, mode: "increased"
            });
            const page = await host.gameMod.searchRead(session, {
              id: search.id, offset: 0, limit: 32
            });
            await host.gameMod.searchClose(session, {id: search.id});</code></pre>
            <p>Configura searchStart con:</p><ul><li>equal y value para buscar un número conocido, o unknown sin valor.</li><li>Uno de los ocho tipos numéricos.</li><li>endian little/big; por defecto se usa el orden del espacio.</li><li>alignment 1, 2, 4 u 8: paso entre candidatos desde la dirección inicial. Por defecto coincide con el tamaño del tipo.</li></ul><p>El rango completo debe caber en una región legible.</p><p>searchRefine conserva los candidatos que cumplen la comparación y actualiza la captura de referencia al terminar:</p><ul><li>equal/notEqual: comparan con value.</li><li>changed/unchanged: comparan los bits con la captura anterior, sin value.</li><li>increased/decreased: comparan números finitos con la captura anterior, sin value.</li></ul><p>equal compara números y redondea f32 a su representación. Los valores no finitos se entregan como null y no coinciden con uno finito.</p>
            <p>Las respuestas incluyen id, matchCount, scannedBytes, revision, space, address, length, type, endian, alignment y paged. searchRead añade offset, results y hasMore.</p><p>Cada resultado contiene dirección, tipo, orden, value y data Base64 de la última captura. Consultar otra página no vuelve a leer el juego ni pierde los candidatos restantes.</p><p>Las capturas usan tramos de hasta 32 KiB. Si necesitas un instante coherente entre tramos, pausa el juego antes de capturar.</p><p>Las búsquedas pertenecen al módulo y autor que las creó. searchClose devuelve false si no encuentra una búsqueda propia. Retirar un módulo que solo busca conserva abierta la partida.</p><p>Cerrar o cambiar la sesión descarta las búsquedas. Reiniciar o cargar dentro de la misma sesión conserva la captura hasta la siguiente refinación.</p>
            <h2>Explorador de memoria en Studio</h2><ol><li>Abre una sesión GBA de prueba en el visor.</li><li>Entra en Ajustes → Explorar memoria y elige dirección, tipo y rango.</li><li>Busca un valor conocido o empieza con valor desconocido. Refina por cambios, aumentos o disminuciones.</li><li>Selecciona un resultado y genera una lectura, escritura comprobada u observación en JavaScript o TypeScript.</li><li>Pulsa Copiar código e incorpora las funciones a tu módulo con sus permisos.</li></ol><p>La escritura generada lee expected y comprueba el resultado. La observación requiere también runtime.events.</p><p>Cambiar valor de prueba modifica RAM sintética y respeta las zonas reservadas por módulos. Cerrar el explorador libera sus búsquedas; los valores se conservan hasta cerrar o restablecer la sesión.</p><p>El explorador no se conecta a partidas reales ni edita tus archivos automáticamente.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-08-explorador-memoria.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-08-explorador-memoria.webp" width="1440" height="1000" alt="Explorador de memoria con una sesión GBA simulada." data-caption="Explorador de memoria con una sesión GBA simulada."></a><h2>Aplicar una regla en cada frame</h2><p>installRule registra una regla de la sesión. Antes de cada frame, el core comprueba sus condiciones y todos los expected; aplica el lote solo si coinciden. La regla se ejecuta junto al core, sin llamadas a JavaScript ni esperas de red, y se detiene mientras el juego está pausado.</p><p>En esta ROM propia, 0x0203FFF1 es una señal. Cuando vale 1 y el byte anterior vale 0, la regla escribe 2 en ese byte anterior:</p><pre><code>await host.gameMod.installRule(session, {
              id: "scratch-rule",
              conditions: [{space: "cpu", address: 0x0203FFF1,
                expected: "AQ=="}],
              writes: [{space: "cpu", address: 0x0203FFF0,
                expected: "AA==", data: "Ag=="}]
            });</code></pre><ul><li>conditions es opcional y puede leer también IO o bus ROM.</li><li>Las escrituras acceden a RAM o al espacio rom de GBA, no a IO.</li><li>Después de escribir 2, expected deja de coincidir. La regla solo vuelve a actuar si el juego restablece los valores esperados.</li><li>Reinstalar un id propio sustituye la regla y devuelve <code>{id}</code>.</li></ul><pre><code>const myRules = await host.gameMod.listRules(session);
            const removed = await host.gameMod.removeRule(session, "scratch-rule");</code></pre><p>listRules devuelve tus reglas con id, conditions y writes. removeRule devuelve true si retira una regla propia y false si no existía. Un módulo no puede listar ni retirar las de otro, aunque compartan autor.</p>
            <h2>Límites y conflictos</h2><ul><li>GBA: hasta 32 rangos y 32 KiB por operación.</li><li>Cada regla: hasta 32 condiciones y escrituras en total.</li><li>Por sesión, compartido entre módulos: 16 reglas y 32 KiB de condiciones y escrituras.</li></ul><p>Utiliza los límites anunciados por el host de destino.</p><p>Escribir en una zona reservada por otro módulo devuelve <code>modification-conflict</code>. Retirar una regla detiene su ejecución, pero no libera las zonas reservadas hasta cerrar la sesión: todavía pueden conservar sus efectos.</p><p>El control de solapamientos incluye las escrituras de <code>host.gameRuntime.patch</code>. Los módulos que solo usan ese puerto anterior conservan su comportamiento al retirarse; el cierre de sesión descrito aquí se aplica a las nuevas escrituras o reglas de gameMod.</p>
            <h2>Retirar el módulo y conservar partidas</h2><p>Cerrar la sesión elimina reglas y modificaciones activas; el archivo ROM original permanece intacto. Reiniciar o cargar un estado dentro de la misma sesión conserva las reglas y vuelve a comprobar conditions y expected.</p><p>Retirar una regla no restaura los bytes anteriores. Si un módulo ha modificado la sesión, desactivarlo, actualizarlo o perder su proceso cierra esa sesión, aunque ya hubiera retirado las reglas. Las referencias antiguas de sesión dejan de ser válidas.</p><p>Los efectos pueden quedar en los guardados habituales. Informa al usuario antes de modificar su progreso. Si cargar la partida exige tu módulo o empezar de cero, declara los requisitos de guardado explicados más abajo.</p>
            <h2>Probar el módulo</h2><p>En Studio, simulated:true permite probar el código y el contrato. Revisa permisos, expected incorrectos, rangos no disponibles, conflictos entre módulos, carga/reinicio, desactivación y cambio de sesión. Después prueba el paquete con una ROM propia en la app de destino.</p><p>Construye la interfaz con páginas y formularios del SDK. Ofrece las operaciones de memoria o ROM temporal que anuncie cada motor.</p>
            <h2>Introducir botones desde un módulo</h2><p>Con emulation.game-mod y emulation.input, llama a gameMod.input(session,{buttons:[{code,pressed}]}). Las pulsaciones del módulo se combinan con las del usuario y otros módulos; al desactivarlo se liberan solo las suyas.</p><p>Consulta capabilities y usa los códigos admitidos por el core. Studio simula las pulsaciones; este soporte se consulta por separado del acceso a memoria.</p>
            <h2>Cambiar la ROM cargada sin alterar el archivo</h2><p>GBA ofrece el espacio rom desde el offset cero hasta la longitud real del cartucho. Admite lecturas, escrituras comprobadas, valores numéricos, búsquedas, observaciones y reglas. Un lote mixto RAM/ROM se aplica entero o no cambia nada.</p><p>Los cambios afectan al código o recursos de esa sesión. Al volver a abrir se lee el original. El bus ROM del espacio cpu sigue siendo de solo lectura.</p><pre><code>const original = await host.gameMod.read(session, {ranges:[{space:"rom",address:offset,length:1}]});
            await host.gameMod.write(session, {writes:[{space:"rom",address:offset,expected:original.ranges[0].data,data:nuevoByteBase64}]});</code></pre><p>Solicita emulation.game-mod y emulation.memory.read/write. Ten en cuenta:</p><ul><li>No se amplía la ROM ni se vuelve a detectar el tipo de guardado al cambiar cabeceras.</li><li>Los estados no incluyen la ROM modificada. Declara la dependencia del módulo y prepara sus cambios al cargar.</li><li>Studio utiliza una ROM sintética.</li><li>Los recursos y scripts con nombre de RPG Maker utilizan gameRuntime y sus límites; el resto de cores no recibe un motor de scripts general.</li></ul><h2>Declarar que una partida necesita el módulo</h2><pre><code>await host.gameMod.configureSave({gameId,newGame:true});</code></pre><p>Llama a configureSave antes de abrir el juego y solicita emulation.game-mod. La llamada registra el módulo y su autor como requisitos del guardado. newGame es opcional y exige empezar una partida nueva.</p><p>Los datos se guardan en slots, autoguardado y batería habituales. Si falta el módulo o cambia su autor, la app rechaza la carga y conserva el archivo. Una partida anterior sin marca de nueva no cumple newGame, aunque tenga otra dependencia.</p><ul><li>Los guardados sin requisitos conservan sus bytes. Las cabeceras de requisitos están versionadas y admiten la versión anterior.</li><li>Una sesión con requisitos empieza pausada para preparar el módulo antes de continuar.</li><li>Retirar un módulo que solo exige presencia pausa la partida y permite guardar antes de salir; no permite continuar sin él.</li><li>Si el módulo escribió memoria, ROM o reglas, se mantiene el cierre de sesión de gameMod.</li></ul><p>Para exigir una partida nueva consulta <code>capabilities(session).newGame</code>. Los cores incluidos que ofrecen ese contrato lo aplican; un motor sin soporte rechaza la apertura en vez de reutilizar progreso. Studio simula los metadatos, no una batería real.</p><h2>Crear un pack de archivos</h2><p>Un pack sustituye archivos al abrir el juego y conserva el contenido original. Para prepararlo:</p><ol><li>Solicita <code>resources.packs</code> y consulta <code>host.resourcePacks.capabilities({gameId})</code>.</li><li>Crea un pack con <code>create({gameId,id,label})</code>. Usa <code>list({gameId?})</code> para consultar packId, revisión, estado y archivos.</li><li>Abre la carga de cada archivo con <code>beginFile({packId,path,size,sha256})</code>, envía bloques con <code>write({id,offset,dataBase64})</code> y termina con <code>commitFile({id})</code>.</li></ol><p><code>readFile({packId,path,offset,length})</code> lee por bloques. Para quitar un archivo de un pack desactivado, usa <code>removeFile({packId,path})</code>.</p><p><code>enable({packId,enabled,expectedRevision})</code> y <code>remove({packId,expectedRevision})</code> requieren la sesión cerrada y la revisión vigente. Para eliminar el pack, desactívalo primero.</p><ul><li>Por identidad: hasta 32 packs.</li><li>Por pack: hasta 1024 archivos y 1 GiB en la app; Studio limita cada pack a 32 MiB.</li><li>Bloques de transferencia: 64 KiB.</li><li>Caducidad de las cargas: diez minutos.</li><li>Índice agregado por identidad: 95 KiB, para caber en el límite IPC.</li></ul><p>El host comprueba rutas, tamaños, hashes y contenido base antes de aplicar las capas.</p><p>Al abrir el juego, el host crea una copia privada con las capas habilitadas y conserva el ID y el original. Las ordena por identidad del propietario y después por ID del pack.</p><p>Al revocar un módulo, sus capas dejan de aplicarse en la siguiente apertura. La sesión abierta conserva la copia con la que arrancó.</p><p>Los packs admiten sustituir una ROM completa o archivos de contenedores de discos de solo lectura. Debes preparar los recursos o la ROM reconstruida y comprobar las capacidades del formato.</p><p>RPG Maker no está admitido: sus guardados nativos no deben copiarse junto con los recursos.</p><h2>Elegir entre packs y texturas</h2><p>Elige el servicio según lo que quieras cambiar:</p><ul><li><code>host.resourcePacks</code>: capas de archivos preparadas al abrir el juego. Cambia su selección con la sesión cerrada.</li><li><code>host.graphics</code>: opciones y texturas del core. <code>graphics.textures</code> reemplaza PNG por hash y <code>graphics.options</code> selecciona la resolución.</li></ul><p>GameCube admite raster host 1×/2×/4×. PS1, PSP y GameCube admiten reemplazos de texturas en Android/Desktop. Son cambios limitados a la sesión y se retiran al revocar el módulo; un pack de archivos no habilita texturas HD en cualquier core.</p><p>Consulta <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación</a> para formatos, límites y correspondencia XFB/VI.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/modificar-juego
