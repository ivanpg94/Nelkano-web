        title: 'Reportes internos para testers'
        status: false
        body:
          value: '<p>Reportes de errores es una función privada de Nelkano para cuentas Tester. Utiliza exclusivamente el módulo oficial firmado y un canal interno del host. No forma parte del SDK público ni se concede a módulos de terceros. El servidor conserva la comprobación de permisos de la cuenta.</p>'
