      es:
        title: 'Prototipo de asistente por voz'
        status: true
        body:
          value: '<p>Nelkan IA es un prototipo opcional. El APK base actual incluye únicamente Apariencia, Nelkano Básicos, Editor de controles, Amigos y Parches. No incluye el servicio, los motores nativos ni los modelos del asistente.</p><p>Importar el archivo .nelkmod de voz no instala esos componentes y no habilita el asistente en esta entrega. Las fuentes y pruebas históricas se conservan fuera del build de la aplicación; la distribución independiente de su runtime aún no está implementada.</p><h2>Contrato del prototipo</h2><p>El prototipo utilizaba host.services.call con el servicio nelkano.voice-assistant 1.0.0 y los permisos modules.services y assistant.voice. Un módulo debe comprobar la disponibilidad del servicio; declarar un permiso no demuestra que un host lo implemente.</p><h2>Datos y límites</h2><p>La integración anterior ejecutaba Whisper, Silero y un GGUF local, con escucha en primer plano y síntesis de Android. La precisión acústica y el consumo prolongado no están certificados. El código y estos modelos no se empaquetan en la aplicación base. Studio y Desktop tampoco proporcionan ese backend.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/asistente-voz-experimental
