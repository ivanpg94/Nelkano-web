    uuid: de520020-2026-4000-8000-000000000010
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 100
    translations:
      es:
        title: 'Qué puedes hacer y qué falta'
        status: true
        body:
          value: |-
            <p>Para elegir las API de tu módulo, empieza por la tarea que quieres resolver. La disponibilidad depende de la plataforma y del motor: consulta sus capacidades antes de ofrecer una acción.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/sdk-environments.svg"><img src="/modules/custom/nelkano_home/assets/docs/sdk/sdk-environments.svg" width="1120" height="540" alt="Android, Desktop y el simulador de Studio." data-caption="Android, Desktop y el simulador de Studio."></a><h2>Elegir las API</h2><ul><li><strong>Botones, páginas y formularios:</strong> contribuciones y componentes de interfaz.</li><li><strong>Colecciones, guardados y Continuar:</strong> biblioteca, guardados y emulación.</li><li><strong>Datos propios:</strong> almacenamiento con revisiones CAS, entidades locales, archivos y secretos.</li><li><strong>Integración con otro módulo:</strong> ganchos, servicios, proveedores, eventos e interceptores publicados.</li><li><strong>Conexión a tu servicio:</strong> HTTP o WebSocket a los destinos autorizados.</li><li><strong>Trabajos programados:</strong> tareas normales o persistentes, según el dispositivo.</li></ul>
            <p>La interfaz se construye con los componentes de Nelkano. El JavaScript del módulo utiliza las operaciones autorizadas del SDK: no dispone de Node.js, acceso libre a archivos ni vistas Android. Los proveedores permiten sustituir los puntos que la app u otro módulo hayan publicado.</p>
            <h2>Modificar un juego</h2><p><code>host.gameMod</code> permite leer y buscar memoria, escribir comprobando los valores anteriores, ejecutar reglas antes de cada fotograma, enviar pulsaciones y modificar temporalmente la ROM cargada. La memoria y la ROM están conectadas a GBA en Android y escritorio. GB/GBC y NDS ofrecen lecturas específicas mediante <code>host.gameRuntime</code>; comprueba qué admite la sesión.</p>
            <p>El archivo ROM original se conserva, pero los efectos pueden quedar en los guardados. Puedes declarar que una partida necesite tu módulo o requiera empezar de nuevo cuando el motor lo permita. Consulta <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a> antes de escribir: explica los conflictos, la retirada del módulo y los requisitos de guardados.</p>
            <h2>Capturar imagen y traducir texto</h2><p><code>host.media</code> ofrece capturas y clips cuando el motor entrega la imagen o el audio necesarios. <code>host.translation</code> analiza, edita y reconstruye los formatos de texto compatibles de GBA/NDS. Android puede traducir con modelos locales descargables; escritorio permite editar las entradas o recibir traducciones de tu servicio. Para reconocer texto dentro de una imagen, aporta un OCR.</p>
            <h2>Cambiar gráficos y sonido</h2><p><code>host.graphics</code> ofrece filtros y las opciones gráficas del motor. El postprocesamiento requiere Android API 33+ o Skia en escritorio. PS1, PSP y GameCube admiten reemplazos PNG de texturas; GameCube ofrece resolución interna 1×, 2× y 4×. Consulta las capacidades y los límites del modo de renderizado: el mismo pack no sirve para todos los juegos.</p>
            <p><code>host.audioDsp</code> filtra el PCM del juego y <code>host.audioMix</code> mezcla PCM externo cuando la sesión lo admite. <code>host.microphone</code> captura audio del dispositivo con su permiso. <code>host.camera</code> captura imágenes en Android; escritorio anuncia <code>capture:false</code>. Tu módulo debe aportar el reconocimiento de voz, el doblaje o la interpretación de imágenes. Entregar una imagen a la cámara emulada de 3DS requiere además su capacidad y permiso.</p>
            <p><code>host.timeline</code> permite rebobinado, avance y repeticiones editables en motores con ejecución determinista. La integración inicial es CHIP-8. Poder guardar y cargar estados no implica que un motor admita estas funciones.</p>
            <h2>Transferir juegos y progreso</h2><p><code>host.transfers</code> exporta e importa juegos y partidas en Android y escritorio. Tu módulo resuelve la conexión entre dispositivos y los conflictos. El destino necesita un motor compatible con el formato del estado; los guardados internos también pueden depender de la plataforma o versión. Los guardados MV/MZ de WebView quedan fuera.</p>
            <p><code>host.resourcePacks</code> prepara capas de archivos y <code>host.profile</code> permite copiar las preferencias que registren sus proveedores. Los packs excluyen los proyectos RPG Maker que guardan su progreso dentro del proyecto. Los reemplazos gráficos por hash utilizan el servicio de texturas.</p>
            <p>Para sincronizar con tu servicio, combina transferencias, conexiones, secretos y tareas. Implementa su autenticación y declara los destinos de red. La transferencia de juegos y progreso necesita la partida cerrada.</p>
            <h2>Elegir Android o escritorio</h2><p>Declara las plataformas en el manifiesto y prueba el paquete en cada una. Ten en cuenta estas diferencias:</p><ul><li>Ambas importan archivos individuales y ZIP, RAR o 7z. Un disco CUE necesita todas sus pistas.</li><li>RPG Maker XP requiere el proyecto completo y funciona en ambas plataformas. MV/MZ funciona en Android.</li><li>SNES, PSP y GameCube admiten estados según las capacidades del motor. PSP conserva además sus guardados internos en una Memory Stick privada.</li><li>3DS es experimental y requiere Vulkan y ARM64 en Android. Switch está excluido de las apps Android y Desktop. Se conservan sus fuentes y las pruebas del core en PC; no forman parte del producto publicado.</li><li>Segunda pantalla necesita una red local y un receptor emparejado.</li><li>Streaming requiere una cuenta autorizada y una partida capturable. El transporte de respaldo HTTP de Android no está conectado en escritorio.</li></ul><p>Comprueba también mandos, gráficos y rendimiento en los dispositivos que quieras admitir, incluida Steam Deck si es uno de tus destinos.</p>
            <h2>Conectar jugadores</h2><p>Amigos y Multijugador vienen incluidos. Multijugador ofrece su interfaz en GB/GBC, GBA y NDS; cada modo necesita un motor y un adaptador compatibles.</p>
            <h2>Distribuir tu propio motor</h2><p>Un paquete V2 puede incluir un motor compilado para Android o escritorio. Su descriptor declara sistemas, controles, opciones, discos, recursos y formatos de guardado. La partida conserva el motor y la versión con los que se abrió. El ejemplo nativo del SDK sirve para probar vídeo CPU/OpenGL/Vulkan, audio PCM, entrada y estados.</p>
            <p>En escritorio, el motor se ejecuta con los permisos del usuario. En Android se instala un APK auxiliar con UID y certificado propios; la ruta gráfica no utiliza <code>isolatedProcess</code>. Revisa el código nativo y sus dependencias antes de distribuirlos. Linux utiliza X11/GLX o Vulkan y necesita XWayland en un escritorio Wayland.</p>
            <h2>Comprobar el resultado</h2><ol><li>En Studio, prueba la interfaz, los permisos, los errores y qué ocurre al desactivar el módulo o cambiar de sesión.</li><li>Exporta el paquete y repite la tarea en la app de cada plataforma que declares.</li></ol><p>Los juegos y dispositivos de Studio son simulados; las conexiones externas autorizadas sí usan la red. Los módulos opcionales se distribuyen por separado. Los cinco esenciales se actualizan con Nelkano.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/limites
  -
    uuid: de520020-2026-4000-8000-000000000011
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000003
    weight: 35
    translations:
      es:
        title: 'Usar SDK Studio'
        status: true
        body:
          value: |
            <p>Studio reúne el editor del módulo, un visor de Nelkano y las herramientas para probarlo y exportarlo.</p>
            <h2>Instalar y abrir Studio</h2><ol><li>Descarga el instalador de SDK Studio para Windows x64 desde <a href="/modulos">Módulos</a>.</li><li>Ejecuta el <code>.exe</code> y completa la instalación.</li><li>Abre <strong>Nelkano SDK Studio</strong> desde Inicio o el acceso del escritorio.</li></ol><p>Node.js y Java vienen incluidos. Crea tus proyectos en una carpeta propia, fuera de la instalación. El manifiesto del módulo utiliza <code>sdkVersion: "0.2.0"</code>.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-01-studio-editor-visor.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-01-studio-editor-visor.webp" width="1440" height="1000" alt="El proyecto Hola en Studio: código y visor." data-caption="El proyecto Hola en Studio: código y visor."></a><h2>Editar y probar un cambio</h2><ol><li>Selecciona el proyecto a la izquierda y abre un archivo en el editor central.</li><li>Edita el código y guarda con Ctrl+S. El visor de la derecha se recompila y recarga.</li><li>Prueba la acción en el visor. Si la compilación falla, revisa Problemas: el visor conserva el último código válido.</li></ol><p>Puedes crear archivos y carpetas e importar PNG y TTF. Los archivos pendientes de guardar llevan un asterisco. Si otro programa cambia uno que estás editando, Studio avisa antes de sobrescribirlo.</p><ul><li><strong>Ctrl+Mayús+S:</strong> guardar todos los archivos.</li><li><strong>Ctrl+F:</strong> buscar en el archivo.</li><li><strong>Intro o F3:</strong> siguiente coincidencia; Mayús+F3 vuelve a la anterior.</li></ul>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-04-arbol-manifest.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-04-arbol-manifest.webp" width="1440" height="1000" alt="Archivos del proyecto y manifest.json en Studio." data-caption="Archivos del proyecto y manifest.json en Studio."></a><h2>Qué comprueba el visor</h2><p>El visor reproduce las pantallas de Nelkano con la presentación Android. Incluye biblioteca, fichas, guardados y ajustes de prueba. Permite comprobar la navegación y las acciones del módulo, pero no ejecuta ROMs ni reproduce audio o mandos físicos.</p><p>Desde Ajustes puedes cambiar entre vertical y horizontal. El visor utiliza 420 × 800 y 800 × 420 puntos, ajustados al espacio disponible. Restablecer datos recupera los juegos de ejemplo y borra las preferencias simuladas, tras pedir confirmación.</p><p>Prueba también el paquete en cada plataforma de destino. Guardar el código recarga tu módulo, pero las actualizaciones de las pantallas compartidas necesitan una nueva distribución de Studio.</p>
            <h2>Revisar los módulos en el visor</h2><p>Abre Ajustes → General → Módulos. Instalados muestra los proyectos de ejemplo y separa los opcionales; su catálogo simulado no acredita los paquetes incluidos en la app. Explorar usa un catálogo local de los proyectos de tu carpeta, con búsqueda, filtros y fichas.</p><p>Este catálogo no consulta producción ni instala paquetes descargados. Comprobar actualizaciones revisa los metadatos locales. La comprobación de Actualización de Nelkano también es local y no instala una versión de la app.</p><p>Para comprobar la retirada de un proyecto, utiliza su interruptor en el panel Módulos de Studio. Esta herramienta de desarrollo permite apagar proyectos aunque el visor los presente como esenciales.</p>
            <h2>Trabajar con Codex o Claude Code</h2>
            <ol><li>Instala el CLI del agente y comprueba que <code>codex</code> o <code>claude</code> funciona en una terminal.</li><li>Inicia sesión con <code>codex login</code> o abriendo <code>claude</code>.</li><li>En Studio, abre Ajustes → Chat. Elige un modelo de la lista y, si ofrece niveles, selecciona uno. Escribe qué quieres cambiar en el módulo.</li></ol>
            <p>Studio consulta los modelos y niveles que comunica la sesión del CLI; no mantiene una lista fija. Si no puede confirmar la sesión o recibir un catálogo, explica el motivo y no ofrece modelos de ese agente. En Codex, comprueba las instalaciones detectadas y utiliza la más reciente. El servicio comprueba el acceso al enviar cada petición.</p>
            <p>El chat trabaja en la carpeta del proyecto seleccionado. Antes de enviar, Studio guarda los archivos; al terminar, actualiza el editor y el visor. Detener cancela el proceso y conserva las ediciones ya hechas. Las conversaciones se guardan por carpeta y agente.</p>
            <h3>Qué documentación puede consultar el chat</h3>
            <p>Antes de cada mensaje, también al reanudar una conversación, Studio prepara <code>.nelkano-sdk</code> dentro del proyecto. Su <code>README.md</code> contiene el índice de:</p>
            <ul><li>El libro público completo del SDK, organizado por capítulos.</li><li>Los tipos TypeScript de la entrega instalada.</li><li>Los ejemplos públicos incluidos en el SDK.</li></ul>
            <p>El agente recibe la ruta del índice y la revisión de la referencia, y puede leer los capítulos, tipos y ejemplos que necesite. Las firmas de los tipos instalados determinan qué API puede utilizar. Esta carpeta es generada por Studio y se excluye de Git; no la edites como parte de tu módulo.</p>
            <p>Al enviar mensajes, Studio revalida el libro con ETag si han pasado cinco minutos desde la última consulta. Si no hay conexión, conserva la última copia válida o utiliza la incluida en el SDK. Los tipos y ejemplos proceden de la instalación local: actualizar el libro no añade API a una entrega antigua.</p>
            <p>La fuente predeterminada es <a href="https://nelkano.com/api/nelkano/v1/sdk/reference">la referencia pública del SDK</a>. Si desarrollas Studio contra otra web, puedes cambiarla con <code>NELKANO_SDK_REFERENCE_URL</code> o con <code>tooling/reference/source.local.json</code>. Ese archivo es configuración del entorno local y no se distribuye.</p>
            <p>El CLI utiliza tu sesión y configuración para enviar la petición y los archivos que lea a su servicio. Studio no instala el agente ni inicia sesión por ti. El chat tampoco exporta el módulo, publica versiones o hace operaciones de Git automáticamente.</p>
            <h2>Exportar el módulo</h2><ol><li>Guarda los archivos y resuelve los errores de compilación.</li><li>Elige Exportar .nelkmod en Ajustes.</li><li>Instala el archivo firmado en la app y prueba la misma tarea.</li></ol><p>Studio utiliza una identidad de firma estable. Consérvala para las actualizaciones del módulo. Para empaquetar con otra clave utiliza la CLI; Studio no tiene selector de clave.</p>
            <h2>Probar Amigos y los controles</h2><p>Crea un proyecto con la plantilla Amigos (simulación). En Biblioteca del visor, pulsa Amigos y accede con demo@nelkano.test y Nelkano123. El registro y las fotos son ficticios; no utilices credenciales reales.</p><p>Los juegos de prueba incluyen PSP, GameCube y Switch para revisar sus controles. Switch es solo una simulación: su core no está incluido en las apps Android ni Desktop. Si no aparecen en una biblioteca simulada antigua, restablece los datos del visor. Las pulsaciones físicas se comprueban después en el dispositivo.</p>
            <h2>Explorar memoria y generar código</h2><ol><li>Abre una sesión GBA de prueba en el visor.</li><li>Entra en Ajustes → Explorar memoria y elige la dirección, el tipo y el rango.</li><li>Lee los valores o inicia una búsqueda conocida o desconocida. Cambia el valor de prueba y filtra los resultados.</li><li>Selecciona un resultado y genera una lectura, escritura comprobada u observación en JavaScript o TypeScript.</li><li>Copia la función a tu módulo y declara sus permisos.</li></ol><p>El explorador utiliza memoria simulada. Consulta <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a> para los pasos y límites de cada operación.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-08-explorador-memoria.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-08-explorador-memoria.webp" width="1440" height="1000" alt="Explorador de memoria con una sesión GBA simulada." data-caption="Explorador de memoria con una sesión GBA simulada."></a><h2>Usar las herramientas de terminal</h2><p>Abre PowerShell en la carpeta de instalación y ejecuta <code>.\nelkmod.cmd</code> con el comando que necesites. Utiliza rutas completas para tus proyectos; el lanzador usa el Node.js incluido. Para los motores V2 debes instalar también las herramientas de compilación que requiera tu receta.</p><h2>Probar una integración multijugador</h2><pre><code>.\nelkmod.cmd example multiplayer C:/mis-modulos/mi-multiplayer
            .\nelkmod.cmd example multiplayer-adapter C:/mis-modulos/mi-adaptador</code></pre><p>Carga Amigos, Multijugador y el adaptador de ejemplo. Abre la sesión ficticia de CHIP-8 y comprueba sus botones y mensajes. Las cuentas, partidas y conexiones multijugador son simuladas.</p><p>Los formularios de un módulo se abren desde la pantalla que amplía. Si requieren cuenta, inicia sesión con una ficticia. La simulación mantiene las comprobaciones de identidad y permisos; la conexión real se prueba al exportar.</p>
            <h2>Abrir varios proyectos</h2><p>Ejecuta <code>.\nelkmod.cmd dev C:/mis-modulos</code> o usa Ajustes → Seleccionar carpeta de módulos. Studio detecta los manifiestos de las subcarpetas inmediatas y admite hasta doce proyectos; omite carpetas sin manifiesto y enlaces simbólicos.</p><p>El desplegable de Proyectos cambia el árbol y las pestañas al módulo seleccionado, conservando los borradores de los demás. Crear archivos e importar recursos actúa sobre ese módulo. También puedes abrir directamente un proyecto incompleto para repararlo. La ruta de trabajo aparece al pie y se puede copiar.</p>
            <h2>Encontrar y resolver problemas</h2><p>Abre el panel inferior desde Ajustes. Sus tres pestañas sirven para:</p><ul><li><strong>Problemas:</strong> identificar el módulo y el error. Detalles permite copiar el mensaje; Abrir ruta[:línea] lleva al archivo si hay una ubicación válida.</li><li><strong>Registro:</strong> seguir una operación, filtrando por módulo o tipo. Limpiar vista oculta las entradas anteriores. Pausar congela la vista mientras el módulo sigue trabajando; Reanudar incorpora las nuevas.</li><li><strong>Módulos:</strong> consultar versión, estado, permisos e integraciones. Desactiva y reactiva un proyecto para comprobar cómo retira y recupera sus elementos.</li></ul>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-05-problema-ubicacion.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-05-problema-ubicacion.webp" width="1440" height="1000" alt="Error de compilación y su ubicación en Studio." data-caption="Error de compilación y su ubicación en Studio."></a><h2>Ajustar el espacio de trabajo</h2><p>Arrastra los separadores para ampliar el editor o el visor. En ventanas pequeñas puedes alternar Editor y Vista previa; Proyectos se repliega cuando falta espacio. Ajustes permite recuperar los paneles cerrados y Restablecer distribución vuelve a la disposición inicial conservando los datos.</p>
            <h2>Probar conexiones y tareas</h2><p><code>connections</code> realiza HTTP y WebSocket reales a los destinos autorizados. Usa servidores y credenciales de prueba. Las tareas del entorno de desarrollo se eliminan al detener o reconstruir el módulo.</p>
            <h2>Actualizar Studio</h2><ol><li>En Windows x64, abre Ajustes → Actualización de SDK Studio.</li><li>Descarga la versión disponible. Puedes cancelar o posponer.</li><li>Guarda los archivos y termina las operaciones y los agentes antes de instalar.</li></ol><p>Studio verifica el ZIP oficial, cierra el programa y abre la versión nueva con tus proyectos. Conserva fuentes, claves y datos de desarrollo. La actualización incluye las herramientas, Node.js y Java.</p><p>La comprobación también se realiza al abrir, recuperar el foco y cada seis horas. La primera entrega se instala por el procedimiento habitual; las siguientes aparecerán cuando estén disponibles en el canal de nelkano.com.</p>
            <h2>Probar transferencias</h2><p><code>host.transfers</code> utiliza juegos y guardados sintéticos. Permite comprobar bloques, hashes, revisiones, reintentos, revocación y caducidad entre entornos de desarrollo.</p><p>En Studio, los límites son 32 MiB por archivo, 127 miembros y 8 MiB por payload; en la app nativa, hasta 64 GiB y 100 000 archivos. Los paquetes de prueba solo se importan en Studio. La compatibilidad de estados reales y el rendimiento se comprueban en los dispositivos de destino.</p>
            <h2>Probar funciones de hardware</h2><p>Studio ofrece datos de prueba para traducción, capturas, clips, packs, gráficos, micrófono, audio, timeline y cámara. Consulta <code>capabilities</code> y <code>simulated</code> para distinguir el soporte simulado.</p><p>Puedes comprobar argumentos, formularios, permisos, conflictos y liberación de recursos. Las repeticiones del visor no son compatibles con un motor nativo. La exportación de vídeo se prueba con el selector de documentos de la app instalada. Los perfiles sí utilizan y validan los documentos registrados por los proveedores del entorno.</p>
            <h3>Tareas persistentes</h3><p>Studio no ejecuta el planificador nativo de <code>onBackground</code>. Sus temporizadores avisan mediante <code>onEvent</code> y anuncian <code>persistent:false</code> y <code>closedApp:false</code>.</p><p>Prueba las tareas persistentes en la app. El callback debe funcionar tanto en una instancia nueva sin <code>activate()</code> como en una ya activa. El sistema operativo decide cuándo ejecutarlo.</p>
            <h2>Compilar y exportar un motor V2</h2><p>Prepara la receta de tu proyecto y selecciona <strong>Compilar motores nativos · receta del proyecto</strong>. Studio la ejecuta en tu PC y muestra los resultados. Revisa esa receta y sus herramientas antes de ejecutarlas: son código del autor.</p><p>Exportar genera un .nelkmod autocontenido y aplica las mismas verificaciones V2 que la CLI.</p><p>El visor simula <code>host.engines</code>: selección de motor, controles, opciones, recursos y medios, con <code>simulated:true</code> y <code>native:false</code>. Los binarios del motor, la GPU, los estados y el rendimiento se prueban en Android o escritorio.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/simulador
