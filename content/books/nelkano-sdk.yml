      es:
        title: 'SDK de Nelkano'
        status: false
        body:
          value: '<p>El SDK sirve para crear funciones que se instalan en Nelkano como módulos. Puedes programarlas, probarlas en SDK Studio y exportarlas a un archivo <code>.nelkmod</code> para Android o escritorio, según las plataformas que declare el paquete.</p><p>Un módulo puede crear páginas, botones y formularios, ampliar pantallas existentes, registrar servicios, reemplazar proveedores, participar en eventos y almacenar entidades localmente. También puede gestionar partidas mediante las operaciones del core. Las modificaciones de memoria y ROM temporal están disponibles en GBA; no se ofrecen para todos los sistemas.</p><h2>Por dónde empezar</h2><ol><li>Instala y abre <a href="book://de520020-2026-4000-8000-000000000011/es">SDK Studio</a>.</li><li>Crea un proyecto y prueba el <a href="book://de520020-2026-4000-8000-000000000008/es">ejemplo de un botón</a>.</li><li>Consulta las <a href="book://de520020-2026-4000-8000-000000000014/es">operaciones de emulación</a> para darle una función real.</li><li>Exporta e importa el archivo en Ajustes → General → Módulos de Nelkano.</li></ol><h2>Qué hace cada parte</h2><p><strong>Nelkano en Android o escritorio</strong> ejecuta las operaciones disponibles en cada plataforma y dibuja la interfaz. <strong>El módulo</strong> decide qué ofrece al usuario y cuándo llama a esas operaciones. <strong>Studio</strong> permite probar el módulo con juegos y guardados ficticios.</p><p>El SDK se instala por separado. Para crear un módulo no necesitas el código del emulador ni Android Studio. La entrega actual de SDK Studio y sus herramientas es 1.0.0-beta para Windows x64. Se prepara como ZIP con Java incluido; Node.js 22 o posterior sigue siendo necesario. La administración puede activar el botón Descargar SDK en la página de Módulos y su entrada en Versiones. Esta descarga se mantiene oculta hasta que se publique. Los contratos de módulos siguen admitiendo sdkVersion 0.2.0.</p><h2>Nuevas funciones</h2><p><a href="book://de520020-2026-4000-8000-000000000016/es">Mandos y segunda pantalla</a>, <a href="book://de520020-2026-4000-8000-000000000017/es">idioma y temas</a> y <a href="book://de520020-2026-4000-8000-000000000018/es">parches</a> tienen operaciones propias del SDK y ganchos para otros módulos.</p><p><a href="book://de520020-2026-4000-8000-000000000019/es">Streaming</a> explica cómo emitir una partida y utilizar esa función desde otro módulo.</p><h2>Actualizar la aplicación</h2><p>Nelkano incorpora un aviso de nuevas versiones, descarga con progreso e instalación desde Ajustes → General → Actualización de Nelkano. La instalación espera a que cierres la partida y conserva tus datos y módulos. Android pide la autorización del sistema cuando corresponda. Windows utiliza un instalador MSI y Linux/SteamOS una distribución portable.</p><p>El primer APK o programa con este sistema debe instalarse una vez por el procedimiento habitual. El aviso depende de publicar una versión posterior en el catálogo de nelkano.com. La implementación local no publica una versión en producción. SDK Studio Windows dispone de su propio canal: Ajustes → Actualización de SDK Studio comprueba, descarga y permite instalar el paquete completo del programa y sus herramientas. Conserva proyectos y datos; guarda las ediciones y termina las operaciones y agentes antes de instalar. Las actualizaciones de módulos siguen siendo independientes.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano
  -
    uuid: de520020-2026-4000-8000-000000000002
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 20
    translations:
      es:
        title: 'Cómo funciona un módulo'
        status: true
        body:
          value: '<p>Tu archivo principal exporta <code>createModule(host)</code>. <code>host</code> es la puerta de entrada a las funciones de Nelkano.</p><ul><li><code>activate()</code>: prepara el módulo al activarlo.</li><li><code>deactivate()</code>: libera lo que haya solicitado al desactivarlo.</li><li><code>contributions(context)</code>: devuelve los botones y ajustes que deben aparecer en la pantalla actual.</li><li><code>dispatch(action, payload, context)</code>: ejecuta la acción elegida por el usuario.</li><li><code>onEvent(event)</code>, opcional: recibe avisos de cambios.</li><li><code>onHook(request)</code>, opcional: atiende llamadas de otros módulos.</li></ul><h2>El contexto</h2><p><code>context.surface</code> indica la pantalla. Puede incluir <code>gameId</code>, <code>systemId</code>, <code>session</code> y <code>selection</code>. En la biblioteca, selection contiene los juegos seleccionados. En ajustes generales puede no haber ningún juego abierto.</p><p>Una sesión tiene <code>id</code> y <code>generation</code>. Guarda ambos si necesitas operar sobre esa partida. Cuando cambia la partida, una referencia antigua deja de ser válida.</p><h2>Avisos que puedes recibir</h2><p><code>data-changed</code> avisa de cambios en los datos; <code>hooks-changed</code>, de cambios en los ganchos de otros módulos. Android también avisa con <code>library-imported</code> y <code>context-changed</code>. Los eventos de partida y guardados se explican en <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación</a>.</p><p>No crees un bucle para consultar todo continuamente. Responde a los avisos y lee solo lo que necesitas. Studio reconstruye los módulos al recargar; todavía no reproduce todos los detalles de deactivate y context-changed de Android.</p><h2>Cuándo se actualiza la interfaz</h2><p>La app conserva en memoria los botones y secciones que un módulo ya ha calculado. Al volver a una pantalla puede mostrarlos sin volver a pedirlos. La caché distingue pantalla, juego, selección y sesión: seleccionar otros juegos no reutiliza las acciones de la selección anterior.</p><p>Una acción actualiza las partes de su módulo. Los cambios compartidos, como biblioteca, guardados, cuenta, idioma o ganchos, actualizan también los módulos afectados. Los resultados nuevos sustituyen a los anteriores sin vaciar toda la pantalla. Desactivar o desinstalar un módulo retira sus elementos inmediatamente.</p><p>contributions(context) debe describir la interfaz a partir del contexto y de tus datos; no la uses para hacer cambios ni supongas que se llama en cada repintado. Las acciones y eventos siguen ejecutándose en el módulo aislado, con los mismos permisos. Studio aplica este mismo criterio de caché. La primera carga de un módulo todavía necesita iniciar su proceso.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/funcionamiento
  -
    uuid: de520020-2026-4000-8000-000000000003
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 30
    translations:
      es:
        title: 'Crear y llevar tu módulo al teléfono'
        status: true
        body:
          value: |-
            <h2>Instalar el SDK</h2><p>Necesitas Windows x64 y Node.js 22 o posterior, con npm. Instala juntos los dos archivos entregados:</p><pre><code>npm install C:/ruta/nelkano-sdk-1.0.0-beta.tgz C:/ruta/nelkano-sdk-tools-1.0.0-beta.tgz</code></pre><p>SDK Studio incluye Java. No necesitas Android Studio ni un JDK instalado.</p><h2>Crear un proyecto</h2><p>Abre Studio con <code>npx nelkmod dev</code>. En Ajustes → Nuevo módulo, elige una carpeta nueva, nombre, identificador y plantilla. Puedes crear todo desde esa ventana.</p><p>Si prefieres la terminal:</p><pre><code>npx nelkmod init mi-modulo
            npx nelkmod dev mi-modulo</code></pre><p>El proyecto tiene <code>manifest.json</code>, una carpeta <code>src</code> y sus recursos. El manifiesto indica nombre, ID, versión, permisos y archivos incluidos. Añade los archivos nuevos a files; Studio puede hacerlo al crearlos.</p><h2>Probar y exportar</h2><p>Guarda los cambios para actualizar el visor. Usa Exportar en Studio para obtener el .nelkmod firmado. Conserva la clave de firma: las actualizaciones de tu módulo tienen que usar el mismo autor.</p><p>También puedes exportar por terminal. Crea primero la carpeta C:/claves y usa destinos que no existan:</p><pre><code>npx nelkmod check mi-modulo
            npx nelkmod keygen C:/claves/author.pem C:/claves/author-public.pem
            npx nelkmod pack mi-modulo C:/claves/author.pem mi-modulo.nelkmod
            npx nelkmod verify mi-modulo.nelkmod</code></pre><p>En el teléfono abre Ajustes → General → Módulos → Importar módulo. Revisa sus permisos y actívalo. Para actualizar un módulo importado, desactívalo antes e importa el nuevo archivo con la misma clave.</p><h2>Módulos reservados a Tester</h2><p>Esta distribución está implementada y comprobada en la web local; no acredita su publicación en producción. En el catálogo web, una cuenta con permiso de administración de módulos puede crear una ficha con acceso Sólo Tester y subir directamente su archivo .nelkmod firmado. La ficha Tester no incluye repositorio ni necesita alojar el paquete en GitHub. Los módulos públicos conservan su enlace externo y el repositorio sigue siendo opcional.</p><p>La subida admite paquetes V1 de hasta 32 MiB y utiliza el mismo verificador de firma, inventario, tamaño y SHA-256. El archivo queda en almacenamiento privado y su descarga pasa por el servidor autorizado. Sólo Tester no admite imágenes públicas. El acceso se fija al crear la ficha; las versiones mantienen el ID del módulo y la clave del autor.</p><p>El buscador web y el catálogo nativo filtran en el servidor: las cuentas Tester y quienes administran módulos reciben los públicos y reservados; las demás cuentas y los visitantes sólo públicos. Nelkano utiliza su sesión para consultar las fichas y descargar los paquetes Tester. Cerrar esa sesión o dejar de tener acceso como Tester o administrador retira el acceso a sus fichas, versiones y descargas. Después de descargar se conserva la verificación local y la revisión de permisos antes de instalar; este acceso no añade capacidades ni cambia la versión del SDK.</p><h2>JavaScript o TypeScript</h2><p>Puedes usar ambos. En TypeScript, importa los tipos con <code>import type { Host, Extension } from '@nelkano/sdk'</code>. Los archivos locales se importan con rutas como ./model.js. El paquete final contiene JavaScript y recursos; no incluye Node.js ni librerías npm ejecutables.</p><p>Los comandos no suben las versiones por ti. No metas claves privadas ni ROMs en el paquete.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/crear-modulo
  -
    uuid: de520020-2026-4000-8000-000000000004
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 40
    translations:
      es:
        title: 'Permisos y datos'
        status: true
        body:
          value: |-
            <p>Declara en capabilities los permisos que necesita tu módulo. Si intenta llamar a una función sin permiso, la app rechaza la llamada.</p><table><thead><tr><th>Permiso</th><th>Qué permite</th></tr></thead><tbody><tr><td>library.read</td><td>Consultar juegos.</td></tr><tr><td>library.delete</td><td>Pedir un borrado con confirmación del usuario.</td></tr><tr><td>library.launch</td><td>Abrir un juego de la biblioteca, desde el principio o un guardado.</td></tr><tr><td>library.cover</td><td>Usar la captura de un guardado como carátula o restaurar la portada.</td></tr><tr><td>saves.read</td><td>Consultar los guardados.</td></tr><tr><td>saves.write</td><td>Guardar la partida actual en un slot manual.</td></tr><tr><td>saves.load</td><td>Cargar un guardado en la partida actual.</td></tr><tr><td>saves.autosave</td><td>Solicitar autoguardados.</td></tr><tr><td>emulation.read</td><td>Consultar la partida y recibir sus eventos.</td></tr><tr><td>emulation.control</td><td>Pausar, reanudar y reiniciar.</td></tr><tr><td>presentation.player</td><td>Cambiar pantalla completa, estiramiento, pantalla NDS/3DS y slot elegido.</td></tr><tr><td>storage.private.cas</td><td>Guardar preferencias propias.</td></tr><tr><td>modules.hooks</td><td>Usar y ofrecer ganchos entre módulos.</td></tr><tr><td>environment.display</td><td>Leer tamaño y densidad de pantalla.</td></tr><tr><td>presentation.control-layouts</td><td>Publicar posiciones, tamaños e iconos de controles.</td></tr><tr><td>presentation.appearance</td><td>Ofrecer estilos de apariencia.</td></tr></tbody></table><h2>Guardar una preferencia</h2><pre><code>const doc = await host.storage.read('preferences');
            const saved = await host.storage.compareAndSwap(
              'preferences', doc.revision, { enabled: true }
            );
            if (!saved) throw new Error('El ajuste cambió. Vuelve a intentarlo.');</code></pre><p>La revisión evita pisar un cambio más reciente. Los datos pertenecen a tu módulo y autor. Desactivar conserva las preferencias; al desinstalar, el usuario puede elegir borrarlas.</p><h2>Consultar o borrar juegos</h2><pre><code>const games = await host.library.list();
            await host.library.requestDelete([games[0].id]);</code></pre><p>requestDelete abre la confirmación de la app: no borra inmediatamente. El usuario puede cancelar. En Android se elimina la copia privada y sus guardados; se conserva el archivo original importado. Studio elimina solo datos ficticios.</p><h2>Cuenta</h2><p>account.session proporciona identidad, acceso, registro y salida. network.account permite peticiones a endpoints de cuenta aprobados de nelkano.com, no a cualquier servidor. resources.image devuelve la referencia de una foto elegida, sin rutas privadas. Android utiliza sesión cifrada y permisos firmados. Studio usa cuentas ficticias.</p><h2>Funciones de plataforma</h2><ul><li>input.gamepad: detectar mandos y aplicar o capturar asignaciones.</li><li>media.second-screen: buscar y conectar un receptor local.</li><li>media.streaming: iniciar y detener WebRTC con confirmación del usuario.</li><li>appearance.locale: aplicar un diccionario; para elegir tema necesita también presentation.appearance.</li><li>resources.patch: escoger un parche y crear una copia del juego.</li></ul><h2>Si se cierra un módulo</h2><p>Actualizar la app o perder el proceso de un módulo no lo desactiva. Android y escritorio intentan recuperar un proceso que ha terminado, con un máximo de tres intentos por ronda. Un error de código se muestra sin repetirlo indefinidamente.</p><p>Los módulos opcionales conservan tu elección de activarlos o apagarlos. Los cinco esenciales permanecen habilitados: Apariencia, Nelkano básicos, Editor de controles, Amigos y Parches. Si una versión anterior los dejó apagados o desinstalados, la app vuelve a incluirlos conservando los datos que existan.</p>
            <h2>Memoria, recursos y online</h2><table><tbody><tr><th>Permiso</th><th>Uso</th></tr><tr><td>emulation.memory.read</td><td>Leer rangos de memoria GBA permitidos.</td></tr><tr><td>emulation.memory.write</td><td>Cambiar RAM con comprobación de los bytes anteriores.</td></tr><tr><td>emulation.resources</td><td>Leer o buscar en la ROM y obtener una imagen reducida de la emulación.</td></tr><tr><td>emulation.handoff</td><td>Crear y restaurar checkpoints, preparar una copia privada de un proyecto y usar su puente RGSS.</td></tr><tr><td>presentation.overlay</td><td>Dibujar imágenes y etiquetas sobre la pantalla del juego.</td></tr><tr><td>network.multiplayer</td><td>Conectar con un amigo aceptado usando la cuenta de Nelkano y su relay.</td></tr><tr><td>runtime.events</td><td>Suscribirse al aviso runtime-tick de la sesión activa.</td></tr></tbody></table><p>Un permiso no garantiza que cualquier core implemente la operación. Una sesión antigua se rechaza. No se entregan rutas ni tokens a JavaScript.</p>
            <h2>Modificar juegos durante la sesión</h2><p>El contrato <code>host.gameMod</code> requiere declarar <code>emulation.game-mod</code> además del permiso de la operación: <code>emulation.read</code> para consultar capacidades, <code>emulation.memory.read</code> para leer y listar reglas, y <code>emulation.memory.write</code> para escribir o retirar una regla. Instalar reglas requiere lectura y escritura. Los hosts antiguos rechazan este permiso nuevo; no ejecutan el paquete con soporte parcial. Consulta <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a> para sus límites y la retirada de cambios activos. Estos permisos no dan acceso a archivos privados ni envían datos a servidores.</p>
            <h2>Entidades privadas en el dispositivo</h2><p>storage.entities permite entities.define({name,version,schema,indexes,relations}), get, query, transact y migrate. Los datos pertenecen al módulo y autor. Se guardan en SQLite local en Android/escritorio; Studio utiliza JSON local. No se suben a Nelkano. Relaciones dentro del mismo módulo, filtros de igualdad, índices, orden y páginas; lotes atómicos con expectedRevision y migraciones transaccionales. Hasta 64 tipos, 10.000 registros por tipo, 32 KiB por registro, 16 MiB por identidad y 128 cambios por lote. Las respuestas de consulta y lotes se acotan a 96 KiB. Una actualización fallida restaura las entidades anteriores; las preferencias CAS actuales conservan su formato.</p><h2>Conectar a otros servidores</h2><p>network.external abre connections.request/socket/read/send/close. Declara origins en el manifiesto firmado: esquema, servidor y puerto exactos. requestOrigin solicita permiso al usuario para un servidor nuevo y conserva la elección por autor. No hereda cookies ni claves de la cuenta Nelkano, ni sigue redirecciones. Android usa HTTPS/WSS; escritorio y Studio admiten también HTTP/WS. Hasta 12 trabajos, 8 HTTP y 4 sockets, cuerpos y mensajes de 64 KiB. onEvent recibe connection-changed y connection-origin-reviewed. Desactivar cancela conexiones. No envíes datos reales al probar: estas conexiones sí usan la red en Studio.</p><h2>Programar tareas</h2><p>runtime.tasks permite tasks.schedule({id,delayMs,intervalMs,payload}), read, update y cancel. onEvent recibe task-due con revisión, ocurrencias y payload; update publica progreso, estado y resultado. Hasta 32 tareas por módulo, intervalos entre 100 ms y 24 h, datos de 32 KiB. Los avisos se agrupan y no garantizan puntualidad. Se ejecutan mientras vive la aplicación; no hay tareas persistentes con la app cerrada. Los archivos privados y las credenciales propias se explican en las secciones siguientes.</p>
            <h2>Archivos privados por tramos</h2><p>storage.files permite files.list/read/begin/write/commit/abort/remove. begin recibe name, expectedRevision y mimeType opcional; write añade tramos consecutivos de hasta 64 KiB; commit publica el archivo completo o devuelve un conflicto sin pisar otra revisión. Hasta 16 archivos, 1 MiB por archivo, 4 MiB por módulo/autor y dos escritores abiertos por módulo. Desactivar elimina etapas sin publicar y conserva archivos publicados. Las actualizaciones fallidas restauran sus archivos anteriores.</p><p>files.import/export necesitan además resources.documents y abren el selector del sistema en Android/escritorio. El usuario escoge el origen o destino; el módulo no recibe rutas ni URI. Studio guarda archivos locales pero indica importExport:false para el selector nativo. Las imágenes PNG privadas se pueden usar en sus páginas con resource: file:imagen.png, vinculadas al registro activo y con máximo 1024×1024.</p><h2>Claves para servicios propios</h2><p>storage.secrets permite secrets.get/put/remove/capabilities. Hasta 64 claves, 4 KiB por valor y 64 KiB por módulo/autor. Android utiliza una clave Keystore separada y almacenamiento excluido de backup; Windows cifra con DPAPI. Linux utiliza Secret Service cuando está disponible; si falla, los cambios se mantienen solo en memoria. Studio guarda únicamente en memoria: usa claves de prueba. Consulta persistent después de guardar. La recuperación de actualizaciones usa copias cifradas o referencias opacas; no escribe secretos en texto plano en el journal. No comparte la sesión Nelkano con estos servicios.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/permisos
  -
    uuid: de520020-2026-4000-8000-000000000005
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 50
    translations:
      es:
        title: 'Añadir botones y ajustes'
        status: true
        body:
          value: |-
            <p>Para añadir algo a la interfaz, devuelve una descripción desde contributions. La app pone el tamaño, colores y estilo. Tu módulo no tiene que dibujar una ventana Android.</p><pre><code>{
              moduleId: 'example.tools', id: 'open',
              slot: 'SETTINGS_SECTION', section: 'Biblioteca',
              label: 'Mis herramientas', actionId: 'open',
              icon: 'standard:settings'
            }</code></pre><h2>Dónde puede aparecer</h2><ul><li>HOME_SECTION: una sección en Home.</li><li>LIBRARY_ACTION: botón de la barra de biblioteca.</li><li>LIBRARY_SELECTION_ACTION: acción para juegos seleccionados.</li><li>GAME_HEADER_ACTION: icono en la cabecera de la ficha.</li><li>GAME_ARTWORK_ACTION: botón en la esquina inferior de la carátula.</li><li>GAME_LAUNCH_ACTION: acción dentro de la ficha.</li><li>SAVE_ACTION: acción sobre un guardado.</li><li>SETTINGS_SECTION: una fila en Ajustes → General.</li><li>SYSTEM_ACTION y SYSTEM_SETTINGS_SECTION: acciones y ajustes de un sistema.</li><li>EMULATION_SETTINGS_SECTION: ajuste durante una partida.</li><li>PLAYER_ACTION y PLAYER_MENU: acciones durante una partida y en su menú.</li><li>PLAYER_SYSTEM_BUTTON: botón sobre el área de emulación.</li></ul><p>section agrupa filas dentro de General; no crea una pestaña. kind: 'toggle' y checked crean un interruptor. La acción recibe payload.checked con el nuevo valor.</p><h2>Abrir un formulario</h2><p>dispatch puede devolver un panel con title, fields, rows y actions. Los campos admiten texto, selección y JSON. Devuelve <code>{kind:'close-panel'}</code> para cerrarlo. El <a href="book://de520020-2026-4000-8000-000000000008/es">ejemplo mínimo</a> enseña un panel completo.</p><p>Usa enabled para desactivar una acción y visibility para limitarla a un juego, sistema o sesión. Recomprueba la disponibilidad antes de ejecutarla.</p><p>En PLAYER_SYSTEM_BUTTON, payload.controlId reutiliza un control existente. En GAME_LAUNCH_ACTION, payload.primaryLaunch: true coloca la acción junto a Jugar. En PLAYER_MENU, payload.menuAction: save, load o reset usa las tarjetas del menú de guardados; actionId sigue llamando a tu módulo. Estos datos eligen el lugar y estilo del botón, no ejecutan una operación por sí solos.</p><h2>Miniaturas en un panel</h2><p>Una fila puede llevar <code>thumbnail: {gameId, slot}</code>. La app busca esa captura y la muestra junto al texto. Usa <code>slot: null</code> para la carátula actual y añade <code>original: true</code> para la portada original. El panel también admite <code>preview: {gameId, slot}</code> para mostrar una imagen grande arriba.</p><p>No pases rutas ni PNG en el panel: usa los IDs que devuelve la app. Mostrar un slot requiere saves.read; mostrar una carátula requiere library.read. Si falta la imagen, aparece la portada de reserva.</p><h2>Páginas completas y barra de biblioteca</h2><p>LIBRARY_HEADER_ACTION añade un botón junto al buscador. LIBRARY_ACTION continúa en la fila de filtros.</p><p>Devuelve kind:page, title, fields, rows y actions para abrir una página dentro de Nelkano. Mantiene la navegación; kind:panel abre un modal. Los campos admiten password, email y checkbox. initial de checkbox es un booleano. Un botón con submitFields:false puede cambiar de página aunque queden campos sin completar.</p><p>onChangeAction envía el texto del campo después de 350 ms sin escribir; onChangeMinLength fija su longitud mínima. placement:header coloca acciones encima del formulario. Las filas con avatar muestran inicial, color e imagen PNG opcional; position:header las coloca antes de los campos.</p><h2>Avatares</h2><p>Una fila admite avatar con label, color, image PNG base64 o url. La imagen local tiene prioridad. Android carga las URLs del origen de cuenta permitido de forma asíncrona; requiere network.account. Studio no descarga imágenes remotas.</p><h2>Páginas de ajustes</h2><p>Devuelve <code>kind: "page", layout: "settings"</code> para una página con cabecera y botón de volver. En un campo select, <code>presentation: "tabs"</code> muestra pestañas horizontales; <code>initial</code> indica el valor activo. <code>onChangeAction</code> recibe el valor de la opción, sin comillas añadidas.</p><p>En rows, <code>presentation: "section"</code> dibuja un encabezado; <code>"actions"</code> agrupa botones en una fila; <code>"setting"</code> dibuja título, subtitle y value, con badge o icon opcional; <code>"list"</code> ofrece una fila sencilla que se puede tocar. Un icon puede ser un recurso del módulo declarado en files o un icono standard. La primera acción de una fila de ajuste o lista se ejecuta al tocarla. Usa <code>placement: "footer"</code> para dejar una acción al final del formulario. Los botones agrupados respetan primary y usan el mismo tamaño entre sí.</p>
            <h2>Programar páginas y modificar componentes</h2><p>presentation.extend permite ui.page, mount, patch, remove, open, close y targets. Crea páginas con secciones, filas, botones, formularios, pestañas, modales, imágenes PNG y lienzo con figuras. dispatch recibe acciones y valores del formulario. Monta contenido en home/library/game/saves/settings/emulation.before y .after; .content permite ocultar el cuerpo para sustituirlo. Los componentes publicados ofrecen puntos antes/después y modificaciones de texto, visibilidad, disponibilidad y actionId. Los componentes de módulos también se pueden ampliar. Los conflictos entre autores se rechazan y desactivar retira sus cambios.</p><p>Hasta 32 registros por módulo, 256 totales, contenido de 96 KiB, 512 nodos y profundidad 16. Comparte renderer con Studio. Se programa mediante JavaScript/TypeScript y componentes; no ejecuta HTML arbitrario. El editor visual todavía no está desarrollado y se consultará antes de empezarlo.</p>
            <h2>Imágenes generadas o descargadas</h2><p>Un módulo puede programar sus propios componentes componiendo nodos y dibujando figuras, o generar/descargar una imagen PNG y guardarla mediante files. Usa un nodo <code>{id:"imagen",kind:"image",resource:"file:imagen.png"}</code>. Requiere storage.files además de presentation.extend. El host valida formato y dimensiones y vincula la lectura al módulo/autor y a la revisión del registro de interfaz; las páginas no acceden a imágenes privadas de otro módulo. Funciona en el renderer compartido y en Studio.</p><h2>Consultar catálogos completos</h2><p>ui.targets({offset,limit}), entities.types({offset,limit}) y services.list(name,{offset,limit}) devuelven páginas de 32 entradas por defecto, hasta 128 y 112 KiB. Avanza offset con el número de entradas recibidas hasta recibir una página vacía. El tamaño puede limitar una página antes de llegar a limit.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ganchos-android
  -
    uuid: de520020-2026-4000-8000-000000000006
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 60
    translations:
      es:
        title: 'Conectar dos módulos'
        status: true
        body:
          value: |-
            <p>Un módulo puede ofrecer funciones para otros. Por ejemplo, el editor de controles acepta iconos y botones nuevos.</p><p>El proveedor declara sus ganchos en provides. El consumidor declara en consumes qué proveedor, gancho y versión necesita. Ambos usan modules.hooks. Marca optional: true si el módulo debe funcionar también sin ese proveedor.</p><h2>Añadir un botón al editor</h2><pre><code>await host.hooks.contribute(
              'nelkano.control-editor', 'system-buttons', 'my-button',
              { actionId: 'my-action', label: 'Mi botón', icon: 'assets/button.png' }
            );</code></pre><p>Declara assets/button.png en files. Cuando el usuario pulse el botón, tu módulo recibirá onHook con operation: 'my-action'. En el editor actual, request.value.context contiene el contexto de la partida. Usa ese contexto al llamar a operaciones de emulación.</p><p>Puedes indicar target: 'sys-pause' para reutilizar un control de sistema existente. Así conserva la posición que el usuario ya ajustó. Si no das target, el editor añade un control independiente.</p><h2>Otros métodos</h2><p>hooks.status consulta disponibilidad; hooks.list obtiene aportaciones; hooks.invoke llama al proveedor. El proveedor puede responder al consumidor con invokeContributor. Las entradas y salidas deben cumplir el esquema declarado por el gancho.</p><p>Si un módulo desaparece o se desactiva, sus botones desaparecen y sus iconos dejan de aplicarse. El editor conserva las elecciones para una futura reactivación.</p>
            <h2>Publicar servicios propios</h2><p>Con modules.services puedes registrar un contrato dinámico: name, version y methods. Cada método declara input/output con los mismos tipos de esquema que los hooks. onService recibe service, method, value, caller y provider con identidad real del módulo y autor. La base utiliza author: builtin. Las funciones se ejecutan dentro del runtime aislado del proveedor.</p>
            <pre><code>await host.services.register({
              name: "example.counter", version: "1.0.0",
              methods: { add: { input: {type: "integer"}, output: {type: "integer"} } }
            });
            // Otro módulo, con modules.services:
            const next = await host.services.call("example.counter", "add", 4);
            // El proveedor implementa onService(request) y devuelve el resultado.</code></pre>
            <p>list(name) descubre proveedores; unregister(name) retira solo los propios. call acepta provider, version mínima compatible dentro del major y author opcionales. Los contratos del mismo nombre/major deben conservar los mismos métodos y esquemas. No comparte código ni datos privados. Se rechazan ciclos y llamadas a un runtime ocupado. Límites: 256 proveedores, 32 métodos, profundidad de esquema 8 y datos hasta 96 KiB.</p>
            <h2>Elegir y reemplazar proveedores</h2><p>Ajustes ya no muestra un selector global de proveedores. Un módulo consumidor puede indicar una alternativa con <code>options.provider</code> al llamar a <code>services.call</code>. Sin proveedor explícito ni preferencia previa, el host prioriza su implementación integrada; si falta, utiliza el único proveedor disponible. Con varias alternativas sin implementación integrada, el consumidor debe indicar cuál utiliza. Los permisos y la compatibilidad del contrato siguen comprobándose.</p><p>La base publica nelkano.emulation 1.0.0, método execute, input {operation,args}, output {value:resultado}. Consulta list("nelkano.emulation") para copiar el contrato exacto. Abarca snapshot, pausa/reset, presentación, guardar/cargar, library.launch y library.setCover. Las APIs anteriores delegan a este servicio manteniendo sus permisos. El proveedor elegido puede implementar otro comportamiento y delegar a la base con provider: "nelkano.base", author: "builtin". Consumidor y proveedor necesitan el permiso original para las operaciones que soliciten. Afecta a operaciones de emulación solicitadas por módulos; no sustituye llamadas internas de la app ni motores nativos.</p>
            <h2>Crear eventos del módulo</h2><p>modules.events permite define(topic,schema), subscribe(topic), unsubscribe(topic) y emit(topic,value). Publica nombres que empiecen por el identificador del módulo y un punto. Solo el publicador puede emitir. onEvent recibe {type:"module-event",topic,value,sender:{moduleId,author}}. Una suscripción puede preceder al publicador. No se envían estos datos a servidores.</p><p>Hasta 256 temas, 64 suscripciones y 64 eventos pendientes por módulo. Una cola llena rechaza todo el envío sin entregas parciales. Se entregan hasta ocho eventos por ronda, aproximadamente cada 50 ms en primer plano; no ofrece entrega durable ni tiempo exacto. Desactivar limpia servicios, temas, suscripciones y colas. Los hooks anteriores continúan disponibles. SDK Studio reproduce estos contratos.</p>
            <h2>Transformar una operación antes o después</h2><p>services.intercept({id,name,method,phase,order}) añade una transformación before/after. onService recibe phase y hookId y devuelve un valor compatible con el esquema del método. removeInterceptor(id) la retira. Hasta 32 por módulo y 128 totales. Las llamadas propias no vuelven a entrar en su interceptor. Un error después de ejecutar una operación no deshace sus efectos.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ganchos-modulos
  -
    uuid: de520020-2026-4000-8000-000000000007
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 70
    translations:
      es:
        title: 'Cambiar la apariencia'
        status: true
        body:
          value: '<p>Los campos <code>select</code> se representan como desplegables tanto en páginas como en diálogos. <code>presentation:tabs</code> conserva la presentación en pestañas. La opción elegida mantiene su valor JSON.</p><p>Un módulo de apariencia puede ofrecer colores, fondo, fuente, iconos, tamaños y algunas opciones de distribución.</p><p>Declara presentation.appearance y un estilo en skins. Cada estilo tiene id y label. Las opciones actuales son colors, background, font, icons, cornerRadius, spacing, controlHeight, headerHeight, navigation y libraryView.</p><p>background e icons usan recursos del paquete; font usa un TTF declarado en files. navigation admite top o bottom; libraryView, grid o list. El usuario elige el estilo en el apartado Tema de ajustes.</p><h2>Qué no cambia todavía</h2><p>No permite sustituir cualquier pantalla por una interfaz libre, ejecutar HTML o dibujar Views propias. Las opciones disponibles modifican los componentes que la app ya sabe mostrar.</p><p>La plantilla Apariencia de Studio es un punto de partida. Guarda, elige su estilo en el visor y compara el resultado en Android antes de distribuirlo.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/apariencia
  -
    uuid: de520020-2026-4000-8000-000000000008
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000003
    weight: 80
    translations:
      es:
        title: 'Tu primer botón'
        status: true
        body:
          value: |-
            <p>Este módulo añade una fila en ajustes. Al pulsarla abre un panel. No necesita permisos porque no consulta ni modifica datos de la app.</p><pre><code>export function createModule(host) {
              return {
                async activate() {},
                async deactivate() {},
                async contributions(context) {
                  if (context.surface !== 'settings') return [];
                  return [{
                    moduleId: 'example.hello', id: 'hello',
                    slot: 'SETTINGS_SECTION', section: 'Mis módulos',
                    label: 'Hola', actionId: 'open', icon: 'standard:settings'
                  }];
                },
                async dispatch(action) {
                  if (action === 'close') return { kind: 'close-panel' };
                  return {
                    kind: 'panel', title: 'Hola desde mi módulo',
                    fields: [], rows: [],
                    actions: [{ actionId: 'close', label: 'Cerrar' }]
                  };
                }
              };
            }</code></pre><p>Pon example.hello también como id del manifiesto. Declara este archivo en files y úsalo como entry. Puedes partir de la plantilla Básico de Studio.</p><p>El siguiente paso es añadir una función real. Consulta <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación: operaciones y eventos</a> para crear un botón de pausa o guardado.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ejemplo-minimo
  -
    uuid: de520020-2026-4000-8000-000000000009
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000006
    weight: 90
    translations:
      es:
        title: 'Qué hacen los módulos incluidos'
        status: true
        body:
          value: '<p>La aplicación incluye cinco módulos. Los esenciales permanecen activos; los opcionales se pueden desactivar desde Ajustes → General → Módulos. Cada uno añade sus botones y funciones mediante el SDK.</p><h2>Nelkano básicos</h2><p>Reúne colecciones y favoritos, borrado de juegos, autoguardados, Continuar, selección de carátula desde un guardado y botones de emulación. También aporta configuración de mandos, segunda pantalla y streaming. Colecciones ya no se instala como un módulo separado.</p><p>Desde la biblioteca puedes crear colecciones, añadir o quitar juegos y filtrar. La estrella de la ficha guarda el juego en Favoritos y esa colección aparece en Home. Al actualizar desde una instalación anterior, las colecciones, sus juegos, favoritos y filtro se copian automáticamente al almacenamiento de Básicos. La actualización conserva las versiones actuales.</p><p>Al desactivar Básicos se retiran todas esas funciones; sus datos guardados se conservan para cuando lo actives de nuevo. Borrar una colección no borra los juegos.</p><h2>Editor de controles</h2><p>Permite colocar y ajustar los controles del jugador. Ofrece ganchos para añadir botones e iconos desde otros módulos.</p><h2>Apariencia</h2><p>Añade idioma y temas. Otros módulos pueden aportar temas mediante los contratos publicados.</p><h2>Amigos</h2><p>Aporta inicio de sesión, registro, amigos y perfil, junto con ganchos de invitaciones y datos de juego compatibles. Studio utiliza cuentas ficticias.</p><h2>Parches</h2><p>Selecciona y aplica parches IPS/VCDIFF compatibles a una copia de un juego GBA o NDS; conserva el original.</p><h2>Crear tus propios módulos</h2><p>La plantilla de Nelkano básicos de SDK Studio contiene las colecciones integradas. El ejemplo independiente de Colecciones del SDK se conserva como material para autores y no se incluye como un sexto módulo del producto.</p><h2>Esenciales y opcionales</h2><p>Apariencia, Nelkano básicos, Editor de controles, Amigos y Parches forman parte de Nelkano. Vienen incluidos, se activan al abrir la app y no tienen botones para desactivar ni desinstalar. Se actualizan con la aplicación. Si fallan, puedes reintentar su activación.</p><p>Los módulos nuevos son opcionales: no vienen dentro de la APK. El usuario importa su archivo .nelkmod y puede activarlos, desactivarlos o desinstalarlos. La app decide cuáles son esenciales; un módulo externo no puede hacerse obligatorio añadiendo un valor al manifiesto.</p><p>SDK Studio permite encender y apagar módulos en desarrollo para comprobar su funcionamiento. Esa prueba no cambia la política de la aplicación instalada.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ejemplos-distribuidos
  -
    uuid: de520020-2026-4000-8000-000000000010
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 100
    translations:
      es:
        title: 'Qué puedes hacer y qué falta'
        status: true
        body:
          value: '<h2>Disponible</h2><p>Los módulos pueden crear páginas, botones, formularios y modales; ampliar elementos de las pantallas existentes; registrar servicios y reemplazar proveedores; participar en eventos e interceptar operaciones que publica el host. Puedes guardar entidades en SQLite local, utilizar archivos privados y credenciales protegidas, conectar por HTTP o WebSocket a servidores autorizados y ejecutar tareas mientras Nelkano está abierto.</p><p>Biblioteca, colecciones, guardados, inicio y continuación de partidas, autoguardados, apariencia, controles, amigos, segunda pantalla, parches y streaming tienen operaciones documentadas. Cada llamada exige sus permisos y las capacidades de la plataforma o del core. Una captura se genera cuando el motor puede entregar imagen.</p><h2>Modificar juegos</h2><p><code>host.gameMod</code> ofrece lectura, búsqueda y comparación de memoria, escrituras con comprobación, reglas antes de cada frame, pulsaciones propias y cambios temporales en el espacio ROM. Estas operaciones funcionan en GBA en Android y Windows/Linux; los otros cores no las ofrecen. No se cambia el archivo ROM original ni se exporta una ROM modificada.</p><p>Un módulo puede declarar requisitos para cargar partidas y exigir una partida nueva cuando el core lo permita. Las modificaciones se retiran al desactivar el módulo, pero sus consecuencias pueden permanecer en el guardado habitual. Algunos guardados necesitarán el módulo para abrirse. Consulta <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a>.</p><h2>Interfaz y conexiones</h2><p>Las páginas y componentes usan el sistema de interfaz de Nelkano. Esto no permite instalar vistas Android propias, ejecutar código nativo ni reemplazar libremente cualquier parte del core. Los servicios y proveedores solo sustituyen los puntos que el host o los módulos publican.</p><p>La cuenta oficial conecta con nelkano.com. Las conexiones externas de un módulo son independientes y necesitan autorización para sus destinos. En Android se requiere HTTPS/WSS; escritorio también admite HTTP/WS con los permisos correspondientes. Las tareas no siguen ejecutándose después de cerrar la aplicación.</p><h2>Funciones no disponibles</h2><p>No hay sincronización integrada con Google Drive, traducción automática de juegos, importación de cores desde un paquete ni acceso libre al sistema de archivos. El módulo no recibe Node.js ni las rutas privadas de las ROMs. El SDK no configura el intervalo, destino o número de copias del autoguardado.</p><p>El editor visual que generará JavaScript o TypeScript para diseñar módulos todavía no está disponible. El editor de controles de Nelkano sirve para colocar los controles de juego y es una función distinta.</p><h2>Plataformas y cores</h2><p>Los cinco módulos esenciales son Básicos, Apariencia, Editor de controles, Amigos y Parches. Permanecen activos. Los demás módulos se importan por separado y deben declarar las plataformas compatibles. GBA Online y Pokémon Online son opcionales y tienen requisitos propios; no ofrecen multijugador universal. Los reportes son una integración privada de Android para testers autorizados.</p><p>Android admite archivos individuales y paquetes ZIP, RAR y 7z. Escritorio importa ROMs individuales, discos CUE con sus pistas y proyectos RPG Maker XP en ZIP; no importa paquetes generales de ROMs. MV/MZ se ejecuta en Android, no en escritorio.</p><p>SNES, PSP, GameCube y Switch no ofrecen estados de emulación. PSP conserva guardados internos en una Memory Stick privada. 3DS y Switch son experimentales, requieren Vulkan y en Android necesitan ARM64. Switch no expone audio al host. Conectar un core no certifica todos los juegos ni velocidad completa.</p><p>Segunda pantalla necesita una red local y un receptor emparejado. Streaming requiere cuenta, permiso y una partida cuya imagen y audio pueda capturar el host. El respaldo HTTP de Android no está conectado en escritorio. SteamOS no está certificado en una Steam Deck física.</p><h2>Probar bien</h2><p>Studio usa juegos, guardados y memoria simulados; no ejecuta ROMs ni modifica partidas reales. Comprueba permisos, errores, desactivación y referencias de sesión antiguas, y prueba el módulo en su plataforma de destino. Una prueba del visor no acredita gameplay ni compatibilidad con hardware real.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/limites
  -
    uuid: de520020-2026-4000-8000-000000000011
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000003
    weight: 35
    translations:
      es:
        title: 'Usar SDK Studio'
        status: true
        body:
          value: |-
            <h2>Instalar y abrir</h2><p>Necesitas Windows x64 y Node.js 22 o posterior en PATH. Instala juntos los paquetes sdk y sdk-tools 0.2.0 como indica <a href="book://de520020-2026-4000-8000-000000000003/es">Crear un módulo</a>. Java viene incluido.</p><p>Abre con <code>npx nelkmod dev</code> o <code>npx nelkmod dev C:/mis-modulos/ejemplo</code>. También puedes abrir el ejecutable incluido en sdk-tools. El lanzador Windows usa studio.vbs para iniciar el proceso auxiliar oculto. La ventana usa el icono de Nelkano.</p><p>El acceso directo preparado en este equipo abre los módulos actuales. Esa ruta pertenece al equipo de desarrollo; un usuario que instale el SDK debe abrir su propia carpeta. El futuro instalador descargable aún no está hecho.</p><h2>Trabajar con archivos</h2><p>Ajustes permite crear y abrir proyectos, guardar, exportar y mostrar paneles. A la izquierda están proyectos y carpetas; en el centro, los archivos; a la derecha, el visor. Puedes arrastrar los separadores y ocultar o recuperar paneles.</p><p>Crea archivos y carpetas o importa PNG y TTF. Ctrl+S guarda el archivo; Ctrl+Mayús+S, todos. Ctrl+F busca y resalta coincidencias; Intro o F3 avanza y Mayús+F3 retrocede. Los archivos sin guardar llevan un asterisco.</p><p>Guardar recompila y recarga el visor. Si hay errores, el visor conserva el último código válido. Si otro programa modifica un archivo con cambios pendientes, Studio avisa antes de sobrescribirlo.</p><h2>Probar la app</h2><p>El visor tiene juegos ficticios, fichas, guardados y ajustes. Los módulos usan las mismas operaciones de emulación que en Android, pero los guardados del visor son solo datos de prueba. No ejecuta ROMs, audio ni mandos físicos.</p><p>Pausa, pantalla completa, estirar y el slot seleccionado comparten un único estado entre visor y módulos. Los diálogos quedan dentro del teléfono simulado. Cambia orientación desde Ajustes. Restablecer datos recupera los juegos de prueba y borra las preferencias simuladas, con confirmación.</p><h2>Chat con Codex o Claude Code</h2><ol><li>Instala el CLI del agente y comprueba que codex o claude funciona en una terminal.</li><li>Inicia sesión con codex login o abriendo claude.</li><li>Abre Chat de agentes en Studio, selecciona modelo y nivel y escribe tu petición.</li></ol><p>El chat sigue el proyecto seleccionado y trabaja en su carpeta. No hace falta elegir otra carpeta dentro del chat. Codex obtiene los modelos del CLI; Claude usa sus alias disponibles. Studio detecta los agentes al abrir el panel y periódicamente.</p><p>Antes de enviar se guardan los archivos. El agente puede editarlos; al terminar se actualizan editor y visor. El botón de detener cancela el proceso y conserva los cambios que ya hizo. Las conversaciones se guardan por carpeta y agente.</p><p>Studio no instala ni inicia sesión en los agentes. El CLI envía la petición y lo que lea del proyecto a su servicio según tu configuración. El chat no cambia los permisos del módulo ni exporta, sube versiones o hace Git por ti.</p><h2>Exportar</h2><p>Exportar genera un .nelkmod firmado. Usa la clave local de desarrollo o selecciona la tuya. Conserva la clave elegida para publicar actualizaciones con el mismo autor. Después prueba el archivo en Android.</p><h2>Probar Amigos</h2><p>Crea un proyecto con Amigos (simulación) o abre modules/friends. En el visor entra a Biblioteca y pulsa Amigos junto al buscador. Usa demo@nelkano.test y Nelkano123. El registro crea cuentas ficticias sin enviar correo; la foto seleccionada es simulada. No introduzcas credenciales reales: Studio no conecta al servidor.</p><h2>Probar los nuevos controles</h2><p>El SDK incluye PSP, GameCube y Switch en el editor y en la configuración del mando. El visor ofrece juegos ficticios de esas consolas para probar los botones. Si conservas una biblioteca simulada anterior, puedes restablecer los datos del visor para recuperar las nuevas muestras. Studio sigue sin ejecutar ROMs ni comprobar mandos físicos.</p>
            <h2>Explorar memoria y generar código</h2><p>Pulsa Explorar memoria para leer bytes y valores, buscar un valor conocido o desconocido, filtrar los resultados entre capturas y generar funciones editables de lectura, escritura u observación en JavaScript o TypeScript. Utiliza GBA de prueba del visor; no conecta a partidas reales. Copiar código entrega texto para incorporar a tu módulo. Los pasos, permisos y límites están en <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a>. El constructor visual de páginas sigue pendiente.</p>
            <h2>Probar los módulos online</h2><pre><code>npx nelkmod example gba-online mi-gba-online
            npx nelkmod example pokemon-online mi-pokemon-online</code></pre><p>Carga Amigos, GBA Online y Pokémon Online juntos y abre la partida GBA ficticia del visor. Puedes comprobar los botones, la copia de estado y el retorno de un equipo simulado. El mundo no ejecuta Ruby y el relay no usa Internet. Antes de distribuir, exporta y prueba con juegos y dispositivos reales.</p><p>Studio admite hasta doce proyectos para cargar los cinco módulos esenciales y los opcionales durante el desarrollo.</p>
            <h2>Red y tareas de módulos propios</h2><p>connections reproduce peticiones HTTP y WebSocket reales a orígenes concedidos; no se simulan como Amigos o el relay online. Usa servidores y credenciales de prueba. tasks funciona mientras vive Studio y se limpia al detener o reconstruir el módulo. Juegos, cuentas Nelkano y hardware siguen simulados. No existe todavía un constructor visual de páginas.</p>
            <h2>Actualizar Studio</h2><p>En Windows x64, abre Ajustes → Actualización de SDK Studio. El programa también comprueba al abrir, recuperar el foco y cada seis horas. Puedes descargar con progreso, cancelar o posponer. Guarda los archivos y termina las operaciones y los agentes antes de instalar. Studio se cierra y abre la nueva versión con los proyectos; las fuentes, claves y datos de desarrollo se conservan.</p><p>La actualización incluye el ejecutable y las herramientas del SDK. El ZIP oficial se verifica y se instala en una carpeta nueva del usuario; Node.js sigue siendo un requisito. Los lanzadores anteriores seleccionan la versión activada. La primera entrega con el actualizador se instala por el procedimiento habitual; las siguientes dependen del canal publicado en nelkano.com. Esta implementación local no publica una versión en producción ni aumenta las versiones actuales.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/simulador
