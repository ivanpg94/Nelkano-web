      es:
        title: 'Reportes internos para testers'
        status: false
        body:
          value: '<p>Reportes de errores es un módulo oficial opcional para Android. Su distribución en el catálogo puede estar restringida; además, para enviar una incidencia la cuenta necesita el permiso firmado <code>error_reports</code>. Poder consultar módulos Tester o administrar el catálogo no concede por sí solo ese permiso de envío.</p><p>Su integración de envío es privada: no forma parte del SDK público ni se concede a módulos de terceros. El servidor comprueba los permisos de la cuenta y la aplicación sólo admite el módulo oficial firmado para esa operación.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/reportar-error
