    uuid: de520020-2026-4000-8000-000000000015
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 150
    translations:
      es:
        title: 'Amigos: cuenta, solicitudes y perfil'
        status: true
        body:
          value: |-
            <p>Amigos añade el acceso a la cuenta, el registro, una página de amigos y el editor de perfil. Su fuente está en modules/friends y usa SDK 0.2.0.</p><h2>Qué puedes probar hoy</h2><p>En Studio puedes iniciar y cerrar sesión, crear cuentas ficticias, buscar usuarios, enviar y cancelar solicitudes, aceptarlas, rechazarlas, eliminar amistades con confirmación y editar nombre, estado y color del perfil. El rol no se puede editar. El selector de foto devuelve un recurso simulado.</p><h2>En el teléfono</h2><p>Abre Amigos junto al buscador de Biblioteca o Cuenta en Ajustes. Accede con tu cuenta de nelkano.com, o regístrate y actívala desde el correo. La app muestra el mensaje del servidor, también si falla el envío. Puedes gestionar solicitudes y amistades y editar el perfil con foto. El rol lo decide el servidor.</p><h2>Cómo abrirlo</h2><ol><li>Abre modules/friends en Studio o crea un proyecto con Amigos (simulación).</li><li>En el visor, entra en Biblioteca y pulsa Amigos junto al buscador. También está en Cuenta dentro de Ajustes.</li><li>Usa demo@nelkano.test y Nelkano123, o registra otra cuenta ficticia.</li><li>Busca un usuario escribiendo al menos dos caracteres. La búsqueda espera 350 ms.</li><li>Entra en Editar perfil para probar los cambios.</li></ol><p>Studio no envía correos ni peticiones a Internet. Las cuentas y amistades se reinician al cerrar su servidor. No escribas contraseñas reales.</p><h2>Programar otra función de cuenta</h2><pre><code>const account = await host.account.snapshot();
            await host.account.login({email, password});
            await host.account.register({name, email, password,
              password_confirm: confirmation, terms: true});
            await host.account.logout();</code></pre><p>Declara account.session. La identidad incluye uid, signedIn, nombre, correo, permiso friends y rol; nunca tokens. El módulo define los formularios y sus validaciones.</p><pre><code>const account = await host.account.snapshot();
            const response = await host.network.request({
              method: "GET", path: "/api/nelkano/friends",
              accountUid: account.uid
            });</code></pre><p>Necesita network.account. Solo admite endpoints de cuenta aprobados, no cualquier servidor. El host comprueba la cuenta propietaria y responde con status y body. Android ejecuta la petición autenticada; Studio devuelve datos ficticios.</p><pre><code>const image = await host.resources.pickImage();
            if (!image.cancelled) {
              // Conserva image.resourceId hasta guardar el perfil.
            }</code></pre><p>Necesita resources.image. Devuelve una referencia del host y una vista previa opcional, sin rutas privadas. Amigos envía avatarResource al guardar. Seleccionar no publica la imagen; en Studio la foto es simulada y nunca se sube.</p><h2>Sesión y foto</h2><p>Android cifra la sesión con Android Keystore, valida los permisos firmados y renueva los tokens. Cerrar sesión elimina la copia local e intenta revocarla en el servidor. El módulo no recibe los tokens.</p><p>La foto seleccionada se publica al guardar mediante avatarResource en POST /api/nelkano/profile. PNG, JPEG y WebP hasta 4 MiB. El recurso caduca a los diez minutos y pertenece al módulo y cuenta que lo eligieron. Las filas pueden usar avatar.url: Android descarga imágenes de nelkano.com/sites/ sin bloquear la página; Studio no descarga imágenes remotas.</p><h2>Qué se ha comprobado</h2><p>Compilación y prueba Android en emulador con respuestas firmadas controladas: restauración cifrada, renovación tras 401, permisos, foto y cierre de sesión. También se ha comprobado el inicio de sesión real con dos cuentas de prueba autorizadas, en Moto G15 y emulador Android. No se modificaron las amistades existentes.</p><h2>Usar Amigos desde otro módulo</h2><p>Declara modules.hooks y consumes con provider nelkano.friends, el nombre del gancho y version 1.0.0. Con optional:false tu módulo requiere Amigos activo.</p><h3>Añadir una acción</h3><pre><code>await host.hooks.contribute("nelkano.friends", "friend-actions", "invite", {label: "Invitar a mi mundo", scope: "friends"});</code></pre><p>scope admite friends, incoming, outgoing y search; si lo omites, aparece en todos. Amigos llama a onHook con hook friend-actions, operation execute y value {accountUid, friend, scope}. contributionId identifica tu botón. Devuelve {message} para mostrar el resultado. Tu módulo debe implementar la invitación: Amigos no crea mundos por añadir este botón. Las acciones se retiran al desactivar al consumidor y se rechazan si la lista o la cuenta han cambiado.</p><h3>Consultar los datos</h3><pre><code>const data = await host.hooks.invoke("nelkano.friends", "friends-data", "refresh", {});</code></pre><p>refresh consulta el servidor y requiere sesión. snapshot devuelve los datos ya cargados; una lista vacía no significa que se haya consultado el servidor. Recibes revision, account y las listas friends, incoming y outgoing. Cada usuario incluye uid, name, statusText, avatarColor y avatarUrl. No se comparten correo, contraseña ni tokens.</p><h3>Recibir cambios</h3><pre><code>await host.hooks.contribute("nelkano.friends", "friends-events", "changes", {});</code></pre><p>Amigos llama a onHook con operation changed y value que incluye type (session-changed, friends-updated o profile-updated) y el snapshot. Conserva esos datos; no llames de vuelta a Amigos dentro del mismo callback. Son avisos de operaciones del módulo, no presencia en tiempo real ni notificaciones push del servidor. Máximo 16 acciones y 8 receptores; un receptor que falle no impide la operación principal.</p><h3>Probarlo</h3><p>Ejecuta npx nelkmod example friends-hooks mi-integracion. Carga Amigos y el ejemplo juntos en Studio. Aparece Invitar a mi mundo (ejemplo) junto a los amigos. Solo demuestra la llamada: no crea mundos ni envía invitaciones reales. El ejemplo se exporta por separado.</p><p>Amigos no interpreta la partida. GBA Online y Pokémon Online ofrecen esa integración como módulos opcionales: consulta el capítulo Online GBA.</p>
            <h2>Abrir el acceso desde tu módulo</h2><p>Consume account-access 1.0.0 de nelkano.friends. open devuelve la página de acceso o Amigos; dispatch recibe {action, payload} y ejecuta sus formularios; snapshot devuelve la identidad pública. Conserva los actionId al reenviar las acciones del formulario. La contraseña solo se usa para iniciar sesión y los tokens nunca llegan al módulo.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/amigos
  -
    uuid: de520020-2026-4000-8000-000000000016
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 160
    translations:
      es:
        title: 'Mandos y segunda pantalla'
        status: true
        body:
          value: '<p>Nelkano básicos incorpora estos ajustes. El módulo guarda las preferencias y dibuja los formularios. Android y escritorio reciben el mando y ejecutan las funciones de plataforma. Se reutilizan el catálogo de mandos, el protocolo de emparejamiento y WebRTC de la app anterior.</p><h2>Mando Bluetooth</h2><p>Empareja el mando en los ajustes de Bluetooth de Android. En Nelkano, abre Ajustes → General y busca Mando Bluetooth en la sección Controles. La página Controles muestra pestañas por sistema y filas de asignación, como la aplicación antigua. Elige el sistema, toca la fila de un botón y pulsa ese botón físico. Se admiten botones y direcciones de ejes; puedes restablecer cada asignación o todo el sistema. Guardar configuración pide un nombre; Cargar configuración abre la lista de perfiles guardados. Importar archivo y Exportar archivo abren el selector de documentos de Android. El respaldo JSON conserva sistema, asignaciones, perfiles y máscaras PS1; el máximo es 96 KiB. También puedes usar Copiar / pegar asignaciones. Se valida antes de guardar: un respaldo inválido no sustituye las asignaciones.</p><p>Con el permiso <code>input.gamepad</code>, llama a <code>host.input.snapshot()</code> para ver los dispositivos, <code>configure(bindings, ps1Bindings?)</code> para aplicar un mapa, <code>capture(device?)</code> para capturar un botón durante un máximo de 30 segundos, <code>settings()</code> para abrir Bluetooth y <code>release()</code> para liberarlo. También puedes llamar a <code>host.input.importProfile()</code>, que devuelve state o cancelled, y <code>exportProfile(state)</code>, que devuelve saved o cancelled. El usuario escoge el documento; el SDK no entrega rutas ni escribe archivos por su cuenta. Valida state en tu módulo antes de aplicarlo. Los valores tienen forma <code>KEY:96</code> o <code>AXIS:0:POS</code>. Solo un módulo puede controlar las asignaciones a la vez. Desactivarlo libera las teclas y cancela la captura.</p><h2>Segunda pantalla</h2><p>Ambos dispositivos deben estar en la misma red local. La página separa RECEPTOR, EMISOR y DISPOSITIVOS RECORDADOS. En un dispositivo toca Usar como segunda pantalla y elige Sí; el valor activo aparece marcado. En el otro pulsa Buscar pantallas y toca Conectar en la fila del receptor. Acepta el emparejamiento en el receptor. Intercambiar cambia la pantalla enviada. La entrada táctil del receptor corresponde a la pantalla inferior. Esta función necesita un juego que produzca dos pantallas.</p><p>El permiso es <code>media.second-screen</code>. Las llamadas son <code>host.secondScreen.snapshot()</code>, <code>discover()</code>, <code>connect(id)</code>, <code>disconnect()</code>, <code>receiver(enabled)</code>, <code>pair(enabled)</code>, <code>swap()</code> y <code>forget(id)</code>. El ID debe pertenecer a un receptor descubierto; no se admiten direcciones arbitrarias.</p><h2>Desde otro módulo</h2><p>Declara en consumes el proveedor <code>nelkano.basics</code>, el gancho <code>gamepad</code> o <code>second-screen</code> y la versión <code>1.0.0</code>. gamepad admite snapshot (devices, bindings y settings) y set con el respaldo completo: schemaVersion: 1, selectedSystem, bindings, profiles y ps1Bindings. ps1Bindings aplica las máscaras del mando PS1, incluidas combinaciones y L3/R3. El botón físico A corresponde a Cruz y B a Círculo, igual que en la app antigua; second-screen admite snapshot, discover, connect, disconnect, receiver, pair, swap y forget. Para connect/forget pasa id; para receiver/pair pasa enabled. Usa <code>host.hooks.invoke(provider, hook, operation, value)</code>.</p><h2>Qué reproduce Studio</h2><p>Studio ofrece un mando y un receptor ficticios y lo indica en los formularios. No se conecta por Bluetooth ni transmite por red. Los selectores de perfiles están simulados: importar devuelve cancelled y exportar confirma una exportación ficticia, sin escribir un archivo. Para probar el contenido de un respaldo en Studio usa Copiar / pegar asignaciones. Android compila con estos adaptadores; falta validar esta integración con mandos y una pareja de dispositivos reales.</p><h2>Streaming</h2><p>Ya tiene su propio puerto y gancho en Básicos. Consulta <a href="book://de520020-2026-4000-8000-000000000019/es">Streaming</a>.</p><h2>Mandos PSP, GameCube y Switch</h2><p>En Controles puedes elegir los tres sistemas y asignar sus botones. PSP distingue cruceta y stick; GameCube distingue cruceta, stick principal y C-stick. Puedes asignar ejes a sus direcciones. Esta ruta utiliza umbrales digitales, sin presión progresiva de gatillos ni inclinación proporcional. Android utiliza sus eventos de entrada; Windows/Linux usa SDL. Probar la pantalla de Studio no demuestra que un mando físico esté configurado correctamente.</p><h2>Navegar por la app con el mando</h2><p>Conecta el mando en los ajustes de Bluetooth del dispositivo. La navegación pertenece a la app base y funciona en Android, Windows y Linux aunque Nelkano básicos esté desactivado. Básicos añade las asignaciones y los perfiles guardados.</p><ul><li>Cruceta o stick: moverse entre botones, juegos y opciones. El elemento seleccionado queda resaltado.</li><li>A o Start: aceptar o abrir.</li><li>B o Select: cerrar la ventana o volver.</li><li>L/R: recorrer Home, Biblioteca, Guardados y Ajustes cuando no hay una ventana superpuesta.</li><li>X: seleccionar o quitar de la selección el juego resaltado en Biblioteca.</li></ul><p>En un selector, izquierda y derecha cambian el valor; aceptar también recorre sus opciones. En un deslizador, izquierda y derecha ajustan el valor de cinco en cinco. En un campo de texto, aceptar permite editarlo. Los controles que añade un módulo usan esta misma navegación: no necesitas programar un manejo del mando para cada botón.</p><p>Cuando se abre un diálogo, solo ese diálogo recibe las acciones. Volver no activa también la pantalla que hay detrás. La app libera las pulsaciones del juego al abrir menús, pausar o perder el foco; tampoco envía a la partida el botón mantenido al cerrar una ventana. Mientras capturas una asignación, la pulsación se usa para asignar y no para aceptar otro botón.</p><h2>Mando durante una partida</h2><p>Como en la aplicación antigua, la partida recibe el mando al entrar en pantalla completa; CHIP-8 también lo recibe en su vista normal. Fuera de pantalla completa, el mando recorre la interfaz. El botón de pantalla completa permite alternar entre ambas.</p><p>El catálogo de asignación incluye SNES y sus botones X/Y. PS1 y Switch mantienen L/R separados de L2/R2 o ZL/ZR. PS1 permite asignar L3/R3. En Android se pueden capturar ejes LTRIGGER, RTRIGGER, BRAKE y GAS, además de los sticks. Al reasignar un gatillo a otro botón se sustituye su función predeterminada.</p><p>Las asignaciones y los archivos de configuración existentes se conservan. Las plantillas del SDK incluyen el mismo catálogo y resolvedor. Studio muestra y guarda estos formularios con entradas ficticias; no comprueba un mando Bluetooth físico.</p><p>Los sticks siguen usando umbrales digitales. PSP y GameCube distinguen stick y cruceta; GameCube incluye C-stick. 3DS y Switch conservan la conversión del stick a las direcciones que conecta su adaptador. No se ofrece inclinación proporcional ni presión analógica de gatillos. El mando concreto y Steam Input necesitan una prueba en el dispositivo real; estas funciones no certifican gameplay ni compatibilidad de todos los mandos.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/mandos-segunda-pantalla
  -
    uuid: de520020-2026-4000-8000-000000000017
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 170
    translations:
      es:
        title: 'Idioma y temas'
        status: true
        body:
          value: '<p>El módulo Apariencia añade Idioma y tema en los ajustes. Incluye español e inglés y las cinco paletas de la app anterior: oscuro, claro, navy, slate y graphite.</p><p>Al abrir Idioma y tema aparecen marcadas las opciones activas. Puedes cambiar solo una y guardar: la otra se conserva. Al volver a abrir el formulario se muestra la elección guardada, tanto en Android como en Studio.</p><h2>Crear una apariencia</h2><p>Declara las paletas en <code>manifest.skins</code> y solicita <code>presentation.appearance</code>. La app dibuja sus elementos con la paleta elegida. Elige uno de los IDs devueltos por <code>host.appearance.snapshot()</code>; el ID incluye autor, módulo y nombre del tema. No lo construyas a mano.</p><p>Para aplicar un idioma pide además <code>appearance.locale</code> y llama a <code>host.appearance.apply({language, skinId, strings})</code>. strings relaciona el texto original en español con su traducción. Se admiten hasta 2048 textos, con claves de 512 caracteres y traducciones de 1024; la petición completa debe caber en 128 KiB. El texto sin traducción conserva su original. Los nombres de juegos y textos introducidos por el usuario no se traducen automáticamente.</p><h2>Ganchos de Apariencia</h2><p>El proveedor <code>nelkano.appearance</code> publica settings, theme-options y locale-options, versión 1.0.0. settings permite snapshot y set para language/skinId. theme-options acepta label y skinId de una paleta instalada. locale-options acepta label, language y strings. Los datos de una contribución siguen los límites generales de los ganchos: para un diccionario grande usa un módulo que aplique el idioma mediante el puerto appearance.</p><p>Estos puertos cambian paletas y textos de los componentes compartidos. Todavía no permiten sustituir libremente el diseño completo de una pantalla, instalar vistas Android propias ni ejecutar código nativo desde el módulo.</p><p>Studio aplica los mismos textos y paletas a su visor. Al desactivar Apariencia deja de aplicarse su diccionario; al reactivarlo recupera la elección guardada.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/idioma-temas
  -
    uuid: de520020-2026-4000-8000-000000000018
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 180
    translations:
      es:
        title: 'Parches de juegos'
        status: true
        body:
          value: '<p>Al abrir Parches, elige primero el fichero IPS o xdelta/VCDIFF. Después aparece Selecciona el juego a parchear, con el nombre del fichero, un buscador y la lista de juegos GBA y Nintendo DS. Toca el juego original para aplicar el parche, como en la app antigua. Cancelar cierra el selector sin aplicar nada. Se crea un juego con el resultado; la ROM importada se conserva. El motor es el mismo que utiliza la app anterior.</p><h2>Desde tu módulo</h2><p>Solicita <code>resources.patch</code>. <code>host.patches.pick()</code> abre el selector de documentos y devuelve resourceId y name, o cancelled. Después llama a <code>host.patches.apply({resourceId, gameId, title})</code>. title es opcional. La referencia pertenece al módulo que abrió el selector, caduca a los diez minutos y se consume al aplicar el parche. No es una ruta y no puede reutilizarla otro módulo.</p><p>El resultado devuelve gameId y title del juego creado. Una aplicación fallida no se publica en la biblioteca. Se comprueba la cabecera del resultado, pero IPS no garantiza que se haya elegido la ROM original correcta. Elige la versión exacta que pide el parche.</p><h2>Usar Parches desde otro módulo</h2><p>Declara el gancho <code>apply-patch</code> del proveedor <code>nelkano.patches</code>, versión <code>1.0.0</code>. formats devuelve formatos y sistemas admitidos. apply recibe gameId y title opcional; Parches abre su propio selector, pide el fichero al usuario y devuelve el juego creado o cancelled. No pases referencias de documentos obtenidas por otro módulo.</p><h2>Límites actuales</h2><p>No se admiten BPS, UPS ni PPF. La aplicación se limita a GBA y NDS; el parche puede ocupar hasta 64 MiB. Studio permite probar el formulario y la selección ficticia, pero avisa al aplicar: la modificación binaria debe probarse en Android con una ROM y un fichero reales.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/parches
  -
    uuid: de520020-2026-4000-8000-000000000019
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 190
    translations:
      es:
        title: 'Streaming de la partida'
        status: true
        body:
          value: |-
            <p>Nelkano básicos añade Streaming en Ajustes → Conexiones y en los ajustes de la partida. Abre un juego, inicia sesión con Amigos y pulsa Iniciar emisión. La cuenta necesita el permiso de streaming del servidor.</p><p>Antes de conectar, Android pide confirmar que se enviará el vídeo y audio del juego al receptor por WebRTC y como respaldo HTTP de imagen/audio a https://nelkano.com. No se utiliza el micrófono. Instalar o activar un módulo no inicia una emisión.</p><h2>Cómo compartir la partida</h2><p>El panel muestra el identificador, PIN y dirección del receptor cuando el servidor crea la sesión. Entrega esos datos a la persona que verá la partida. Actualizar consulta el estado; Detener cierra la emisión. También se detiene al cerrar o cambiar de juego, cambiar de cuenta, desactivar Básicos o pasar la app a segundo plano.</p><p>Los valores iniciales son 854 × 480, 30 fotogramas por segundo y 1800 kbps. Puedes cambiarlos antes de empezar. El panel muestra los fotogramas y buffers de audio enviados; esos contadores no garantizan que el receptor los haya reproducido.</p><h2>Usarlo desde tu módulo</h2><p>Solicita media.streaming. Solo un módulo puede emitir a la vez.</p><pre><code>const state = await host.streaming.snapshot();
            const result = await host.streaming.start({
              width: 854, height: 480, fps: 30, videoBitrateKbps: 1800
            });
            // result.cancelled vale true si el usuario cancela la confirmación.
            await host.streaming.stop();</code></pre><p>Los límites son: ancho 160–1920, alto 120–1080, fps 10–60 y bitrate 200–12000 kbps. snapshot devuelve state, message, active, destination y config; cuando existen, sessionId, pin, joinUri, stats y relay. relay incluye frames, audioChunks, failures y quality del respaldo HTTP. Los tokens de cuenta y de señalización permanecen en Android: no se entregan al JavaScript.</p><h2>Usar el gancho de Básicos</h2><p>Declara consumes con provider nelkano.basics, hook streaming, version 1.0.0 y el permiso modules.hooks. Puedes llamar a snapshot, configure, start y stop:</p><pre><code>await host.hooks.invoke('nelkano.basics', 'streaming', 'configure', {
              width: 854, height: 480, fps: 30, videoBitrateKbps: 1800
            });
            await host.hooks.invoke('nelkano.basics', 'streaming', 'start', {});</code></pre><p>configure guarda los valores de Básicos. start sigue pidiendo confirmación: otro módulo no puede evitarla.</p><h2>Qué está probado y qué falta</h2><p>Studio usa una cuenta, sesión y receptor ficticios. Permite probar el formulario y los ganchos, pero no transmite vídeo ni audio y no ejecuta ROMs. Android reutiliza el motor WebRTC y el protocolo de señalización de la app antigua. En el emulador del PC se han comprobado activación, cancelación, imágenes decodificables, bloques de audio de 500 ms y cierre recuperable de sesiones mediante un transporte de prueba sin red. Eso no certifica una emisión por Internet entre dispositivos físicos.</p><p>El respaldo HTTP reutiliza los formatos de la antigua: imágenes WebP/JPEG con calidad adaptativa y audio PCM de 16 kHz, mono, en bloques de 500 ms. Se mantiene disponible mientras emites; si falla la conexión WebRTC directa, el receptor puede seguir por HTTP. Cada tipo de medio admite una subida en curso y una cola limitada para no atascar el juego. El panel muestra sus contadores.</p><h2>Si la app se cierra inesperadamente</h2><p>Android guarda el identificador público de la emisión y la cuenta que la inició, sin PIN ni tokens. Antes de empezar otra emisión con esa misma cuenta intenta cerrar las anteriores. Si el servidor no responde conserva el registro para reintentar. No reanuda una emisión por su cuenta ni cierra sesiones de otras cuentas. Detener corta la captura y libera WebRTC; el cierre en el servidor se hace en segundo plano.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/streaming
  -
    uuid: de520020-2026-4000-8000-000000000020
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 200
    translations:
      es:
        title: 'Online GBA y mundos Pokémon'
        status: true
        body:
          value: |-
            <p>GBA Online pone la conexión; Pokémon Online entiende Pokémon. Son módulos opcionales, versión 0.1.0, que usan SDK 0.2.0. No vienen en la APK.</p><h2>Instalarlos y jugar</h2><ol><li>Importa GBA Online y después Pokémon Online desde Ajustes → Módulos. Amigos debe estar disponible.</li><li>Inicia sesión en ambos dispositivos con cuentas que sean amigas aceptadas.</li><li>Abre una ROM Pokémon compatible en cada dispositivo.</li><li>Abre Ajustes de emulación → CONEXIONES → GBA Online, selecciona al amigo y elige Host en uno e Invitado en el otro. Pulsa Conectar capa online.</li></ol><p>Cada jugador ejecuta su propia partida. Se comparten la posición, el mapa y mensajes del módulo. No es una emulación del cable link. El botón de Amigos inicia como Host; el otro jugador tiene que conectarse como Invitado. No envía una invitación push.</p><h2>Crear online para otro juego</h2><p>No necesitas modificar GBA Online para interpretar cada juego. Crea un módulo que consuma game-adapters 1.0.0 de nelkano.gba-online y registre un adaptador:</p><pre><code>await host.hooks.contribute("nelkano.gba-online",
              "game-adapters", "mi-juego", {label: "Mi juego"});</code></pre><p>En onHook, identify recibe sesión, gameId y systemId. Devuelve {compatible:true, compatibilityKey:"mi-protocolo-v1", transportSystem:"gba"} solo si reconoces el juego. capture devuelve sus datos públicos; render recibe peers para dibujarlos; messages recibe los paquetes específicos del juego. La clave debe coincidir entre jugadores que puedan comunicarse.</p><p>Consume sessions para consultar snapshot, conectar con {friendUid, role}, desconectar o enviar un mensaje con send y {type, payload, channel?}. GBA Online añade identidad de sesión y secuencia. channel reemplaza mensajes pendientes de ese canal, útil para posiciones; omítelo para mensajes que deban conservarse.</p><p>Contribuye al gancho events para recibir changed con type, state, sessionId, peers y packets. No hagas llamadas de vuelta al proveedor dentro del callback: producirías un ciclo. Amigos aporta listas y acceso a cuenta; la conexión autenticada y los tokens permanecen en el host.</p><h2>Entrar y salir del mundo Pokémon</h2><p>Importa el proyecto Pokémon Nelkano en la biblioteca. Desde una partida compatible con equipo válido, abre Ajustes de emulación → CONEXIONES → Pokémon Nelkano. Abrir Pokémon Nelkano prepara una copia privada del proyecto: entrenador, equipo, PC y gráficos. Conserva un checkpoint GBA de origen. El proyecto original no se modifica.</p><p>El módulo confirma la importación en la memoria del mundo, también cuando ya existía un guardado, y comprueba que la sesión usa su copia privada. Volver a GBA, en los ajustes de emulación del mundo, pide al puente RGSS preparar el retorno y guardar el mundo. Aplica los Pokémon compatibles al estado GBA y conserva el checkpoint original. El banco del mundo conserva los Pokémon incompatibles según las reglas de su plugin. Necesita el plugin Nelkano Bridge del juego; un RPG Maker cualquiera no ofrece esta función.</p><h2>Reutilizar datos de Pokémon</h2><p>Pokémon Online ofrece pokemon-state 1.0.0: snapshot devuelve perfil y la última presencia; party lee el equipo GBA. pokemon-events avisa changed tras una captura de presencia. La interpretación, especies y estructuras Gen 3 están en JavaScript, dentro del módulo.</p><h2>Límites actuales</h2><p>El reconocimiento contempla Esmeralda y Rojo Fuego/Verde Hoja y perfiles conocidos del proyecto. No garantiza que todos los hacks funcionen; Rubí/Zafiro y variantes con estructuras distintas necesitan adaptadores. La captura de avatar desde OAM no cubre todas las animaciones especiales del código antiguo.</p><p>Studio usa memoria y mundo ficticios. La presencia real se comprobó en Rojo Fuego entre Moto G15 y emulador Android. La comparación de gráficos y catálogo con el código antiguo cubre las ROM españolas de Esmeralda y Rojo Fuego. También se ha comprobado entrar al mundo y volver a la partida GBA en Moto G15 y emulador, conservando el checkpoint de origen. Moto G15 y el emulador completaron dos recorridos consecutivos cada uno sin reiniciar la app. No se han validado combates o intercambios completos ni una Steam Deck física.</p><p>Si la app se cierra de golpe, una conexión online puede quedar en el servidor hasta que caduque. Estos módulos se abren desde los ajustes de emulación. No añaden botones encima del juego.</p><h2>Movimiento y cortes de conexión</h2><p>GBA Online solicita presencia cada 100 ms. Pokémon no envía una captura de pantalla en cada presencia: comparte posición y sprite, y clasifica el combate una vez por segundo. Rojo Fuego/Verde Hoja lee la posición del jugador que está siguiendo la cámara en la RAM. Comparte coordenadas del mapa; cada móvil usa su propia cámara para dibujar al amigo. El desplazamiento del fondo no se utiliza como posición común.</p><p>Recepción y envío HTTP trabajan por separado. Un paquete fiable permanece en cola hasta que el servidor confirma; channel sustituye estados anteriores pendientes. Los fallos temporales reintentan hasta 60 segundos. Una sesión cerrada, cuenta caducada o permiso retirado terminan la conexión. Reconectar espera a que termine el cierre anterior. snapshot añade sentPackets, receivedPackets, retryCount, lastSentAt y lastReceivedAt; estos contadores describen el transporte, no garantizan que el otro juego haya aplicado un paquete.</p><p>La prueba de Rojo Fuego entre Moto G15 y emulador comprueba el tráfico recibido además del estado del panel. Se reprodujo que girar el teléfono pausaba la partida aunque el transporte continuaba conectado. Esta revisión mantiene la pantalla de juego al girar y bloquea la pausa mientras existe conexión online. No certifica todos los mapas ni cortes físicos de WiFi.</p><h2>Jugar sin pausa</h2><p>Desde <code>online.connect</code> hasta desconectar, fallar o retirar el módulo, la partida permanece en marcha. No necesitas añadir otro permiso ni un botón especial: el host aplica la regla del transporte. La pantalla no se apaga por inactividad durante Online. En Android, cambiar entre vertical y horizontal conserva la pantalla y la sesión.</p><p>Una pérdida de red y una partida pausada son problemas distintos. El panel muestra el mensaje del error si lo hay. Los registros locales de transporte conservan contadores y motivos de cierre, sin contraseñas, tokens ni cuerpos de paquetes. <code>online.disconnect({reason: "local-disconnect"})</code> admite un motivo corto para diagnóstico; puedes omitirlo.</p><h2>Estado y reconexión</h2><p>El estado aparece al principio del panel, tanto para Host como para Invitado. Conectado significa que se han recibido datos del amigo en los últimos ocho segundos. Si dejan de llegar, muestra Reconectando y explica que la sesión sigue abierta. No confundas una sesión HTTP abierta con un jugador activo.</p><p>GBA Online envía una señal de vida cada segundo y medio, incluso cuando el adaptador no puede leer la presencia durante una transición del juego. Los números de secuencia se controlan por remitente, para que un nuevo jugador no quede bloqueado por los mensajes del anterior.</p><p>El botón Reconectar capa online cierra la conexión anterior e inicia otra; el amigo debe entrar también en esa nueva sesión. El gancho sessions.snapshot devuelve state, transportState, peerActive y peerLastSeenAt, además de los datos anteriores. Los avisos events usan el mismo estado comprobado. sessions.connect sigue reutilizando una conexión con la misma configuración; la reconexión explícita corresponde al botón.</p><h2>Preparar pruebas en dos Android sin menús</h2><p>Para trabajar en el código de Nelkano hay un runner en scripts/qa/run-online-android.py. Se usa con la compilación debug de la app y dos dispositivos ADB. Indica los dispositivos Host e Invitado, sus UID, el ID del juego importado y el slot. Las cuentas deben estar iniciadas una vez. No envíes contraseñas en el comando.</p><p>El runner empaqueta los dos módulos Online, instala solo los paquetes que cambian, abre el juego y su guardado y conecta ambas partidas. Comprueba tráfico nuevo en los dos sentidos y guarda capturas y tiempos. Usa el instalador con firma, permisos y procesos aislados. --slot keep conserva una partida que ya esté abierta; --slot 0 carga S0 directamente. --apk permite instalar la APK debug al principio; no hace falta cuando solo cambia el módulo.</p><p>Esta entrada de ADB solo existe en debug y exige el permiso DUMP. Es una herramienta del repositorio para probar Online real, no una función del SDK Studio distribuido ni un acceso de las APK Release. Las pruebas del importador visual se hacen aparte.</p><h2>Movimiento remoto</h2><p>Las posiciones se siguen solicitando cada 100 ms; la red puede entregarlas con otro intervalo. El visor dibuja pasos intermedios con movimiento lineal y una duración adaptada a la llegada de posiciones, entre 100 y 350 ms. Al volver a moverse después de estar parado usa 100 ms. La cámara local sigue el frame del juego y no mueve al amigo como si fuera otro paso suyo; su origen conserva la continuidad al cruzar el límite de 256 píxeles.</p><p>Rojo Fuego evita leer IWRAM cuando ya se ha identificado el objeto vivo del jugador. El PNG se genera solo para el sprite elegido. GBA Online descarta remitentes de sesiones anteriores de la misma cuenta cuando recibe la nueva, para no dibujar copias después de reconectar. Esto mejora el dibujo y reduce trabajo local; no garantiza una frecuencia fija ni elimina la latencia de red.</p><h2>Preparar guardados reales para una matriz de pruebas</h2><p>Los colaboradores del proyecto pueden usar scripts/qa/prepare-pokemon-fixtures.py para avanzar sus ROMs locales en el core del PC mediante botones normales. Conserva un estado y una captura por hash de ROM; un archivo idéntico puede compartir estado, una ROM distinta necesita su propia partida.</p><p>scripts/qa/install-pokemon-fixtures.py envía las partidas a los dispositivos ADB. La herramienta PokemonFixturesActivity, exclusiva de debug con permiso DUMP, usa el importador de ROMs de la app, carga el estado en el adaptador GBA ARM y lo publica con miniatura en un slot libre. La validación usa una batería temporal independiente y no sustituye guardados existentes. Después puedes abrir el ID y slot registrados con run-online-android.py.</p><p>Esto prepara partidas para probar el módulo. Que un savestate cargue no demuestra que la presencia, los mapas o el intercambio Pokémon sean compatibles con esa ROM. Estos scripts pertenecen al repositorio de Nelkano y no forman parte del SDK Studio independiente. El paquete de estados contiene guardados y capturas; las ROMs se aportan por separado.</p>
            <h2>Perfiles y protagonista</h2><p>Pokémon Online reconoce Rojo Fuego/Verde Hoja, Esmeralda y Rubí/Zafiro. Los hacks con cabeceras modificadas pueden necesitar un perfil por hash y la ubicación de sus objetos vivos. Crush, por ejemplo, conserva una cabecera parecida a Esmeralda pero utiliza el diseño de RAM de Rubí. No basta con cambiar una etiqueta de compatibilidad: el perfil debe leer el protagonista y su mapa.</p><p>La captura prioriza la OAM que coincide con el sprite de software del protagonista, para evitar enviar un NPC cercano. Si ese sprite de mapa está visible, prevalece sobre la detección de combate por colores: una habitación no debe ocultar al amigo por parecerse cromáticamente a una batalla. Los perfiles Rubí/Zafiro ofrecen presencia entre jugadores; no ofrecen aún traslado al mundo ni lectura del equipo mediante pokemon-state.party.</p><p>Para comprobarlo, ambos dispositivos deben cargar la misma ROM y el savestate correspondiente. Ver al amigo superpuesto al jugador local sigue siendo una conexión válida si comparten posición. Las capturas y el movimiento permiten revisar la proyección; el tráfico de red por sí solo no demuestra que se esté dibujando el sprite correcto.</p>
