    uuid: de520020-2026-4000-8000-000000000014
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 140
    translations:
      es:
        title: 'Emulación: operaciones y eventos'
        status: true
        body:
          value: |-
            <p>Estas funciones permiten crear botones de emulación sin añadir una llamada particular a Android para cada módulo. Funcionan con el mismo contrato en Android y Studio.</p><h2>Consultar la partida</h2><pre><code>const state = await host.emulation.snapshot();
            if (!state) return; // No hay partida abierta.
            const session = state.session;</code></pre><p>Necesitas emulation.read. La respuesta incluye gameId, systemId, paused, capabilities, slots, canSave y display. display contiene fullscreen, stretch, screenMode y selectedSlot.</p><h2>Pausar, guardar y cambiar la pantalla</h2><pre><code>await host.emulation.setPaused(session, true);  // Pausar.
            await host.emulation.setPaused(session, false); // Reanudar.
            await host.emulation.reset(session);
            await host.emulation.setFullscreen(session, true);
            await host.emulation.setStretch(session, true);
            await host.emulation.setScreenMode(session, 1);
            await host.emulation.selectSlot(session, 2);
            await host.saves.save(session, 2);
            await host.saves.load(session, 2);</code></pre><p>Pausa y reinicio necesitan emulation.control. Los cambios de pantalla y selección de slot necesitan presentation.player. Guardar necesita saves.write; cargar, saves.load. screenMode vale 0 para Ambas, 1 para Superior y 2 para Inferior, y exige un core con DUAL_SCREEN.</p><p>Los slots manuales van del 0 al 5. El 6 pertenece al autoguardado: se puede cargar, pero saves.save no permite escribir allí. Solo puedes cargar un slot que exista. Consulta canSave y capabilities: un core puede no permitir guardar.</p><p>PSP permite guardar y cargar estados de emulación con estos mismos slots y operaciones. La carga requiere la misma imagen de juego y un formato de estado compatible con el core. GameCube continúa sin estados.</p><h2>Abrir o continuar un juego</h2><pre><code>await host.library.launch(gameId);    // Desde el principio.
            await host.library.launch(gameId, 6); // Desde el autoguardado.</code></pre><p>Necesitas library.launch. El ID debe existir en la biblioteca y el guardado debe existir. El módulo no recibe ni elige una ruta de ROM.</p><h2>Un botón de pausa completo</h2><p>Declara emulation.read y emulation.control. Desde contributions devuelve el botón durante la emulación y desde dispatch ejecuta la acción:</p><pre><code>async contributions(context) {
              if (context.surface !== 'emulation' || !context.session) return [];
              return [{
                moduleId: 'example.pause', id: 'pause',
                slot: 'PLAYER_SYSTEM_BUTTON', label: 'Pausa',
                actionId: 'pause', icon: 'assets/pause.png',
                payload: { controlId: 'sys-pause' }
              }];
            },
            async dispatch(action, payload, context) {
              if (action !== 'pause') return null;
              const state = await host.emulation.snapshot();
              if (!state || state.session.id !== context.session?.id ||
                  state.session.generation !== context.session?.generation) {
                throw new Error('Esta partida ya terminó.');
              }
              await host.emulation.setPaused(context.session, !state.paused);
              return null;
            }</code></pre><p>Declara el PNG en files. controlId reutiliza el control sys-pause y su posición guardada. Sin controlId se crea un botón independiente. Si varios módulos aportan el mismo control, activa uno para evitar resultados ambiguos.</p><h2>Autoguardados</h2><pre><code>await host.saves.setAutoSave(true);
            await host.saves.setAutoSave(false);</code></pre><p>Necesitas saves.autosave. La app guarda cada 60 segundos de juego sin pausa si el core lo permite, sobrescribiendo el slot 6. No modifica los manuales. Cada módulo mantiene su solicitud: basta una activa para que se siga guardando. Desactivar o desinstalar un módulo retira su solicitud.</p><p>El módulo guarda su preferencia y la vuelve a aplicar al activarse. Por ahora no puede cambiar el intervalo, destino ni cantidad de copias.</p><h2>Enterarte de los cambios</h2><p>Con emulation.read recibes estos eventos en onEvent: session-started, session-paused, session-resumed, session-closed, session-reset, save-created, save-loaded y display-changed.</p><pre><code>async onEvent(event) {
              if (event.type === 'save-created') {
                console.log('Guardado', event.slot, event.automatic);
              }
              return null;
            }</code></pre><p>Los eventos incluyen session y gameId; los de guardado incluyen slot. automatic es true para el autoguardado. Para leer el estado tras un cambio, consulta snapshot. No se envía un evento por cada fotograma.</p><h2>Evitar errores</h2><p>Usa la sesión que recibió la acción y no la cambies por otra partida. La app comprueba id y generation dentro de la operación: una llamada antigua se rechaza. Todas las funciones pueden fallar; captura el error si quieres explicar al usuario qué pasó.</p><p>Studio simula el estado y los guardados. Para comprobar que los bytes guardados permiten continuar el juego, prueba también en Android. Al guardar, la app conserva una captura de la imagen del motor, sin los botones de control. Los guardados anteriores sin captura mantienen su portada de reserva hasta que vuelvas a guardar. Studio crea miniaturas simuladas. host.gameRuntime.frame devuelve una imagen CPU reducida en ARGB; no exporta una captura a la galería. library.setCover permite usar una captura de guardado como carátula.</p>
            <h2>Leer el juego sin código específico en Android</h2><pre><code>const active = await host.emulation.snapshot();
            if (!active || active.systemId !== "gba") return;
            const result = await host.gameRuntime.read(active.session, {
              ranges: [{address: 0x02000000, length: 16}]
            });
            // result.ranges[0].data contiene los bytes en Base64.</code></pre><p>memory.read admite hasta 32 rangos y 64 KiB por petición; cada rango, hasta 32 KiB. patch recibe writes con address, data y expected; solo permite RAM y comprueba expected antes de aplicar. No escribas estructuras del juego sin conocer su formato.</p><p>rom lee {offset, length}; romSearch busca {pattern, offset?, end?, alignment?, maximum?}, donde pattern es Base64. frame recibe {width, height} y devuelve {width, height, argb}: ARGB de 32 bits en little endian, Base64, hasta 160 por eje y 16.384 píxeles. Requiere un frame CPU disponible.</p><p>subscribe(session, true) permite recibir runtime-tick aproximadamente cada 250 ms. Puedes pedir otra cadencia con subscribe(session, true, {intervalMs:100}); el host limita intervalMs entre 100 y 1000 ms. No es un evento por fotograma y una operación larga puede retrasarlo. subscribe(session, false) lo retira. overlay(session, nodes) publica hasta 32 imágenes PNG y etiquetas en coordenadas del frame; [] limpia la capa. Las imágenes tienen límites de tamaño y la capa se retira al cerrar o desactivar.</p><p>checkpoint conserva un estado privado; checkpointRead lo lee en bloques; checkpointPatch crea otro checkpoint y comprueba expected y las regiones RAM declaradas por el core. restore exige el mismo juego. Los checkpoints pertenecen al módulo y su autor y no aparecen como slots manuales.</p><p>projectWrite/projectRead trabajan en una copia privada del proyecto RPG Maker. Solo admiten Save/, Graphics/Characters/ y Graphics/Trainers/, con bloques de hasta 32 KiB y archivos de hasta 2 MiB. projectLaunch abre esa copia. invoke llama a un método sin argumentos de Game o de una constante RGSS terminada en Bridge, con {receiver, method}; el módulo elige el puente que ofrece el juego. external configura el transporte de mensajes RGSS. Estas operaciones requieren emulation.handoff y pueden fallar si el juego no ofrece el puente solicitado.</p><p>Save/ es una ruta lógica del proyecto privado: el host conserva la compatibilidad de RGSS con archivos relativos a la raíz y con Save/, y lee la copia más reciente. No se escribe el proyecto original importado.</p><p>projectActive(session, {gameId}) devuelve {active}: confirma si la partida usa la copia privada de ese módulo. No revela su ruta. Úsalo antes de preparar un retorno o invocar funciones sobre un mundo privado.</p><h2>Sprites que siguen la cámara</h2><p>Un nodo de overlay puede tener id y camera. Con camera, x e y son coordenadas de mundo; camera contiene xAddress, yAddress, x, y y modulus. x e y dentro de camera son el origen de cámara observado al preparar el nodo. El host compara esos valores con los registros del mismo fotograma, para mover el dibujo junto al mapa sin esperar a otro paquete.</p><pre><code>await host.gameRuntime.overlay(session, [{
              id: "jugador-2", x: 620, y: 180, width: 16, height: 32,
              image: pngBase64, label: "Mi amigo",
              camera: {xAddress: 0x04000014, yAddress: 0x04000016,
                x: 500, y: 100, modulus: 512}
            }]);</code></pre><p>La cámara necesita emulation.memory.read además de presentation.overlay. Por ahora GBA ofrece sus ocho registros de scroll de 16 bits entre 0x04000010 y 0x0400001e; direcciones alineadas. modulus es una potencia de dos entre 2 y 65536. Un core sin esos registros oculta el nodo de cámara. Las coordenadas de cámara se limitan a ±65536. Los nodos normales siguen usando coordenadas de pantalla. Los nodos de mundo con id conservan su identidad y suavizan el desplazamiento remoto con velocidad lineal. La duración se adapta al intervalo entre posiciones (100–350 ms); la cámara se corrige en cada frame y conserva su continuidad al cruzar el límite circular.</p><h2>Pausa durante Online</h2><p>Una partida online debe seguir avanzando. Mientras hay una conexión esperando, activa o recuperándose, el host oculta Pausa y rechaza peticiones de pausa. Al desconectar vuelve el comportamiento normal. SDK Studio reproduce esta regla con su conexión ficticia.</p><p>Consulta <code>pauseAllowed</code> en <code>host.emulation.snapshot()</code> antes de ofrecer una acción de pausa. Si vale <code>false</code>, <code>setPaused(session, true)</code> devuelve <code>false</code> y la partida sigue en marcha. En hosts anteriores el campo puede faltar; trátalo como permitido. Reanudar sigue disponible.</p>
            <h2>Modificaciones propias de un juego</h2><p><code>host.gameMod</code> añade un contrato general de espacios de memoria, escrituras por lotes y reglas ligadas a la sesión. No necesita un método particular de la base para cada idea o juego. La primera conexión real es GBA; Studio simula memoria. Los puentes <code>host.gameRuntime</code> anteriores y los módulos online mantienen sus contratos. Empieza por <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a> para consultar capacidades, permisos y comportamiento al retirar el módulo.</p><p>RPG Maker XP/RGSS y MV/MZ tienen los estados del emulador desactivados: no permiten guardar, cargar ni autoguardar. Los estados anteriores no aparecen en Guardados ni Continuar y no se borran. Los guardados internos del propio juego siguen siendo independientes. Consulta siempre las capacidades efectivas de la sesión antes de ofrecer acciones de estados.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/emulacion
