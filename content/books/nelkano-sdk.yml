    uuid: de520020-2026-4000-8000-000000000012
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000005
    weight: 55
    translations:
      es:
        title: 'Home, ficha y Favoritos'
        status: true
        body:
          value: |-
            <p>Puedes añadir secciones a Home y acciones a la ficha de un juego. Nelkano básicos utiliza estas contribuciones para Favoritos, Continuar y la elección de carátula.</p>
            <h2>Mostrar juegos en Home</h2><p>Publica una sección con los ID de los juegos que quieras mostrar:</p><pre><code>{
              moduleId: 'example.home', id: 'my-games',
              slot: 'HOME_SECTION', label: 'Mis juegos', actionId: 'open',
              payload: { section: {
                kind: 'game-carousel', gameIds: ['id-del-juego'],
                emptyLabel: 'Todavía no hay juegos'
              }}
            }</code></pre><p>Los ID deben existir en la biblioteca. Nelkano dibuja las tarjetas y abre su ficha al pulsarlas. emptyLabel es el texto que aparece cuando la sección está vacía.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-01-home.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-01-home.webp" width="960" height="715" alt="Juegos recientes en Home (datos de ejemplo)." data-caption="Juegos recientes en Home (datos de ejemplo)."></a><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-03-favorites.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-03-favorites.webp" width="960" height="715" alt="Sección Favoritos añadida por un módulo (ejemplo)." data-caption="Sección Favoritos añadida por un módulo (ejemplo)."></a><p>Favoritos ya viene integrado en Básicos. La estrella de la ficha añade o quita el juego de esa colección, y Home muestra su sección. No necesitas instalar Colecciones por separado; los datos se conservan al actualizar.</p>
            <h2>Añadir un icono a la ficha</h2><p>Usa GAME_HEADER_ACTION. Para una acción que se pueda marcar, indica su estado con checked; así funciona la estrella de Favoritos.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-02-game-details.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-02-game-details.webp" width="860" height="580" alt="Ficha del juego y estados guardados (ejemplo)." data-caption="Ficha del juego y estados guardados (ejemplo)."></a><h2>Ofrecer Continuar</h2><ol><li>Consulta saves.list para encontrar los estados disponibles.</li><li>Publica GAME_LAUNCH_ACTION con payload.primaryLaunch: true. La acción aparece junto a Jugar.</li><li>Cuando se pulse, elige el estado y llama a library.launch(gameId, slot).</li></ol>
            <p><strong>Jugar</strong> abre el juego sin cargar un estado de Nelkano; su progreso interno se recupera desde los menús del propio juego. También se puede cargar un estado concreto desde su miniatura, aunque los autoguardados estén desactivados.</p>
            <h2>Elegir una carátula de un guardado</h2><p>GAME_ARTWORK_ACTION coloca una acción en la esquina inferior de la portada. Básicos la utiliza para abrir el selector de capturas. Para cambiar la carátula desde tu módulo:</p>
            <pre><code>// Requiere library.cover. Los IDs vienen de library.list y saves.list.
            await host.library.setCover(gameId, slot);
            // Volver a la portada original:
            await host.library.setCover(gameId, null);</code></pre><p>Obtén los juegos con library.list y los guardados con saves.list. hasThumbnail indica si un estado tiene captura; coverSlot identifica la carátula elegida. Solo se aceptan juegos existentes, slots del 0 al 6 y guardados con captura. La elección se conserva al volver a abrir Nelkano.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/home-ficha-favoritos
  -
    uuid: de520020-2026-4000-8000-000000000013
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 130
    translations:
      es:
        title: 'Editor de controles'
        status: true
        body:
          value: |-
            <p>El Editor de controles permite cambiar posición, tamaño, visibilidad e iconos. Guarda un diseño por perfil y orientación. GB y GBC comparten <code>GAME_BOY</code>; NDS y SNES utilizan <code>NDS</code>.</p><p>Pulsa <strong>Guardar</strong> para aplicar los cambios. Cerrar con la × descarta el borrador.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-05-controls-before.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-05-controls-before.webp" width="960" height="720" alt="Distribución inicial de los controles de GBA." data-caption="Distribución inicial de los controles de GBA."></a><a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-06-controls-after.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-06-controls-after.webp" width="960" height="720" alt="Botón A después de moverlo y ampliarlo." data-caption="Botón A después de moverlo y ampliarlo."></a><h2>Leer la pantalla y aplicar un diseño</h2><ul><li><code>environment.snapshot()</code> obtiene el tamaño y la densidad de pantalla. Requiere <code>environment.display</code>.</li><li><code>presentation.applyControlLayouts()</code> aplica el diseño guardado y <code>releaseControlLayouts()</code> lo retira. Ambas necesitan <code>presentation.control-layouts</code>.</li></ul><p>Guarda las preferencias del módulo en su almacenamiento privado, con el permiso correspondiente.</p>
            <p>Cada control utiliza x e y entre 0 y 1, scale entre 0.5 y 2 y visible. Los perfiles separan PORTRAIT y LANDSCAPE. El editor y la partida utilizan las mismas coordenadas.</p>
            <h2>Añadir iconos o botones</h2><p>El Editor publica dos ganchos, ambos en la versión 1.0.0:</p><ul><li><strong>icons:</strong> ofrece al usuario un icono PNG del paquete para un control.</li><li><strong>system-buttons:</strong> añade un botón y la acción que ejecutará tu módulo.</li></ul>
            <h3>Elegir dónde aparece el botón</h3><ul><li><strong>systems:</strong> lista de identificadores de sistemas donde estará disponible. Si la omites, se ofrece en todos los perfiles.</li><li><strong>placement:</strong> posiciones iniciales portrait y landscape, cada una con x, y, scale y visible.</li><li><strong>target:</strong> permite editar un control existente. Si lo omites, el Editor crea un botón nuevo.</li></ul><p>Si tu módulo publica su propio PLAYER_SYSTEM_BUTTON, usa como target module:ID-del-consumidor:ID-del-botón. Así el Editor lo mueve sin duplicarlo y tu módulo conserva sus acciones y paneles. Publica las mismas posiciones iniciales en el botón y en placement.</p>
            <h3>Responder a la pulsación</h3><p>Si el Editor publica el botón, llama a tu módulo mediante <code>invokeContributor</code> con el contexto de la partida. Si publicas tu propio <code>PLAYER_SYSTEM_BUTTON</code> y su <code>target</code> empieza por <code>module:ID_DEL_CONSUMIDOR:</code>, la acción se envía directamente a tu módulo; el Editor conserva la colocación.</p><p>Implementa la operación en tu módulo. Aportar un icono de captura o streaming no implementa esas funciones. Los iconos se dibujan dentro del marco común de los botones de sistema.</p>
            <h2>Reutilizar los controles incluidos</h2><p>Básicos aporta pausa, guardar, cargar, estirar, pantalla completa y el selector de pantalla NDS/3DS. Reutiliza sus ID estables, como sys-pause y sys-save, para conservar las posiciones que haya elegido el usuario.</p><p>Definir un control en el perfil no basta para que aparezca: necesita una acción disponible en la partida.</p>
            <h2>Perfiles de PSP, GameCube y Switch</h2><p>Sus claves son <code>PSP</code>, <code>GAMECUBE</code> y <code>SWITCH</code>. GameCube ofrece stick principal y C-stick; PSP, un stick principal. <code>LEFT_STICK</code> y <code>RIGHT_STICK</code> identifican controles <code>JOYSTICK</code>. Actualmente envían direcciones independientes, sin intensidad proporcional de inclinación.</p><p>Los tipos <code>BuiltinControlProfile</code> y <code>StickControlInput</code> ayudan a programarlos. El contrato también admite claves de texto para crear perfiles propios. Las plantillas del Editor y de Básicos incluyen estos perfiles. El perfil Switch se conserva en el SDK y en Studio; no habilita su core, excluido de las apps Android y Desktop.</p>
            <h2>Teclado de RPG Maker en Android</h2><p>El perfil RPG Maker incluye Teclado, identificado por <code>sys-keyboard</code>. Se puede mover, redimensionar y ocultar por orientación. Durante la partida abre el teclado de Android para escribir, borrar con Backspace y confirmar con Enter.</p><p>Esta función pertenece al reproductor Android; no requiere un permiso nuevo del SDK ni ofrece un teclado virtual en escritorio o Studio.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/editor-de-controles
  -
    uuid: de520020-2026-4000-8000-000000000014
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 140
    translations:
      es:
        title: 'Emulación: operaciones y eventos'
        status: true
        body:
          value: |
            <p>Usa estas operaciones para pausar, guardar, cambiar la presentación o crear herramientas sobre una partida. Android y escritorio trabajan con el juego abierto; Studio utiliza datos simulados.</p>
            <h2>Consultar la partida abierta</h2><pre><code>const state = await host.emulation.snapshot();
            if (!state) return; // No hay partida abierta.
            const session = state.session;</code></pre><p>Declara emulation.read. La respuesta incluye gameId, systemId, paused, capabilities, slots, canSave y display. En display encontrarás fullscreen, stretch, screenMode y selectedSlot. Consulta esas capacidades antes de ofrecer una operación.</p>
            <h2>Pausar, guardar y cambiar la pantalla</h2><pre><code>await host.emulation.setPaused(session, true);  // Pausar.
            await host.emulation.setPaused(session, false); // Reanudar.
            await host.emulation.reset(session);
            await host.emulation.setFullscreen(session, true);
            await host.emulation.setStretch(session, true);
            await host.emulation.setScreenMode(session, 1);
            await host.emulation.selectSlot(session, 2);
            await host.saves.save(session, 2);
            await host.saves.load(session, 2);</code></pre><ul><li><strong>emulation.control:</strong> pausar, reanudar y reiniciar.</li><li><strong>presentation.player:</strong> pantalla completa, estirar, pantalla seleccionada y slot.</li><li><strong>saves.write:</strong> guardar un estado.</li><li><strong>saves.load:</strong> cargar un estado existente.</li></ul><p>screenMode admite 0 (Ambas), 1 (Superior) y 2 (Inferior), en motores con DUAL_SCREEN.</p>
            <p>Los slots manuales van del 0 al 5. El 6 es el autoguardado: puedes cargarlo, pero saves.save no permite escribir en él. Comprueba canSave y capabilities; algunos motores no admiten estados.</p>
            <p>SNES, PSP y GameCube utilizan estas mismas operaciones. Para cargar necesitas el mismo juego y un formato de estado compatible. Las pruebas de Switch con Dynarmic pertenecen al core de desarrollo PC; Switch está excluido de las apps Android y Desktop. Los perfiles y botones del editor no habilitan un core ni sus estados.</p>
            <h2>Abrir o continuar un juego</h2><pre><code>await host.library.launch(gameId);    // Abre el juego sin cargar un estado de Nelkano.
            await host.library.launch(gameId, 6); // Desde el autoguardado.</code></pre><p>Requiere <code>library.launch</code>. El gameId debe existir en la biblioteca y, si indicas un slot, ese estado debe estar guardado. Sin slot se abre el juego sin cargar un estado de Nelkano; el progreso interno se recupera desde los menús del juego. No se trabaja con rutas de ROM.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-02-game-details.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-02-game-details.webp" width="860" height="580" alt="Ficha del juego y estados guardados (ejemplo)." data-caption="Ficha del juego y estados guardados (ejemplo)."></a><h2>Añadir un botón de pausa</h2><p>Declara emulation.read y emulation.control. Publica el botón en contributions y responde a su pulsación en dispatch:</p><pre><code>async contributions(context) {
              if (context.surface !== 'emulation' || !context.session) return [];
              return [{
                moduleId: 'example.pause', id: 'pause',
                slot: 'PLAYER_SYSTEM_BUTTON', label: 'Pausa',
                actionId: 'pause', icon: 'assets/pause.png',
                payload: { controlId: 'sys-pause' }
              }];
            },
            async dispatch(action, payload, context) {
              if (action !== 'pause') return null;
              const state = await host.emulation.snapshot();
              if (!state || state.session.id !== context.session?.id ||
                  state.session.generation !== context.session?.generation) {
                throw new Error('Esta partida ya terminó.');
              }
              await host.emulation.setPaused(context.session, !state.paused);
              return null;
            }</code></pre><p>Incluye el PNG en files. controlId reutiliza sys-pause y la posición elegida en el Editor. Si lo omites, creas otro botón. Evita que varios módulos publiquen simultáneamente el mismo control.</p>
            <p>Al guardar se captura la imagen del motor, sin los controles. En NDS y 3DS, las miniaturas muestran la pantalla superior aunque estés viendo otra. Los estados anteriores sin captura la obtienen al volver a guardarse.</p>
            <h2>Solicitar autoguardados</h2><pre><code>await host.saves.setAutoSave(true);
            await host.saves.setAutoSave(false);</code></pre><p>Requiere saves.autosave. La app sobrescribe el slot 6 cada 60 segundos de juego sin pausa, cuando el motor lo permite. Los slots manuales se conservan.</p><p>Cada módulo tiene su propia solicitud: basta una activa para mantener el autoguardado. Al desactivar o desinstalar el módulo se retira la suya. Guarda tu preferencia y aplícala de nuevo en activate. El intervalo, el destino y la cantidad de copias no son configurables desde esta API.</p>
            <h2>Responder a los cambios de la partida</h2><p>Con emulation.read, onEvent recibe session-started, session-paused, session-resumed, session-closed, session-reset, save-created, save-loaded y display-changed.</p><pre><code>async onEvent(event) {
              if (event.type === 'save-created') {
                console.log('Guardado', event.slot, event.automatic);
              }
              return null;
            }</code></pre><p>Los avisos incluyen session y gameId. Los de guardado añaden slot y automatic, que es true para el autoguardado. Consulta snapshot si necesitas el estado actualizado. Estos eventos no se emiten por fotograma.</p>
            <h2>Manejar sesiones y errores</h2><p>Utiliza la sesión recibida en la acción. La app comprueba su id y generation y rechaza referencias de una partida anterior. Captura los errores para explicar al usuario qué operación falló.</p><p>Studio permite probar las llamadas y miniaturas simuladas. Para comprobar que un estado recupera el juego correctamente, pruébalo en la app de destino. library.setCover puede utilizar su captura como portada.</p>
            <h2>Leer memoria y recursos con gameRuntime</h2><pre><code>const active = await host.emulation.snapshot();
            if (!active || active.systemId !== "gba") return;
            const result = await host.gameRuntime.read(active.session, {
              ranges: [{address: 0x02000000, length: 16}]
            });
            // result.ranges[0].data contiene los bytes en Base64.</code></pre><p><code>host.gameRuntime.read()</code> admite hasta 32 rangos y 64 KiB por petición; cada rango puede tener hasta 32 KiB. <code>patch()</code> recibe <code>writes</code> con <code>address</code>, <code>data</code> y <code>expected</code>. Solo funciona en adaptadores con escritura y compara los bytes esperados antes de aplicar el cambio.</p><p>Los permisos de estas operaciones son:</p><ul><li><code>read</code>: <code>emulation.memory.read</code>.</li><li><code>patch</code>: <code>emulation.memory.write</code>.</li><li><code>rom</code>, <code>romSearch</code> y <code>frame</code>: <code>emulation.resources</code>.</li><li>Checkpoints y proyectos: <code>emulation.handoff</code>.</li><li><code>subscribe</code>: <code>runtime.events</code>.</li><li><code>overlay</code>: <code>presentation.overlay</code>.</li></ul>
            <h3>ROM, imagen y avisos periódicos</h3><ul><li><strong>rom:</strong> lee {offset, length}.</li><li><strong>romSearch:</strong> busca {pattern, offset?, end?, alignment?, maximum?}; pattern es Base64.</li><li><strong>frame:</strong> recibe {width, height} y devuelve {width, height, argb}. Es una imagen CPU reducida, ARGB de 32 bits en little endian y Base64, de hasta 160 píxeles por eje y 16 384 píxeles en total. No exporta a la galería.</li><li><strong>subscribe(session, true):</strong> activa runtime-tick, por defecto cada 250 ms. Puedes pedir {intervalMs:100}; el host lo limita a 100–1000 ms. Una operación larga puede retrasar el aviso. Usa subscribe(session, false) para retirarlo.</li></ul>
            <h3>Superponer imágenes y etiquetas</h3><p>overlay(session, nodes) publica hasta 32 PNG y etiquetas en coordenadas del frame. Respeta los límites de imagen anunciados. Una lista vacía limpia la capa; cerrar la sesión o desactivar el módulo también la retira.</p>
            <h3>Crear un checkpoint privado</h3><p>checkpoint conserva un estado privado del módulo y su autor. checkpointRead lo lee por bloques; checkpointPatch crea otro comprobando expected y las regiones RAM del motor. restore exige el mismo juego. No aparece entre los slots manuales.</p>
            <h3>Trabajar con una copia de RPG Maker</h3><p>projectWrite y projectRead utilizan una copia privada del proyecto. Admiten Save/, Graphics/Characters/ y Graphics/Trainers/, con bloques de hasta 32 KiB y archivos de hasta 2 MiB. projectLaunch abre esa copia.</p><p>invoke llama a un método sin argumentos de Game o de una constante RGSS terminada en Bridge, mediante {receiver, method}. El juego debe ofrecer ese puente. external configura el transporte de mensajes RGSS. Estas operaciones requieren emulation.handoff.</p><p>Save/ es una ruta lógica de la copia privada. El host admite los archivos RGSS relativos a la raíz o a Save/ y lee la copia más reciente. El proyecto importado original se conserva.</p><p>Antes de invocar funciones de una copia privada, consulta projectActive(session, {gameId}). Su respuesta {active} confirma si esa partida está usando la copia de tu módulo, sin revelar su ruta.</p>
            <h2>Hacer que un sprite siga la cámara</h2><p>Añade id y camera al nodo de overlay. Con camera, x e y son coordenadas del mundo; x e y dentro de camera indican el origen de cámara observado al preparar el nodo. El host compara ese origen con los registros del fotograma y ajusta el dibujo al desplazarse el mapa.</p>
            <pre><code>await host.gameRuntime.overlay(session, [{
              id: "jugador-2", x: 620, y: 180, width: 16, height: 32,
              image: pngBase64, label: "Mi amigo",
              camera: {xAddress: 0x04000014, yAddress: 0x04000016,
                x: 500, y: 100, modulus: 512}
            }]);</code></pre><p>Requiere <code>emulation.memory.read</code> y <code>presentation.overlay</code>. Se admiten los registros GBA alineados de 16 bits entre <code>0x04000010</code> y <code>0x0400001e</code>, y los registros GB/GBC <code>SCY/SCX</code> en <code>0xff42/0xff43</code>. Utiliza los registros que entregue el adaptador: si faltan en el frame, el nodo se oculta.</p><p><code>modulus</code> debe ser una potencia de dos entre 2 y 65536. Las coordenadas de cámara se limitan a ±65536. Sin camera, el nodo usa coordenadas de pantalla. Un <code>id</code> estable conserva su identidad y suaviza los desplazamientos remotos entre posiciones.</p>
            <h2>Comprobar si se puede pausar</h2><p>Durante una conexión online en espera, activa o recuperándose, la partida debe avanzar: el host oculta Pausa y rechaza la pausa hasta desconectar. Studio reproduce esta regla con su conexión ficticia.</p><p>Consulta <code>pauseAllowed</code> en <code>host.emulation.snapshot()</code>. Si es <code>false</code>, <code>setPaused(session, true)</code> devuelve <code>false</code> y la partida continúa. Si falta el campo en un host anterior, trátalo como permitido. Reanudar sigue disponible.</p>
            <h2>Modificar el comportamiento del juego</h2><p>Utiliza <code>host.gameMod</code> para los espacios de memoria, escrituras por lotes y reglas. GBA ofrece memoria y ROM temporal; Studio las simula. <code>host.gameRuntime</code> conserva sus operaciones específicas. El capítulo <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a> explica capacidades, permisos, conflictos y retirada del módulo.</p>
            <p>RPG Maker XP/RGSS y MV/MZ usan los guardados internos del juego y no admiten guardar, cargar ni autoguardar estados de emulación. Los estados anteriores se conservan como archivos, pero no aparecen en Guardados o Continuar.</p>
            <h2>Transferir juegos y progreso</h2><p><code>host.transfers</code> intercambia contenido entre Android y escritorio. Declara <code>library.transfer</code> para juegos y <code>saves.transfer</code> para progreso. Cada permiso permite exportar e importar su categoría. Implementa la conexión y la interfaz de usuario; el host valida los datos y los incorpora a la biblioteca.</p>
            <h3>Exportar</h3><ol><li>Consulta <code>capabilities()</code> para obtener disponibilidad y cuotas.</li><li>Llama a <code>inspect({gameId})</code>. Recibes <code>contentFingerprint</code>, <code>savesRevision</code>, <code>saveKinds</code>, plataforma y limitaciones.</li><li>Crea una copia estable con <code>exportGame({gameId})</code> o <code>exportSaves({gameId})</code>. La respuesta es <code>{id,format,kind,gameId,title,systemId,size,sha256}</code>.</li><li>Lee bloques con <code>read({id,offset,length})</code>, que devuelve <code>dataBase64</code>.</li><li>Libera la exportación con <code>close({id})</code>.</li></ol>
            <h3>Importar</h3><ol><li><code>beginImport({kind,gameId,size,sha256})</code> crea una recepción privada.</li><li>Envía bloques consecutivos con <code>write({id,offset,dataBase64})</code> y comprueba el total recibido.</li><li><code>commit({id,expectedRevision?})</code> verifica tamaño, SHA-256, manifiesto y hashes antes de publicar el contenido.</li></ol><p>La respuesta incluye la identidad, <code>importedGame</code>, <code>importedSaves</code> (número de slots) e <code>importedSaveFiles</code> (total de archivos de progreso). El éxito consume la recepción. Si falla, puedes reintentar o descartarla con <code>abort({id})</code>. <code>close</code> y <code>abort</code> devuelven false si el identificador ya no existe o no es tuyo.</p>
            <h3>Reemplazar progreso existente</h3><p>Obtén la revisión en el dispositivo de destino con <code>inspect</code> y envíala como <code>expectedRevision</code>. El host comprueba que no haya cambiado mientras preparabas la transferencia. Sin revisión solo se importa progreso si aún no existe.</p><p>Se reemplaza el conjunto completo: también se eliminan los archivos de progreso ausentes del paquete. Explica la sustitución al usuario y resuelve los conflictos. Si ya existe el juego con contenido diferente, se rechaza la importación sin sobrescribirlo.</p>
            <h3>Qué contiene una transferencia</h3><p><code>nelkano-transfer/1</code> es un ZIP de datos con <code>manifest.json</code> y <code>data/</code>. Es independiente del paquete ejecutable <code>.nelkmod</code>. Conserva el <code>gameId</code> original y verifica la identidad del sistema, la entrada y el índice de archivos con tamaños y hashes.</p><p>Los juegos incluyen ROM, disco y pistas o proyecto completo, también sus directorios vacíos. El progreso incluye slots 0–6, capturas, batería/SRAM, carátula, archivos nativos por juego y <code>Save</code> de RGSS. Conserva los requisitos de módulos y autores de los guardados. Los datos privados de otros módulos quedan fuera.</p>
            <h3>Cerrar la partida y comprobar compatibilidad</h3><p>Inspeccionar, preparar una exportación y publicar una importación requieren la sesión cerrada. Puedes recibir bloques o leer una exportación ya preparada mientras se usa la app. Tras una interrupción, el host completa o revierte la publicación antes de abrir otra partida.</p><p>La transferencia conserva bytes; no convierte estados entre motores. El destino necesita un formato compatible y algunos guardados internos dependen de la plataforma o versión. Consulta la inspección y el manifiesto. Los guardados MV/MZ de WebView quedan fuera. Los paquetes sintéticos de Studio solo se importan en Studio.</p>
            <h3>Límites de transferencia</h3><ul><li>Bloques de hasta 65 536 bytes.</li><li>Hasta 64 GiB de archivo y contenido expandido; 100 000 archivos y manifiesto de hasta 32 MiB.</li><li>Dos operaciones abiertas por módulo y ocho globales; caducan tras diez minutos sin actividad.</li><li>Se rechazan rutas inseguras, enlaces, duplicados por mayúsculas, miembros extra y tamaños o hashes incorrectos.</li></ul><p>El espacio y la velocidad dependen del dispositivo. Las transferencias largas tienen su propio límite de comunicación entre procesos; no se sujetan al de cinco segundos del código JavaScript.</p>
            <h2>Capturar una imagen o grabar un clip</h2><ol><li>Consulta <code>host.media.capabilities()</code> para saber si la sesión entrega imagen, audio y captura CPU o de superficie.</li><li>Usa <code>capture({session,screen?,region?,format?})</code> para capturar en PNG o JPEG, con resolución completa o recorte.</li><li>Lee el resultado por bloques de hasta 64 KiB con <code>read({id,offset,length})</code>.</li><li>Libéralo con <code>release({id})</code>.</li></ol>
            <p><code>startRecording({session,fps?,maxSeconds?})</code>, <code>recording({id})</code> y <code>stopRecording({id})</code> graban un AVI con MJPEG y PCM si el motor entrega audio. Los límites son 30 fps, 300 segundos y 1 GiB. <code>export({id})</code> abre el selector de documentos para guardarlo y <code>remove({id})</code> lo descarta.</p><p>Se graba el juego, sin escritorio, micrófono ni cámara. Pasar al fondo termina la grabación; revocar el módulo elimina sus recursos. Cada resultado conserva el permiso y la generación de sesión con los que se creó.</p>
            <h3>Ajustar las etiquetas superpuestas</h3><p><code>runtime.overlay</code> admite textos de hasta 4096 caracteres. Puedes indicar <code>textWidth</code> en píxeles del juego, <code>fontSize</code> de 8 a 48 sp, <code>maxLines</code> de 1 a 16 y <code>textColor</code>/<code>backgroundColor</code> con formato <code>#AARRGGBB</code>. Omitir estos campos conserva la presentación anterior.</p>
            <h2>Analizar y traducir texto de un juego</h2><ol><li>Consulta <code>host.translation.capabilities()</code> para conocer los formatos y proveedores.</li><li><code>projects()</code> recupera los proyectos de tu módulo, también tras reiniciar la app.</li><li>Inicia el análisis con <code>analyze({gameId})</code>. Usa <code>job({jobId})</code> para seguirlo o <code>cancel({jobId})</code> para cancelarlo.</li><li>Lee las entradas por páginas con <code>entries({projectId,offset?,limit?})</code> y guarda ediciones con <code>update({projectId,resourceId,textId,translation,expectedRevision})</code>.</li></ol>
            <p><code>translate({projectId,provider,sourceLanguage,targetLanguage,limit?})</code> prepara un borrador automático. También admite traducir <code>{text,provider,sourceLanguage,targetLanguage,context?}</code> sin crear un proyecto. Con la partida cerrada, <code>build({projectId,title?,allowPartial?})</code> reconstruye y registra una copia independiente del juego. <code>remove({projectId})</code> elimina el proyecto privado.</p><p>Se admiten los formatos de texto reconocidos de GBA/NDS. Android utiliza ML Kit y descarga los modelos al solicitarlos. Escritorio permite analizar, editar y reconstruir; puedes incorporar traducciones de un servicio externo mediante update, pero no incluye traducción automática local.</p><p>Esta API no incluye OCR. Comprueba el espacio disponible, las fuentes y la maquetación en el juego reconstruido.</p>
            <h2>Aplicar un shader a la imagen</h2><p>Declara <code>graphics.shaders</code> y consulta <code>host.graphics.capabilities({session})</code>. <code>shader({session,id,source,uniforms?})</code> aplica el efecto y devuelve <code>{id,revision}</code>; <code>removeShader({session,id})</code> devuelve <code>{removed}</code> al retirarlo.</p><p>La fuente SkSL/AGSL utiliza <code>uniform shader content</code>, <code>uniform float2 resolution</code> y <code>half4 main(float2 p)</code>. Los uniforms adicionales deben ser floats finitos. Se admite un efecto y propietario por sesión, hasta 16 KiB de fuente y 16 uniforms adicionales, sin bucles for, while o do.</p><p>El shader solo filtra los píxeles del juego. En Android requiere API 33 y una salida CPU; en escritorio utiliza Skia. Las superficies nativas separadas no ofrecen ese postprocesamiento. Las capturas conservan la imagen original del motor. Cerrar la sesión o revocar el módulo retira el efecto.</p>
            <h2>Cambiar resolución y texturas</h2><h3>Resolución interna</h3><p>Con <code>graphics.options</code>, llama a <code>host.graphics.options({session,resolutionScale})</code>; devuelve <code>{resolutionScale}</code>. GameCube admite 1×, 2× y 4× en Android y escritorio. Se vuelven a dibujar las primitivas, conservando la memoria y los estados que utiliza el juego.</p><p>La superficie máxima es 2560×2112, con hasta dos copias visuales escaladas de 720×576. Otros tamaños mantienen su salida nativa. La imagen de mayor resolución solo se muestra si coincide con el framebuffer que presenta el juego y la CPU no lo ha modificado.</p><p>Activar escala o reemplazos en GameCube desactiva Vulkan y utiliza el rasterizador software. Al retirarlos puede recuperar la selección anterior. Prueba el rendimiento y la imagen en cada juego.</p>
            <h3>Identificar texturas</h3><p><code>graphics.textures</code> permite reemplazos PNG en GameCube, PS1 y PSP. Se conservan la VRAM y las lecturas originales del juego. <code>textureIds({session,offset?,limit?})</code> devuelve <code>{items:[{textureId,width,height}],total,offset}</code>. La observación empieza al consultar y conserva hasta 512 identidades SHA-256 basadas en formato, dimensiones, datos y paleta.</p><ul><li><strong>PS1:</strong> identifica atlas de 256×256 con profundidad y CLUT. El reemplazo utiliza un pase visual RGB555 a resolución nativa, conservando máscaras y semitransparencia. El display de 24 bits y las primitivas que solapan su página o paleta utilizan la ruta original. Las escrituras del juego invalidan el reemplazo visual, incluso si repiten el valor; las copias de framebuffer no lo transportan.</li><li><strong>PSP:</strong> utiliza un pase software separado, con el nivel base del reemplazo. Mientras está activo deshabilita las rutas GPU, SIMD y paralelas.</li></ul><p>PS1 y PSP anuncian resolución 1×: un reemplazo de textura no aumenta la resolución de la geometría.</p>
            <h3>Cargar un reemplazo</h3><ol><li>Prepara un PNG con dimensiones que sean múltiplos enteros uniformes de la textura observada.</li><li>Inicia la carga con <code>beginTexture({session,textureId,width,height,size,sha256})</code>.</li><li>Envía bloques consecutivos con <code>writeTexture({id,offset,dataBase64})</code>.</li><li>Termina con <code>commitTexture({id})</code>; el host verifica hash y dimensiones.</li></ol><p><code>textures({session})</code> lista tus reemplazos y <code>removeTexture({session,textureId})</code> los retira. Límites: 2048×2048, 16 MiB por PNG, bloques de 64 KiB, 64 reemplazos y 128 MiB de píxeles en el banco del motor. Las cargas caducan a los diez minutos. Otro módulo no puede sustituir un recurso activo y no se genera una pirámide mip HD. Revocar el módulo o cerrar la sesión retira los recursos.</p>
            <h2>Capturar el micrófono</h2><p>Declara <code>media.microphone</code>. Consulta <code>host.microphone.capabilities()</code>, inicia con <code>start({sampleRate?,blockMs?,maxSeconds?})</code>, recoge bloques con <code>read({id,maxBlocks?})</code> y termina con <code>stop({id})</code>. Android solicita RECORD_AUDIO; escritorio utiliza los permisos de audio del sistema.</p><p>El audio es PCM16LE mono, a 16/24/48 kHz, con bloques de 20/40/100 ms en Base64 y número de secuencia. Se admite una captura activa y hasta cinco minutos. Lee a tiempo: <code>droppedBlocks</code> indica los bloques perdidos.</p><p>Pasar al fondo, revocar el permiso o cerrar cancela la captura y las lecturas pendientes. El reconocimiento de voz debe implementarlo tu módulo.</p>
            <h2>Filtrar el audio del juego</h2><p>Declara <code>audio.dsp</code> y consulta <code>host.audioDsp.capabilities({session})</code>. <code>list({session})</code> devuelve tus cadenas de filtros. <code>set({session,id,expectedRevision,sampleRate,stages})</code> crea o actualiza una cadena comprobando expectedRevision.</p><p>Las etapas admitidas son <code>{kind:'gain',gain}</code>, <code>{kind:'biquad',b0,b1,b2,a1,a2}</code> y <code>{kind:'fir',coefficients}</code>. La respuesta indica si se aplicó el cambio, su revisión y la cadena resultante. <code>remove({session,id,expectedRevision})</code> la retira. El host comprueba valores finitos, estabilidad, coste y saturación PCM16.</p><p>Se admiten cuatro cadenas por propietario, dieciséis globales y filtros FIR de hasta 64 coeficientes. Se aplican por propietario e ID. El historial del filtro se reinicia al pausar, cambiar de generación o modificar la configuración; una frecuencia distinta de la declarada omite la cadena.</p><p>Solo se filtra el PCM del motor antes de reproducirlo. Los sonidos por órdenes, películas, WebAudio y beep quedan fuera. Grabaciones y observadores reciben el PCM original.</p>
            <h2>Rebobinar y editar repeticiones</h2><p>Declara <code>emulation.timeline</code> para utilizar <code>host.timeline</code>. Consulta <code>capabilities({session})</code>: el motor debe ofrecer un estado completo, avance exacto por fotograma y ausencia de efectos externos. La integración inicial es CHIP-8. Un único propietario controla el historial y las repeticiones de la sesión.</p>
            <h3>Configurar el historial y avanzar</h3><p><code>configure({session,historyFrames?,historyBytes?,runaheadFrames?,rewinding?})</code> configura el historial y <code>status({session})</code> consulta su posición, pausa y actividad. <code>rewind({session,frames})</code> retrocede y pausa; <code>rewinding:true</code> mantiene el rebobinado. Runahead admite 0–2 fotogramas especulativos: presenta vídeo adelantado, mantiene el audio confirmado y restaura el estado confirmado.</p>
            <p><code>step({session,frames?,inputs?,commit?})</code> necesita la partida pausada y admite hasta 120 fotogramas. Cada entrada contiene <code>keys</code> y, opcionalmente, touch. Sin entradas se usa una neutra; una entrada única se repite. <code>commit:false</code> restaura el estado al terminar, sin publicar imagen o audio especulativos. Si esa restauración falla, la sesión queda no disponible.</p>
            <h3>Grabar y reproducir entradas</h3><p><code>startRecording({session})</code> inicia una grabación, <code>stopRecording({session})</code> la termina y <code>recording({session,id?,offset?,limit?})</code> permite leerla por páginas. Incluye las entradas efectivas físicas y de módulos y, cuando está disponible, el hash del estado.</p><p><code>replay({session,id,fromFrame?,toFrame?})</code> reproduce las entradas y pausa al terminar. <code>seek({session,id?,frame})</code> reconstruye una posición sin mostrar resultados intermedios. Se registra por fotogramas, sin tiempos inferiores a uno. Reiniciar, cargar un estado externo, cerrar o revocar termina el controlador. <code>release({session})</code> libera sus datos.</p>
            <h3>Exportar y editar una repetición</h3><p><code>export({session,id?})</code> devuelve <code>{id,format:'nelkano-replay/1',size,sha256}</code>. Lee los bloques Base64 con <code>read({id,offset,length})</code>. Para importar, utiliza <code>beginImport({session,size,sha256})</code>, <code>write({id,offset,dataBase64})</code> y <code>commit({session,id})</code>; <code>abort({id})</code> cancela.</p><p>El JSON editable contiene <code>formatVersion:1</code>, <code>coreFormat</code>, <code>romSha256</code>, <code>firstFrame</code>, un estado inicial opaco y las entradas por fotograma. En un editor TAS puedes modificar entradas y retirar los <code>stateSha256</code> posteriores que hayan dejado de ser válidos. El host verifica ROM, formato, hash y estado inicial antes de restaurar.</p><p>Límites: 3600 estados y 64 MiB de historial; dos grabaciones privadas de hasta 36 000 fotogramas y 8 MiB cada una. Una repetición exportada admite 16 MiB y bloques de 64 KiB. Hay dos operaciones abiertas por módulo y ocho globales, con caducidad tras diez minutos sin actividad. La duración del historial depende del tamaño de los estados y del rendimiento.</p>
            <h2>Mezclar audio externo con la partida</h2><p>Declara <code>audio.mix</code> para utilizar <code>host.audioMix</code>. Consulta <code>capabilities({session})</code> para conocer el formato PCM16LE, la frecuencia, los canales y el reloj <code>{frame,epoch,paused}</code>. El frame es la referencia publicada por el host, no necesariamente el VBlank físico del motor. El audio se mezcla antes de los filtros DSP y la reproducción.</p>
            <ol><li>Prepara el clip con <code>begin({session,size,sha256,sampleRate,channels})</code>, <code>write({id,offset,dataBase64})</code> y <code>commit({id})</code>. Su PCM16LE mono o estéreo debe tener la misma frecuencia y canales que el motor; no hay remuestreo automático.</li><li>Programa la reproducción con <code>play({session,id,atFrame?,gain?,originalGain?})</code>. Devuelve playbackId y la frontera elegida. Puedes mezclarlo con el original o silenciar este durante el clip.</li><li>Consulta <code>status({session})</code> o detén las reproducciones con <code>stop({session,playbackId?})</code>.</li><li><code>remove({id})</code> descarta una carga o clip y sus reproducciones.</li></ol>
            <p>Se admiten 16 MiB por clip, 32 MiB por propietario, 64 MiB globales, ocho reproducciones programadas y bloques de 64 KiB. Los recursos pertenecen a la sesión y caducan tras diez minutos sin actividad.</p><p>Pausar, restaurar, cambiar de generación o formato, pasar al fondo o revocar cancela las reproducciones. Capturas, grabaciones y observadores conservan el PCM original. No permite separar voces, música o efectos que el motor no entregue como pistas distintas; sonidos por órdenes, películas, WebAudio y beep quedan fuera.</p>
            <h2>Capturar una imagen de cámara</h2><p>Declara <code>media.camera</code> y utiliza <code>host.camera.capabilities()</code>, <code>list()</code>, <code>start</code>, <code>read</code> y <code>stop</code>. Android solicita CAMERA; escritorio anuncia captura no disponible y Studio utiliza una imagen sintética.</p>
            <ol><li>Solicita una cámara anunciada con <code>start({cameraId,width?,height?,fps?,format?})</code>. El valor predeterminado es JPEG a 640×480 y 5 fps; se admiten JPEG/PNG hasta 1280×720 y 15 fps. Comprueba el tamaño real devuelto.</li><li><code>read({id})</code> fija una instantánea y devuelve un frame o null.</li><li>Lee los bytes con <code>read({id,frameId,offset,length})</code> en bloques de hasta 64 KiB, conservando el mismo frameId durante toda la lectura.</li></ol><p>Se admite una captura activa, dos instantáneas por captura y hasta 4 MiB por imagen.</p>
            <h3>Entregar la imagen al juego</h3><p>Consulta <code>capabilities({session})</code> para conocer los puertos. <code>deliver({id,session,port})</code> necesita además <code>emulation.input</code> y envía la última imagen al puerto compatible.</p><p>La integración inicial es la cámara emulada de 3DS: <code>cam1</code> y <code>cam2</code> convierten a RGB565/YUYV con el tamaño solicitado por el juego. La imagen externa no se guarda dentro de sus estados. NDS normal no anuncia cámara; la óptica, calibración estéreo y sincronización física de 3DS son parciales.</p><p><code>stop({id})</code>, pasar al fondo o revocar el módulo cierra la captura y retira entregas y solicitudes pendientes.</p>
            <h2>Elegir un motor externo</h2><p>Consulta <code>host.engines.capabilities()</code>. <code>list({gameId})</code> o <code>list({systemId})</code> lista los proveedores, identidad, versión, selección y compatibilidad de guardados.</p><p><code>select({gameId,engineId})</code> elige el motor de un juego; <code>select({systemId,engineId})</code>, el de un sistema. Indica solo uno de los dos. engineId null recupera el predeterminado. La elección se aplica al volver a abrir: una partida en marcha conserva su motor.</p>
            <h3>Controles, opciones y recursos</h3><ul><li><code>controls({session})</code> describe los puertos y controles. <code>input({session,port,control,value})</code> envía valores dentro de sus rangos, incluidos ejes y gatillos.</li><li><code>options({session})</code> devuelve el esquema y los valores. <code>configure</code> aplica opciones o guarda las de la próxima apertura por engineId, respetando tipos, rangos y requisitos de reinicio.</li><li><code>resources({engineId,gameId?})</code> describe los archivos o BIOS necesarios. <code>importResource</code> abre el selector del host sin revelar rutas privadas.</li><li><code>importGame({engineId,systemId})</code> abre el selector y vincula el juego importado al motor. Requiere <code>library.transfer</code> y <code>resources.documents</code>. Indicar systemId resuelve extensiones ambiguas, como ISO.</li><li><code>media({session})</code> y <code>changeMedia({session,slot,contentId?})</code> consultan y cambian los discos o medios anunciados.</li></ul><p>Cada operación exige sus permisos de lectura, control, entrada o recursos.</p>
            <h3>Guardar el progreso de un motor propio</h3><p>Los estados manuales admiten hasta 128 MiB y viajan en bloques de 64 KiB. El puerto timeline tiene un límite independiente de 16 MiB. Los estados y el progreso persistente utilizan identificadores de compatibilidad distintos y un espacio de almacenamiento asociado al motor.</p><p>Coincidir en el juego no permite cargar el estado de otro motor. Adapta la VFS del core para utilizar los recursos autorizados y el almacenamiento privado del host: escribir solo en su carpeta temporal no conserva el progreso.</p>
            <h2>Implementar las capacidades de tu motor</h2><p>La ABI C versionada comprueba que el descriptor corresponda al binario compilado. Memoria, reglas, observación, texturas, resolución, cámara, medios y timeline deben declararse e implementarse con sus callbacks. Si faltan, esas capacidades permanecen no disponibles.</p><p>El puente opcional utiliza métodos JSON acotados y bloques para estados e imágenes. Poder ejecutar una ROM o guardar estados no implica admitir escritura de memoria o rebobinado determinista. El ejemplo de GPU no anuncia esos puertos.</p><p>El motor entrega PCM al transporte de audio y puede utilizar superficies GPU separadas. Las capturas compuestas requieren su implementación en el adaptador. Consulta las capacidades concretas: una salida GPU no habilita automáticamente shaders, capturas u otras operaciones gráficas.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/emulacion
