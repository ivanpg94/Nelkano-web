    uuid: de520020-2026-4000-8000-000000000012
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000005
    weight: 55
    translations:
      es:
        title: 'Home, ficha y Favoritos'
        status: true
        body:
          value: |-
            <p>En la aplicación incluida, Favoritos pertenece a Nelkano básicos: es una colección predeterminada, con estrella en la ficha y sección propia en Home. No hay que instalar Colecciones por separado. Sus datos se migran al actualizar.</p><p>Colecciones crea la colección Favoritos al activarse. La sección de Home y la estrella de la ficha son aportaciones de ese módulo; no aparecen al desactivarlo.</p><h2>Sección de juegos en Home</h2><pre><code>{
              moduleId: 'example.home', id: 'my-games',
              slot: 'HOME_SECTION', label: 'Mis juegos', actionId: 'open',
              payload: { section: {
                kind: 'game-carousel', gameIds: ['id-del-juego'],
                emptyLabel: 'Todavía no hay juegos'
              }}
            }</code></pre><p>Los IDs tienen que ser juegos de la biblioteca. La app dibuja las tarjetas y abre su ficha. Una sección vacía muestra emptyLabel.</p><h2>Un icono en la ficha</h2><p>Usa GAME_HEADER_ACTION. Colecciones lo usa para la estrella, con checked indicando si el juego es favorito.</p><h2>Continuar una partida</h2><p>Nelkano básicos consulta saves.list y añade GAME_LAUNCH_ACTION con payload.primaryLaunch: true. Esa acción se muestra al lado de Jugar. El módulo decide qué guardado abrir y llama a library.launch(gameId, slot).</p><p>Jugar inicia una partida nueva. Las filas de guardados permiten elegir una partida concreta, aunque hayas desactivado los autoguardados.</p><h2>Elegir una carátula</h2><p>GAME_ARTWORK_ACTION coloca el botón sobre la esquina inferior de la imagen. Nelkano básicos añade ese botón y un selector con vista previa, miniaturas y la marca de la opción elegida. La función pertenece al módulo: al desactivarlo, su botón desaparece.</p><pre><code>// Requiere library.cover. Los IDs vienen de library.list y saves.list.
            await host.library.setCover(gameId, slot);
            // Volver a la portada original:
            await host.library.setCover(gameId, null);</code></pre><p>La operación rechaza juegos inexistentes, slots fuera de 0–6 y guardados sin captura. saves.list indica hasThumbnail; library.list indica coverSlot. La carátula se conserva al cerrar y volver a abrir la app.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/home-ficha-favoritos
  -
    uuid: de520020-2026-4000-8000-000000000013
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 130
    translations:
      es:
        title: 'Editor de controles'
        status: true
        body:
          value: '<p>El editor cambia posición, tamaño, visibilidad e iconos de los controles. Guarda por sistema y por orientación; Guardar aplica los cambios y Cancelar conserva el diseño anterior.</p><h2>Operaciones que utiliza</h2><p>environment.snapshot obtiene tamaño y densidad de pantalla. presentation.applyControlLayouts publica el diseño guardado; releaseControlLayouts lo retira. El módulo guarda las preferencias en su almacenamiento privado.</p><p>Una posición usa x e y entre 0 y 1, scale entre 0.5 y 2 y visible. Los perfiles distinguen PORTRAIT y LANDSCAPE. La pantalla y los botones usan la misma geometría en el editor y en el juego.</p><h2>Ganchos para otros módulos</h2><ul><li>icons: aporta una imagen para un control; el usuario puede elegirla.</li><li>system-buttons: aporta un botón y la acción que ejecuta el módulo consumidor.</li></ul><p>Ambos están en la versión 1.0.0 y usan PNG del paquete. system-buttons admite target para reutilizar un control existente; sin target crea un botón nuevo.</p><p>Al pulsarlo, el editor llama al consumidor con invokeContributor y pasa el contexto de la partida. El consumidor ejecuta la operación del SDK que necesite. El editor solo coloca el botón: no implementa una captura o un streaming.</p><h2>Los botones actuales</h2><p>Nelkano básicos aporta pausa, guardar, cargar, estirar, pantalla completa y el selector NDS/3DS. Usan IDs estables como sys-pause y sys-save para conservar lo que el usuario movió en el editor. Un botón pendiente no aparece en la emulación por estar definido en un perfil.</p><p>La cabecera y el menú usan el estilo de la app. No aparecen textos rutinarios de pausa o carga sobre el juego. Los errores siguen mostrándose.</p><h2>Los nuevos perfiles</h2><p>Usa las claves <code>PSP</code>, <code>GAMECUBE</code> y <code>SWITCH</code>. GameCube muestra un stick principal y un C-stick separados; PSP, un stick principal. <code>LEFT_STICK</code> y <code>RIGHT_STICK</code> identifican los controles <code>JOYSTICK</code>. Actualmente envían direcciones independientes: no se transmite intensidad proporcional de inclinación. Los botones, iconos, posiciones y escalas usan los mismos mecanismos de edición y guardado.</p><p>El paquete de tipos exporta <code>BuiltinControlProfile</code> y <code>StickControlInput</code>. Son ayudas para programar; los contratos conservan claves de texto para que un módulo pueda definir sus propios perfiles. Las plantillas del editor y de Básicos incluyen estos perfiles.</p><h2>Teclado de RPG Maker en Android</h2><p>El perfil RPG Maker incluye el botón Teclado, con icono de teclado e identificador estable <code>sys-keyboard</code>. Puedes moverlo, cambiar su tamaño y ocultarlo por orientación. Durante la partida muestra y oculta el teclado de Android; permite escribir, borrar con Backspace y confirmar con Enter. Es una función del reproductor Android: no añade un permiso ni una operación de emulación al SDK y no activa un teclado virtual en Desktop o Studio.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/editor-de-controles
