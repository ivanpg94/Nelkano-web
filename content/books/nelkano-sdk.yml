  -
    uuid: de520020-2026-4000-8000-000000000005
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 50
    translations:
      es:
        title: 'Añadir botones y ajustes'
        status: true
        body:
          value: |-
            <p>Devuelve un botón o ajuste desde <code>contributions(context)</code>, indicando dónde aparece y qué acción llama. Nelkano lo dibuja con el estilo de la app.</p>
            <pre><code>const contribution = {
              moduleId: 'example.tools', id: 'open',
              slot: 'SETTINGS_SECTION', section: 'Biblioteca',
              label: 'Mis herramientas', actionId: 'open',
              icon: 'standard:settings'
            };</code></pre>
            <h2>Elegir dónde aparece</h2>
            <ul><li><code>HOME_SECTION</code>: sección en Home.</li><li><code>LIBRARY_ACTION</code>: botón en los filtros de Biblioteca, alineado con los controles nativos y con la altura del tema.</li><li><code>LIBRARY_SELECTION_ACTION</code>: acción para los juegos seleccionados.</li><li><code>GAME_HEADER_ACTION</code>: icono en la cabecera de la ficha.</li><li><code>GAME_ARTWORK_ACTION</code>: botón en la esquina inferior de la carátula.</li><li><code>GAME_LAUNCH_ACTION</code>: acción dentro de la ficha.</li><li><code>SAVE_ACTION</code>: acción sobre un guardado.</li><li><code>SETTINGS_SECTION</code>: fila en Ajustes → General.</li><li><code>SYSTEM_ACTION</code> y <code>SYSTEM_SETTINGS_SECTION</code>: acciones y ajustes de un sistema.</li><li><code>EMULATION_SETTINGS_SECTION</code>: ajuste durante una partida.</li><li><code>PLAYER_ACTION</code> y <code>PLAYER_MENU</code>: acciones durante la partida y en su menú.</li><li><code>PLAYER_SYSTEM_BUTTON</code>: botón sobre el área de emulación.</li></ul>
            <p><code>section</code> agrupa filas dentro de General; no crea una pestaña. Para un interruptor, usa <code>kind:'toggle'</code> y <code>checked</code>. La acción recibe el nuevo valor en <code>payload.checked</code>.</p>
            <h2>Abrir un formulario</h2>
            <p>Desde <code>dispatch</code>, devuelve un panel con <code>title</code>, <code>fields</code>, <code>rows</code> y <code>actions</code>. Puedes añadir campos de texto, selección y JSON. Devuelve <code>{kind:'close-panel'}</code> para cerrarlo. <a href="book://de520020-2026-4000-8000-000000000008/es">El ejemplo mínimo</a> contiene un panel completo.</p>
            <p><code>enabled</code> desactiva una acción. <code>visibility</code> filtra por sistema, capacidades o disponibilidad de juego, sesión y conexión. Para limitarla a un juego, comprueba <code>context.gameId</code> en <code>contributions(context)</code>: <code>visibility</code> no filtra por ese ID. Vuelve a comprobar la disponibilidad al ejecutar.</p>
            <h2>Integrar una acción con los controles de la app</h2>
            <ul><li><code>PLAYER_SYSTEM_BUTTON</code>: <code>payload.controlId</code> reutiliza un control existente.</li><li><code>GAME_LAUNCH_ACTION</code>: <code>payload.primaryLaunch:true</code> sitúa la acción junto a Jugar.</li><li><code>PLAYER_MENU</code>: <code>payload.menuAction</code> con <code>save</code>, <code>load</code> o <code>reset</code> utiliza las tarjetas del menú de guardados.</li></ul>
            <p>Estos valores eligen ubicación y estilo. <code>actionId</code> sigue llamando a tu módulo: debes implementar la operación.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-10-checkbox-selector.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-10-checkbox-selector.webp" width="600" height="420" alt="Formulario con texto, casilla y selector (ejemplo)." data-caption="Formulario con texto, casilla y selector (ejemplo)."></a>
            <h2>Mostrar una carátula o captura</h2>
            <ul><li>En una fila, <code>thumbnail:{gameId,slot}</code> muestra la captura junto al texto.</li><li><code>slot:null</code> usa la carátula actual; añade <code>original:true</code> para la portada original.</li><li>En el panel, <code>preview:{gameId,slot}</code> muestra una imagen grande arriba.</li></ul>
            <p>Usa los IDs devueltos por la app, sin pasar rutas ni PNG. Una captura requiere <code>saves.read</code>; una carátula, <code>library.read</code>. Si falta la imagen, se muestra la portada de reserva.</p>
            <h2>Añadir acciones junto al buscador</h2>
            <p><code>LIBRARY_HEADER_ACTION</code> añade acciones al buscador de Biblioteca y Guardados. Comprueba <code>surface:library</code> o <code>surface:saves</code> para decidir dónde contribuir.</p>
            <p><code>LIBRARY_ACTION</code> permanece en los filtros de Biblioteca. <code>SAVE_ACTION</code> conserva las acciones de Guardados sin <code>saveId</code>. El host reúne buscador, importar y filtros en una fila horizontal; en vertical utiliza dos.</p>
            <p>La búsqueda de Guardados es local por título y se combina con sistema, orden y filtros del módulo. Restablecer limpia también la búsqueda.</p>
            <h2>Abrir una página completa</h2>
            <p>Devuelve <code>kind:page</code>, <code>title</code>, <code>fields</code>, <code>rows</code> y <code>actions</code>. La página mantiene la navegación; <code>kind:panel</code> abre un diálogo.</p>
            <p>Los campos admiten también <code>password</code>, <code>email</code> y <code>checkbox</code>. En una casilla, <code>initial</code> es booleano. En un <code>select</code> puede ser texto, número finito, booleano o <code>null</code>.</p>
            <p>Conserva el tipo de cada opción: <code>initial:0</code> selecciona el número cero; <code>initial:"0"</code>, un texto. Aplicar sin editar y <code>onChangeAction</code> envían ese mismo tipo. Un botón con <code>submitFields:false</code> puede navegar aunque queden campos sin completar.</p>
            <h2>Responder mientras se edita</h2>
            <p><code>onChangeAction</code> envía las ediciones tras 350 ms sin cambios, incluso al volver al valor anterior. Actualizar <code>initial</code> desde el módulo no genera una edición. En un selector se envía el valor con su tipo.</p>
            <p><code>onChangeMinLength</code> fija la longitud mínima; usa <code>0</code> si necesitas recibir una búsqueda vacía.</p>
            <h2>Colocar acciones y filas</h2>
            <ul><li><code>placement:header</code> sin icono mantiene una acción encima del formulario.</li><li>En un panel, hasta dos acciones de cabecera pueden usar <code>icon:profile</code> o <code>icon:refresh</code>. Aparecen junto al título fijo, usan <code>label</code> como nombre accesible y tienen un área táctil de 48 dp.</li><li>Una fila con avatar y <code>presentation:compact</code> reduce el avatar y ajusta el texto de los botones.</li><li>En acciones de fila, <code>placement:overflow</code> añade la acción al menú ⋮ y conserva payload, confirmación, condiciones y permisos. No se admite en acciones superiores; las acciones de fila no admiten <code>icon</code>.</li><li><code>position:header</code> sitúa una fila antes de los campos.</li></ul>
            <h2>Mostrar avatares</h2>
            <p>Una fila admite <code>avatar</code> con <code>label</code>, <code>color</code>, imagen PNG en Base64 o <code>url</code>. La imagen local tiene prioridad.</p>
            <p>Android carga de forma asíncrona las URL del origen de cuenta permitido y requiere <code>network.account</code>. Studio no descarga imágenes remotas.</p>
            <h2>Crear una página de ajustes</h2>
            <p>Usa <code>kind:"page",layout:"settings"</code> para tener cabecera y botón de volver. En un selector, <code>presentation:"tabs"</code> muestra pestañas; <code>initial</code> selecciona la activa y <code>onChangeAction</code> recibe su valor sin añadir comillas.</p>
            <p>En <code>rows</code>, elige una presentación:</p>
            <ul><li><code>section</code>: encabezado.</li><li><code>actions</code>: botones agrupados en una fila, del mismo tamaño y respetando <code>primary</code>.</li><li><code>setting</code>: título, <code>subtitle</code> y <code>value</code>, con <code>badge</code> o <code>icon</code> opcional.</li><li><code>list</code>: fila sencilla que se puede pulsar.</li></ul>
            <p>La primera acción se ejecuta al pulsar una fila de ajuste o lista. Su icono puede ser un recurso declarado en <code>files</code> o un icono <code>standard</code>. <code>placement:"footer"</code> sitúa una acción al pie del formulario.</p>
            <h2>Mantener visibles el título y los botones de un panel</h2>
            <p>Todos los <code>kind:"panel"</code>, con o sin <code>layout:"form"</code>, comparten el mismo diálogo en Android, Desktop y Studio: título y × fijos, cuerpo desplazable y acciones <code>placement:"footer"</code> al pie. Las demás acciones, incluidas las de filas, permanecen en el cuerpo.</p>
            <p>Las páginas conservan su navegación; <code>layout:"settings"</code> se utiliza sólo con <code>kind:"page"</code>.</p>
            <h2>Controlar el cierre y conservar lo escrito</h2>
            <p><code>dismissAction:"close"</code> utiliza una acción existente con <code>submitFields:false</code> para la × y para cerrar el diálogo, respetando su confirmación.</p>
            <p>Sin <code>dismissAction</code>, el host sólo recoge una acción inequívoca de cerrar/cancelar que no envíe campos ni pida confirmación. Si hay varias candidatas, conserva los botones y la × cierra desde el host. No se permite cerrar mientras se procesa una acción.</p>
            <p>Asigna un <code>id</code> estable al formulario: el borrador se conserva al actualizar el mismo módulo, formulario y sesión. Cambiar de formulario o sesión lo reinicia. En paneles antiguos sin ID se distinguen título y esquema de campos.</p>
            <p>Los avisos nativos y los formularios de cuenta, colecciones, mandos, streaming, parches y módulos utilizan esta presentación. Los lienzos del editor y las superficies de vídeo o mando mantienen su función.</p>
            <h2>Mostrar campos según una elección</h2>
            <p>Usa <code>visibleWhen:{field:"role",values:["host"]}</code>, o combina condiciones con <code>{all:[...]}</code> y <code>{any:[...]}</code>. El campo referido debe ser un selector o una casilla del mismo formulario. Los valores deben existir entre sus opciones; las casillas usan booleanos.</p>
            <p>Las condiciones se evalúan localmente al seleccionar, sin ejecutar JavaScript ni consultar el servidor. Admiten cuatro niveles, 32 nodos por condición y 32 valores por hoja.</p>
            <p>Un campo oculto conserva el borrador, pero no se valida como requerido ni se envía en el payload.</p>
            <h2>Habilitar una acción según el formulario</h2>
            <p><code>enabledWhen</code> utiliza las mismas condiciones y se combina con <code>enabled</code>. <code>description</code> añade una ayuda de hasta 256 caracteres bajo el botón.</p>
            <p>Son condiciones de presentación: valida de nuevo los parámetros y permisos al ejecutar. Para elecciones cortas, como Crear partida/Unirse o 2/3/4, puedes usar <code>kind:"select",presentation:"tabs"</code>. El borrador resiste las actualizaciones de estado y se reinicia al cambiar la sesión.</p>
            <h2>Crear componentes y ampliar pantallas</h2>
            <p><code>presentation.extend</code> permite <code>ui.page</code>, <code>mount</code>, <code>patch</code>, <code>remove</code>, <code>open</code>, <code>close</code> y <code>targets</code>. Puedes crear secciones, filas, botones, formularios, pestañas, modales, imágenes PNG y lienzos con figuras. <code>dispatch</code> recibe acciones y valores.</p>
            <ul><li>Monta contenido en <code>home/library/game/saves/settings/emulation.before</code> y <code>.after</code>.</li><li>Usa <code>.content</code> para ocultar y sustituir el cuerpo.</li><li>Los componentes publicados ofrecen puntos antes/después y cambios de texto, visibilidad, disponibilidad y <code>actionId</code>. También puedes ampliar componentes de otros módulos.</li></ul>
            <p>Los conflictos entre autores se rechazan. Desactivar retira los cambios. Límites: 32 registros por módulo, 256 globales, 96 KiB de contenido, 512 nodos y profundidad 16.</p>
            <p>La app y Studio comparten el renderizador. Los componentes se programan en JavaScript o TypeScript; no ejecutan HTML arbitrario. Revisa el resultado en el visor.</p>
            <h2>Fijar las acciones al pie de un modal</h2>
            <p>En <code>presentation.extend</code>, <code>kind:"modal"</code> usa el mismo marco. <code>label</code> es el título y <code>actionId</code> recibe el cierre. Sólo sus hijos directos pueden usar <code>placement:"footer"</code>; el resto se desplaza con el contenido.</p>
            <pre><code>const dialog = {id:"dialog",kind:"modal",label:"Editar nombre",actionId:"cancel",children:[
              {id:"name",kind:"field",label:"Nombre",value:"Ada"},
              {id:"actions",kind:"row",placement:"footer",children:[
                {id:"save",kind:"button",label:"Guardar",actionId:"save"}
              ]}
            ]};</code></pre>
            <p>El host rechaza <code>placement</code> fuera de un hijo directo de modal o con otro valor. Las acciones siguen sujetas a la propiedad del módulo, el registro, la revisión y sus permisos.</p>
            <h2>Usar imágenes generadas o descargadas</h2>
            <ol><li>Genera o descarga el PNG y guárdalo mediante <code>files</code>.</li><li>Añade el nodo <code>{id:"imagen",kind:"image",resource:"file:imagen.png"}</code>.</li><li>Declara <code>storage.files</code> y <code>presentation.extend</code>.</li></ol>
            <p>El host valida formato y dimensiones. La imagen queda ligada al módulo/autor y a la revisión del registro de interfaz; otro módulo no puede leerla. Funciona en la app y Studio. También puedes componer nodos y dibujar figuras sin generar una imagen.</p>
            <h2>Recorrer un catálogo por páginas</h2>
            <p><code>ui.targets({offset,limit})</code>, <code>entities.types({offset,limit})</code> y <code>services.list(name,{offset,limit})</code> devuelven 32 entradas por defecto, con un máximo de 128 y 112 KiB.</p>
            <p>Aumenta <code>offset</code> por el número de entradas recibidas hasta obtener una página vacía. Una página puede terminar antes de <code>limit</code> por su tamaño.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ganchos-android
  -
    uuid: de520020-2026-4000-8000-000000000006
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 60
    translations:
      es:
        title: 'Conectar dos módulos'
        status: true
        body:
          value: |-
            <p>Un módulo puede publicar funciones que otros utilicen. Por ejemplo, el editor de controles admite botones e iconos aportados por otro módulo.</p>
            <h2>Declarar una integración</h2>
            <ol><li>El proveedor declara sus ganchos en <code>provides</code>.</li><li>El consumidor declara proveedor, gancho y versión en <code>consumes</code>.</li><li>Ambos declaran el permiso <code>modules.hooks</code>.</li></ol>
            <p>Marca <code>optional:true</code> si el consumidor debe funcionar aunque falte el proveedor.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/module-hooks.svg"><img src="/modules/custom/nelkano_home/assets/docs/sdk/module-hooks.svg" width="1120" height="640" alt="Conexión entre dos módulos a través del host." data-caption="Conexión entre dos módulos a través del host."></a>
            <h2>Añadir un botón al editor de controles</h2>
            <pre><code>await host.hooks.contribute(
              'nelkano.control-editor', 'system-buttons', 'my-button',
              { actionId: 'my-action', label: 'Mi botón', icon: 'assets/button.png' }
            );</code></pre>
            <p>Añade <code>assets/button.png</code> a <code>files</code>. Cuando el usuario pulse el botón, tu módulo recibe <code>onHook</code> con <code>operation:'my-action'</code>. El editor entrega el contexto de partida en <code>request.value.context</code>; úsalo en las operaciones de emulación.</p>
            <p>La app incluye el proveedor <code>nelkano.control-editor</code>. La plantilla Editor de controles de Studio utiliza <code>example.control-editor</code>: para probar con ella, usa ese ID tanto en <code>consumes.provider</code> como en <code>hooks.contribute</code> y carga también la carpeta del proveedor en Studio.</p>
            <p>Con <code>target:'sys-pause'</code> puedes reutilizar un control existente y conservar su posición. Sin <code>target</code>, se añade un control independiente.</p>
            <h2>Consultar y llamar a un gancho</h2>
            <ul><li><code>hooks.status</code>: comprobar disponibilidad.</li><li><code>hooks.list</code>: obtener aportaciones.</li><li><code>hooks.invoke</code>: llamar al proveedor.</li><li><code>invokeContributor</code>: responder al consumidor desde el proveedor.</li></ul>
            <p>Entradas y salidas deben cumplir el esquema del gancho. Al desactivar o retirar un módulo desaparecen sus botones e iconos. El editor conserva las elecciones para cuando se reactive.</p>
            <h2>Publicar un servicio</h2>
            <p>Declara <code>modules.services</code> y registra <code>name</code>, <code>version</code> y <code>methods</code>. Cada método define <code>input/output</code> con los mismos tipos de esquema que los ganchos.</p>
            <pre><code>await host.services.register({
              name: "example.counter", version: "1.0.0",
              methods: { add: { input: {type: "integer"}, output: {type: "integer"} } }
            });
            // Otro módulo, con modules.services:
            const next = await host.services.call("example.counter", "add", 4);
            // El proveedor implementa onService(request) y devuelve el resultado.</code></pre>
            <p>Implementa <code>onService</code>: recibe <code>service</code>, <code>method</code>, <code>value</code>, <code>caller</code> y <code>provider</code>, con la identidad real del módulo y autor. La base usa <code>author:builtin</code>. El servicio se ejecuta dentro del entorno aislado del proveedor.</p>
            <ul><li><code>list(name)</code> encuentra proveedores.</li><li><code>unregister(name)</code> retira únicamente los tuyos.</li><li><code>call</code> admite proveedor, autor y versión mínima compatible dentro de la misma versión mayor.</li></ul>
            <p>Un mismo nombre y versión mayor deben mantener métodos y esquemas. El servicio no comparte código ni datos privados. Se rechazan ciclos y llamadas a un entorno ocupado. Límites: 256 proveedores, 32 métodos, profundidad de esquema 8 y datos de hasta 96 KiB.</p>
            <h2>Elegir el proveedor de una llamada</h2>
            <p>Indica <code>options.provider</code> en <code>services.call</code> para elegir uno concreto. Sin proveedor explícito ni preferencia guardada, se utiliza la implementación integrada; si no existe, se puede elegir al único proveedor disponible. Si hay varios y ninguno integrado, debes elegir.</p>
            <p>Cada llamada verifica permisos y compatibilidad del contrato.</p>
            <h2>Ofrecer otro comportamiento de emulación</h2>
            <p>La base publica <code>nelkano.emulation</code> versión <code>1.0.0</code>, método <code>execute</code>, entrada <code>{operation,args}</code> y salida <code>{value:resultado}</code>. Consulta <code>list("nelkano.emulation")</code> para copiar el contrato exacto.</p>
            <p>Abarca snapshot, pausa/reset, presentación, guardar/cargar, <code>library.launch</code> y <code>library.setCover</code>. Las API anteriores delegan en él conservando sus permisos. Otro proveedor puede cambiar el comportamiento y delegar a la base con <code>provider:"nelkano.base",author:"builtin"</code>.</p>
            <p>Consumidor y proveedor necesitan el permiso original de cada operación. Este servicio afecta a las operaciones solicitadas por módulos; no sustituye las llamadas internas de la app ni los motores nativos.</p>
            <h2>Enviar eventos entre módulos</h2>
            <p>Con <code>modules.events</code>:</p>
            <ol><li>Publica un tema con <code>define(topic,schema)</code>. Su nombre debe empezar por el ID de tu módulo y un punto.</li><li>Otro módulo se suscribe con <code>subscribe(topic)</code>, incluso antes de que exista el publicador.</li><li>El publicador envía con <code>emit(topic,value)</code>. Sólo él puede emitir.</li><li>El suscriptor recibe <code>onEvent</code> con <code>{type:"module-event",topic,value,sender:{moduleId,author}}</code>. <code>unsubscribe(topic)</code> cancela la suscripción.</li></ol>
            <p>Son eventos locales; no se envían a servidores. Límites: 256 temas, 64 suscripciones y 64 eventos pendientes por módulo. Si se llena una cola, se rechaza todo el envío sin entregas parciales.</p>
            <p>Se entregan hasta ocho eventos por ronda, aproximadamente cada 50 ms en primer plano, sin garantía de persistencia ni de tiempo exacto. Desactivar limpia servicios, temas, suscripciones y colas. Los ganchos siguen disponibles y Studio reproduce estos contratos.</p>
            <h2>Transformar una llamada antes o después de ejecutarla</h2>
            <p>Registra <code>services.intercept({id,name,method,phase,order})</code> con fase <code>before</code> o <code>after</code>. <code>onService</code> recibe <code>phase</code> y <code>hookId</code>; devuelve un valor compatible con el esquema del método. Retira la transformación con <code>removeInterceptor(id)</code>.</p>
            <p>Admite 32 por módulo y 128 globales. Las llamadas propias no vuelven a entrar en su interceptor. Un error posterior a la operación no deshace sus efectos.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ganchos-modulos
  -
    uuid: de520020-2026-4000-8000-000000000007
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 70
    translations:
      es:
        title: 'Cambiar la apariencia'
        status: true
        body:
          value: |-
            <p>Un módulo de apariencia puede ofrecer colores, fondo, fuente, iconos, tamaños y opciones de distribución. Parte de la plantilla Apariencia de Studio para probarlos en el visor.</p>
            <h2>Definir un estilo</h2>
            <ol><li>Declara el permiso <code>presentation.appearance</code>.</li><li>Añade el estilo en <code>skins</code>, con <code>id</code> y <code>label</code>.</li><li>Configura las propiedades que quieras cambiar.</li><li>Guarda y selecciona el estilo en Tema, dentro de Ajustes.</li></ol>
            <p>Las propiedades disponibles son <code>colors</code>, <code>background</code>, <code>font</code>, <code>icons</code>, <code>cornerRadius</code>, <code>spacing</code>, <code>controlHeight</code>, <code>headerHeight</code>, <code>navigation</code> y <code>libraryView</code>.</p>
            <ul><li><code>background</code> e <code>icons</code>: recursos del paquete.</li><li><code>font</code>: archivo TTF declarado en <code>files</code>.</li><li><code>navigation</code>: <code>top</code> o <code>bottom</code>.</li><li><code>libraryView</code>: <code>grid</code> o <code>list</code>.</li></ul>
            <p>En un formulario, <code>select</code> muestra un desplegable. <code>presentation:tabs</code> lo presenta como pestañas, conservando el valor JSON seleccionado.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-07-language-dark.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-07-language-dark.webp" width="600" height="370" alt="Apariencia con el tema Oscuro (ejemplo)." data-caption="Apariencia con el tema Oscuro (ejemplo)."></a>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-08-language-light.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-08-language-light.webp" width="600" height="370" alt="Tema Claro e interfaz en inglés (ejemplo)." data-caption="Tema Claro e interfaz en inglés (ejemplo)."></a>
            <h2>Comprobar el resultado</h2>
            <p>Selecciona el estilo en el visor y revísalo también en Android antes de distribuirlo.</p>
            <p>Un estilo modifica los componentes que Nelkano ya muestra. Para añadir páginas o formularios, utiliza la API de interfaz: el estilo no ejecuta HTML ni instala vistas Android.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/apariencia
  -
    uuid: de520020-2026-4000-8000-000000000008
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000003
    weight: 80
    translations:
      es:
        title: 'Tu primer botón'
        status: true
        body:
          value: |-
            <p>Vas a añadir la opción Hola a Ajustes. Al pulsarla se abrirá un panel llamado Hola desde mi módulo. Este ejemplo no necesita permisos porque no consulta ni modifica datos de la app.</p>
            <h2>Preparar el proyecto</h2>
            <ol><li>Crea un módulo con la plantilla Básico.</li><li>Abre <code>src/index.js</code>, o créalo si la plantilla utiliza TypeScript.</li><li>Copia el código del siguiente apartado.</li></ol>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-01-studio-editor-visor.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-01-studio-editor-visor.webp" width="1440" height="1000" alt="El proyecto Hola en Studio: código y visor." data-caption="El proyecto Hola en Studio: código y visor."></a>
            <h2>Añadir la opción y abrir el panel</h2>
            <pre><code>export function createModule(host) {
              return {
                async activate() {},
                async deactivate() {},
                async contributions(context) {
                  if (context.surface !== 'settings') return [];
                  return [{
                    moduleId: 'example.hello', id: 'hello',
                    slot: 'SETTINGS_SECTION', section: 'Mis módulos',
                    label: 'Hola', actionId: 'open', icon: 'standard:settings'
                  }];
                },
                async dispatch(action) {
                  if (action === 'close') return { kind: 'close-panel' };
                  return {
                    kind: 'panel', layout: 'form', id: 'hello',
                    title: 'Hola desde mi módulo', dismissAction: 'close',
                    fields: [], rows: [],
                    actions: [{ actionId: 'close', label: 'Cerrar', submitFields: false }]
                  };
                }
              };
            }</code></pre>
            <p><code>contributions</code> ofrece la opción sólo en Ajustes. <code>dispatch</code> abre el panel al pulsarla y lo cierra con la acción <code>close</code>. El panel no tiene campos ni filas: primero comprobarás que la integración funciona.</p>
            <h2>Indicar el archivo de entrada</h2>
            <p>Guarda el código en <code>src/index.js</code> y comprueba estos valores de <code>manifest.json</code>:</p>
            <ul><li><code>"id":"example.hello"</code></li><li><code>"entry":"src/index.js"</code></li><li><code>"files":["src/index.js"]</code></li></ul>
            <p>Si la plantilla usaba <code>src/index.ts</code>, sustituye esa ruta en <code>entry</code> y <code>files</code>. El código anterior se copia sin cambios en el archivo JavaScript.</p>
            <h2>Probarlo en el visor</h2>
            <ol><li>Guarda el proyecto para actualizar Studio.</li><li>Abre Ajustes en el visor y pulsa Hola.</li><li>Comprueba que aparece el panel y que puedes cerrarlo.</li></ol>
            <p>Para dar una función al botón, continúa con <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación: operaciones y eventos</a>, donde puedes añadir pausa o guardado.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-03-hola-panel.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-03-hola-panel.webp" width="446" height="712" alt="El botón Hola abre el panel del módulo en Studio." data-caption="El botón Hola abre el panel del módulo en Studio."></a>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ejemplo-minimo
  -
    uuid: de520020-2026-4000-8000-000000000009
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000006
    weight: 90
    translations:
      es:
        title: 'Qué hacen los módulos incluidos'
        status: true
        body:
          value: |-
            <p>Nelkano incluye cinco módulos esenciales: Básicos, Editor de controles, Apariencia, Amigos y Multijugador. Sus funciones también sirven de ejemplo para crear las tuyas con el SDK.</p>
            <h2>Encontrar los módulos</h2><p>Abre Ajustes → General → Módulos → Instalados. Los esenciales están agrupados en Módulos esenciales: permanecen activos, no se pueden desinstalar y se actualizan con la app. Si uno falla al arrancar, puedes reintentar su activación.</p>
            <p>Los módulos que crees serán opcionales. El usuario podrá importar su archivo .nelkmod, desactivarlo conservando los datos o desinstalarlo. Declarar un valor en el manifiesto no permite convertirlo en esencial.</p>
            <h2>Nelkano básicos</h2><p>Reúne las colecciones y Favoritos, la gestión de juegos, Continuar, los autoguardados, las carátulas y los botones de emulación. También ofrece la configuración de mandos, segunda pantalla y streaming.</p>
            <ul><li><strong>Colecciones:</strong> se crean y filtran desde Biblioteca. La estrella de la ficha añade un juego a Favoritos, que también aparece en Home. Borrar una colección conserva sus juegos.</li><li><strong>Ordenación:</strong> ABC, más antiguos o más recientes. En Biblioteca se usa la fecha de incorporación; en Guardados, la de la partida. Cambiar el orden conserva el filtro de colección.</li><li><strong>Autoguardados:</strong> Ajustes → General → Biblioteca.</li><li><strong>Segunda pantalla:</strong> Ajustes → General → Apariencia.</li><li><strong>Streaming:</strong> ajustes de la partida.</li></ul>
            <p>Las colecciones, los favoritos y el filtro se conservan al actualizar. Colecciones ya está integrado en Básicos: el ejemplo independiente del SDK es material para autores y no necesita instalarse en la app.</p>
            <h2>Editor de controles</h2><p>Permite mover, redimensionar y ocultar controles. Se abre desde Ajustes → General → Controles → Editor de controles o desde el menú de la partida. Otros módulos pueden añadirle botones e iconos mediante sus ganchos.</p>
            <h2>Apariencia</h2><p>Ofrece el idioma y los temas de la app. Un módulo puede aportar temas mediante sus contratos.</p>
            <h2>Amigos</h2><p>Gestiona la cuenta, las solicitudes de amistad y el perfil. Sus ganchos permiten añadir acciones y consultar los datos compartidos. Studio utiliza cuentas ficticias para probarlo.</p>
            <p>Parches está temporalmente excluido de los módulos cargados en Android y escritorio. Sus fuentes y el servicio del SDK se conservan para revisión; no aparece Aplicar parche en la ficha.</p>
            <h2>Multijugador</h2><p>Ofrece la interfaz de conexión entre jugadores. Cada modo necesita un motor y un adaptador compatibles; la interfaz por sí sola no añade multijugador a cualquier juego.</p>

            <h2>Usarlos como referencia en Studio</h2><p>Abre la plantilla del módulo que quieras estudiar; la de Nelkano básicos incluye las colecciones. Studio permite activar y desactivar los proyectos para comprobar cómo añaden y retiran sus funciones. Las plantillas adicionales, incluida Parches, no establecen paridad con los paquetes incluidos en la app.</p>
            <h2>Seguir el estilo de la app</h2><p>Utiliza los formularios del SDK: mantienen el título y el cierre arriba, las acciones al pie y el contenido desplazable. Este patrón se usa en Amigos, Apariencia y los formularios auxiliares del Editor.</p><p>Módulos tiene pestañas Instalados y Explorar; ocupa una pantalla en Android y una ventana en escritorio. La ficha del juego conserva Jugar y Continuar al pie. Reutiliza estas superficies para que tu función encaje en la navegación de Nelkano.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/ejemplos-distribuidos
