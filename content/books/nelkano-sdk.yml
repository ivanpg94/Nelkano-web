      es:
        title: 'Prototipo de asistente por voz'
        status: false
        body:
          value: '<p>Nelkan IA es un prototipo de asistente por voz que no está disponible en la aplicación actual. Importar su antiguo archivo <code>.nelkmod</code> no instala el servicio, los motores ni los modelos que necesita.</p><h2>Referencia del prototipo</h2><p>Utilizaba <code>host.services.call</code> con el servicio <code>nelkano.voice-assistant</code> versión <code>1.0.0</code> y los permisos <code>modules.services</code> y <code>assistant.voice</code>. El servicio no está disponible en Android, escritorio ni Studio; no lo utilices como dependencia de un módulo nuevo.</p><p>El prototipo combinaba Whisper, Silero y un modelo GGUF local, con escucha en primer plano y síntesis de Android. Su distribución independiente sigue pendiente. Para crear una función de voz propia, consulta el permiso y las capacidades del micrófono y aporta el reconocedor o servicio que necesites.</p>'
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/asistente-voz-experimental
