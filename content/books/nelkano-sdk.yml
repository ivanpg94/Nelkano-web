    translations:
      es:
        title: 'SDK de Nelkano'
        status: true
        body:
          value: |-
            <p>Con el SDK puedes añadir botones, formularios y funciones a Nelkano, o crear un tema propio. Escribes el módulo en JavaScript o TypeScript, lo pruebas en Studio y lo instalas en la app como un archivo <code>.nelkmod</code>.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-01-studio-editor-visor.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-01-studio-editor-visor.webp" width="1440" height="1000" alt="El proyecto Hola en Studio: código y visor." data-caption="El proyecto Hola en Studio: código y visor."></a>
            <h2>Crea tu primer módulo</h2>
            <ol><li><a href="book://de520020-2026-4000-8000-000000000011/es">Instala y abre SDK Studio</a>. Descarga el instalador para Windows x64; Node.js y Java vienen incluidos. No necesitas el código del emulador ni Android Studio.</li><li>Crea un proyecto con la plantilla Básico y sigue <a href="book://de520020-2026-4000-8000-000000000008/es">Tu primer botón</a>. Añadirás una opción a Ajustes que abre un panel.</li><li><a href="book://de520020-2026-4000-8000-000000000003/es">Exporta el módulo firmado e instálalo</a> en Android o escritorio. Conserva la clave de firma: la necesitarás para actualizarlo.</li></ol>
            <p>Android, Desktop y SDK Studio comparten la versión <code>3.0.3-beta</code>. El contrato que declaras en <code>sdkVersion</code> sigue siendo <code>0.2.0</code>; la versión de tu módulo la eliges tú.</p>
            <h2>Elige qué quieres añadir</h2>
            <ul><li>Pausar, guardar o continuar una partida: <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación: operaciones y eventos</a>.</li><li>Configurar un mando o una segunda pantalla: <a href="book://de520020-2026-4000-8000-000000000016/es">Mandos y segunda pantalla</a>.</li><li>Ofrecer colores o un idioma: <a href="book://de520020-2026-4000-8000-000000000017/es">Idioma y temas</a>.</li><li>Programar la aplicación de un parche: <a href="book://de520020-2026-4000-8000-000000000018/es">Parches de juegos</a>.</li><li>Emitir una partida: <a href="book://de520020-2026-4000-8000-000000000019/es">Streaming</a>.</li></ul>
            <p>También puedes guardar datos propios, crear formularios y conectar servicios. Cada capítulo indica los permisos necesarios y cómo comprobar si el dispositivo o el motor admite la función.</p>
            <h2>Prueba en Studio y después en la app</h2>
            <p>El visor de Studio usa juegos, cuentas, guardados y hardware simulados. Sirve para probar el código y la interfaz; las conexiones externas autorizadas sí pueden usar Internet.</p>
            <p>Prueba después el paquete en cada plataforma que declares en el manifiesto. En Nelkano, abre Ajustes → General → Módulos: Instalados permite importar un archivo y Explorar abre el catálogo. La app verifica el paquete y muestra sus permisos antes de instalarlo.</p>
            <p>Android, Desktop y Studio mantienen el mismo número de versión, con un instalador y un canal de actualización propios para cada destino. Los módulos se versionan y actualizan por separado.</p>
            <h2>Añadir un motor de emulación</h2>
            <p>Un paquete V2 puede incluir un motor nativo compilado por ti para Android o escritorio. Necesitarás preparar sus binarios, describir sus capacidades y probar cada destino. Sigue <a href="book://de520020-2026-4000-8000-000000000003/es">Paquete V2 con un motor compilado</a> y consulta <a href="book://de520020-2026-4000-8000-000000000014/es">las operaciones del motor</a>. Studio simula su integración; no ejecuta una prueba real del motor.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano
  -
    uuid: de520020-2026-4000-8000-000000000002
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 20
    translations:
      es:
        title: 'Cómo funciona un módulo'
        status: true
        body:
          value: |-
            <p>El archivo principal del módulo exporta <code>createModule(host)</code>. <code>host</code> reúne las funciones del SDK: consultar juegos, guardar datos o actuar sobre una partida, entre otras.</p>
            <h2>Mostrar un botón y responder al pulsarlo</h2>
            <ol><li><code>activate()</code> prepara el módulo al activarlo.</li><li><code>contributions(context)</code> devuelve los botones, secciones o ajustes que deben aparecer en la pantalla actual.</li><li><code>dispatch(action, payload, context)</code> atiende la acción del usuario. Puede abrir un formulario o cerrar el panel.</li><li><code>deactivate()</code> libera los recursos al desactivarlo.</li></ol>
            <p>Por ejemplo, un módulo de notas añade un botón a la ficha del juego. La acción lee su nota y devuelve un formulario. Al guardar, escribe el dato y devuelve <code>{kind:'close-panel'}</code>.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/module-lifecycle.svg"><img src="/modules/custom/nelkano_home/assets/docs/sdk/module-lifecycle.svg" width="1120" height="640" alt="Del botón a la acción del módulo." data-caption="Del botón a la acción del módulo."></a>
            <h2>Saber desde dónde se llama al módulo</h2>
            <p><code>context.surface</code> identifica la pantalla. El contexto puede incluir también <code>gameId</code>, <code>systemId</code>, <code>session</code> y <code>selection</code>. En Biblioteca, <code>selection</code> contiene los juegos seleccionados; en Ajustes puede no haber ningún juego abierto.</p>
            <p>Para actuar sobre una partida, usa la sesión recibida en esa acción. Su <code>id</code> y <code>generation</code> identifican esa apertura del juego. Si la partida cambia, la app rechaza la referencia anterior.</p>
            <h2>Actualizar los datos cuando cambian</h2>
            <p>Implementa <code>onEvent(event)</code> para recibir avisos:</p>
            <ul><li><code>data-changed</code>: han cambiado datos.</li><li><code>hooks-changed</code>: ha cambiado una integración entre módulos.</li><li><code>library-imported</code> y <code>context-changed</code>: avisos adicionales de Android.</li></ul>
            <p>Los eventos de partida y guardados se describen en <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación</a>. Lee los datos cuando los necesites y responde a sus avisos, sin volver a consultarlos continuamente.</p>
            <p>Prueba los cambios de sesión en la app. Studio reconstruye el módulo al recargar y no reproduce todos los detalles de su cierre en Android.</p>
            <h2>Mantener la interfaz al día</h2>
            <p><code>contributions(context)</code> debe describir la interfaz usando el contexto y tus datos. Guarda los cambios en las acciones o los eventos: Nelkano puede reutilizar las contribuciones ya calculadas entre repintados.</p>
            <ul><li>Una acción actualiza las contribuciones de su módulo.</li><li>Los cambios de biblioteca, guardados, cuenta, idioma o ganchos actualizan también los módulos afectados.</li><li><code>close-panel</code> cierra el formulario después de actualizar contribuciones y filtros.</li><li>Desactivar o desinstalar retira los elementos del módulo.</li></ul>
            <p>Mantén breves <code>activate()</code> y <code>contributions(context)</code>: pueden ejecutarse durante el arranque. Inicia el trabajo costoso desde una acción del usuario o una tarea.</p>
            <h2>Atender llamadas de otros módulos</h2>
            <ul><li><code>onHook(request)</code> responde a un gancho: una integración que otro módulo ha declarado.</li><li><code>onService(request)</code> ejecuta un método de un servicio registrado por tu módulo.</li><li><code>onProfile(request)</code> valida y normaliza documentos del perfil. Durante esa validación no se puede llamar al SDK.</li></ul>
            <h2>Ejecutar una tarea en segundo plano</h2>
            <p><code>onBackground(event)</code> recibe <code>task-due</code> y, mientras trabaja, <code>connection-changed</code>. Debe funcionar tanto en una instancia nueva, sin pasar por <code>activate()</code>, como en una instancia ya activa.</p>
            <p>Studio simula las tareas y entrega sus avisos a <code>onEvent</code>. No utiliza el planificador nativo de Android o escritorio.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/funcionamiento
  -
    uuid: de520020-2026-4000-8000-000000000003
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 30
    translations:
      es:
        title: 'Crear y llevar tu módulo al teléfono'
        status: true
        body:
          value: |-
            <p>Crea un proyecto, prueba una acción en Studio y exporta el paquete firmado. Después instala ese mismo archivo en la app para probarlo en Android o escritorio.</p>
            <h2>Instalar el SDK</h2>
            <ol><li>En <a href="/modulos">Módulos</a>, pulsa Descargar SDK y ejecuta el instalador <code>.exe</code> para Windows x64.</li><li>Completa la instalación y abre <strong>Nelkano SDK Studio</strong> desde Inicio o el acceso del escritorio.</li></ol>
            <p>Incluye Node.js, Java, los tipos y los ejemplos. No necesitas instalar npm, un JDK ni Android Studio para crear módulos JavaScript o TypeScript.</p>
            <h2>Crear un proyecto</h2>
            <ol><li>Entra en Ajustes → Nuevo módulo.</li><li>Elige una carpeta para tus proyectos, nombre, identificador y plantilla.</li></ol>
            <p>Guarda tus proyectos fuera de la carpeta de instalación. Si prefieres la terminal, abre PowerShell en la carpeta de instalación de Studio y utiliza <code>.\nelkmod.cmd</code>:</p>
            <pre><code>.\nelkmod.cmd init C:/mis-modulos/mi-modulo
            .\nelkmod.cmd dev C:/mis-modulos/mi-modulo</code></pre>
            <p>El proyecto contiene <code>manifest.json</code>, el código en <code>src</code> y sus recursos. El manifiesto declara nombre, ID, versión, permisos y archivos incluidos. Añade cada archivo nuevo a <code>files</code>; Studio ofrece hacerlo al crearlo.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-02-nuevo-modulo-basico.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-02-nuevo-modulo-basico.webp" width="1440" height="1000" alt="Crear un proyecto con la plantilla Básico." data-caption="Crear un proyecto con la plantilla Básico."></a>
            <h2>Probar y exportar desde Studio</h2>
            <ol><li>Guarda el código para actualizar el visor y prueba tu acción.</li><li>Pulsa Exportar para generar el <code>.nelkmod</code> firmado.</li><li>Guarda una copia privada de la clave de firma. Las futuras versiones deben conservar la identidad del autor.</li></ol>
            <p>Al abrir Studio desde Inicio, la clave de firma está en <code>%LOCALAPPDATA%\Nelkano\SDK\.nelkdev\author.pem</code>. Si abres una carpeta con la CLI, se guarda en <code>.nelkdev/author.pem</code> dentro de esa carpeta. No incluyas la clave en <code>files</code> ni la publiques en Git.</p>
            <h2>Exportar desde la terminal</h2>
            <p>Crea primero <code>C:/claves</code>. Usa destinos que todavía no existan para generar las claves y el paquete:</p>
            <pre><code>.\nelkmod.cmd check C:/mis-modulos/mi-modulo
            .\nelkmod.cmd keygen C:/claves/author.pem C:/claves/author-public.pem
            .\nelkmod.cmd pack C:/mis-modulos/mi-modulo C:/claves/author.pem C:/mis-modulos/mi-modulo.nelkmod
            .\nelkmod.cmd verify C:/mis-modulos/mi-modulo.nelkmod</code></pre>
            <h2>Instalar el archivo en Nelkano</h2>
            <ol><li>Abre Ajustes → General → Módulos → Instalados.</li><li>Pulsa Importar módulo y elige el archivo <code>.nelkmod</code>.</li><li>Revisa los permisos y pulsa Instalar.</li></ol>
            <p>Para importar una actualización, desactiva primero el módulo. El nuevo archivo debe conservar su ID y la clave del autor.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-06-exportado-nelkmod.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-06-exportado-nelkmod.webp" width="1440" height="1000" alt="Archivo .nelkmod exportado desde Studio." data-caption="Archivo .nelkmod exportado desde Studio."></a>
            <h2>Instalar desde el catálogo</h2>
            <ol><li>Abre Ajustes → General → Módulos → Explorar.</li><li>Busca por nombre o sistema y abre la ficha.</li><li>Pulsa Instalar o Actualizar. La app descarga y verifica el paquete.</li><li>Revisa el autor, la compatibilidad y los permisos. Pulsa Instalar para aceptarlos.</li></ol>
            <p>La verificación comprueba tamaño, SHA-256, firma Ed25519, autor y compatibilidad. La firma identifica al autor y detecta cambios en sus archivos; sigue siendo necesario revisar lo que permite hacer al módulo.</p>
            <p>La ficha agrupa la información adicional en Compatibilidad, Versiones y Detalles técnicos. Este último permite copiar identificadores, dependencias e identidad del autor.</p>
            <p>En Instalados puedes activar y desactivar módulos opcionales. Desinstalar pide confirmación y conserva sus datos, salvo que marques Eliminar también sus datos. Los de Módulos esenciales vienen con Nelkano y se actualizan con la app.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-11-install-review.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-11-install-review.webp" width="600" height="672" alt="Autor, compatibilidad y permisos antes de instalar (ejemplo)." data-caption="Autor, compatibilidad y permisos antes de instalar (ejemplo)."></a>
            <h2>Publicar una nueva versión</h2>
            <ol><li>Exporta un paquete con el mismo ID y la misma clave de autor.</li><li>Aumenta la versión <code>X.Y.Z</code>, por ejemplo de <code>0.1.0</code> a <code>0.1.1</code>.</li><li>En la ficha del catálogo web, pulsa Añadir versión y explica los cambios.</li><li>Para un módulo público, facilita su enlace directo de descarga. Para Sólo Tester, sube el archivo privado desde una cuenta con permiso de administración de módulos.</li></ol>
            <p>El servidor verifica el paquete y conserva las versiones anteriores con sus hashes. Reparar una versión ya registrada exige subir exactamente los mismos bytes.</p>
            <h2>Cómo recibe la app las actualizaciones</h2>
            <p>Nelkano comprueba al arrancar y al volver al primer plano, con seis horas entre comprobaciones automáticas. Puedes comprobar antes desde Módulos → Instalados → Comprobar actualizaciones.</p>
            <p>Se ofrecen versiones superiores de módulos opcionales, con el mismo autor y compatibles con el SDK y la plataforma actuales. Cuando la app está libre, el aviso permite Ver actualizaciones o Más tarde. También aparece Actualizar módulo en Instalados; no se envía una notificación del sistema operativo.</p>
            <ol><li>Pulsa Actualizar módulo para abrir la ficha.</li><li>Si está activo, confirma Desactivar y continuar.</li><li>Espera a la descarga y verificación.</li><li>Revisa todos los permisos, incluidos los nuevos, y pulsa Instalar.</li></ol>
            <p>Cancelar la descarga o la revisión no instala nada. La actualización conserva los datos y recupera la instalación anterior si falla la sustitución. Gestionar módulo abre su entrada en Instalados cuando corresponde. También puedes actualizar mediante Importar módulo, con el módulo desactivado y la misma clave.</p>
            <p>Los esenciales se actualizan con Nelkano. En primer plano, la app revisa el acceso de la cuenta cada minuto: cerrar sesión o perder el rol o permiso retira las actualizaciones privadas.</p>
            <h2>Distribuir un módulo Sólo Tester</h2>
            <p>Una cuenta con permiso de administración de módulos puede crear la ficha con acceso Sólo Tester y subir el <code>.nelkmod</code> firmado. El archivo se aloja en almacenamiento privado de la web; la ficha no utiliza repositorio ni admite imágenes públicas.</p>
            <p>El acceso se elige al crear la ficha. Sus siguientes versiones deben mantener el ID del módulo y la clave del autor. Se admiten paquetes V1 de hasta 32 MiB, comprobando firma, inventario, tamaño y SHA-256.</p>
            <p>Tester y quienes administran módulos ven y descargan tanto los públicos como los reservados. Las demás cuentas y los visitantes sólo ven los públicos. La app utiliza la sesión para autorizar cada descarga privada; cerrar sesión o perder el acceso retira sus fichas, versiones y descargas. La instalación sigue exigiendo verificación y revisión de permisos.</p>
            <p>Los módulos públicos usan un enlace externo de descarga y pueden añadir un repositorio opcional.</p>
            <h2>Elegir JavaScript o TypeScript</h2>
            <p>Ambos sirven. En TypeScript importa los tipos con <code>import type { Host, Extension } from '@nelkano/sdk'</code>. Para archivos locales usa rutas como <code>./model.js</code>.</p>
            <p>V1 contiene JavaScript y recursos; no incluye Node.js ni librerías npm ejecutables. Revisa <code>files</code> antes de exportar y deja fuera las ROMs y las claves privadas. V2 añade motores nativos compilados, descritos más abajo.</p>
            <h2>Elegir catálogo o importación local</h2>
            <p>El catálogo acepta paquetes V1 de hasta 32 MiB y sólo los permisos indicados como admitidos en Permisos y datos. Si tu V1 utiliza otros, como <code>network.external</code>, <code>modules.services</code>, <code>runtime.tasks</code> o <code>emulation.input</code>, distribúyelo para Importar módulo. Los paquetes V2 con motores nativos también requieren importación local.</p>
            <h2>Preparar tareas persistentes</h2>
            <p>Una tarea creada con <code>tasks.schedule({id,delayMs,intervalMs?,payload?,background:true})</code> puede iniciar el módulo y llamar a <code>onBackground(event)</code> sin ejecutar <code>activate()</code>.</p>
            <ul><li>Construye el objeto en <code>createModule(host)</code> sin inicializar la interfaz ni depender de variables preparadas en <code>activate()</code>.</li><li>Lee la tarea vencida del evento y publica progreso y resultado con <code>tasks.update</code>.</li><li>Guarda puntos de recuperación y evita repetir efectos: el sistema puede volver a intentar una ejecución interrumpida.</li></ul>
            <p>Las tareas normales de la app siguen usando <code>onEvent</code> con <code>task-due</code>.</p>
            <h2>Paquete V2 con un motor compilado</h2>
            <ol><li>Prepara <code>native/build.json</code> con repositorio, commit, receta y hashes de las herramientas.</li><li>Compila en tu PC con <code>nelkmod engine build ./mi-modulo --target windows-x86_64</code>.</li><li>Declara el motor y sus artefactos en <code>nativeEngines</code> del manifiesto, con <code>formatVersion:2</code>.</li><li>Para escritorio, usa <code>nelkmod engine archive</code> para reunir <code>nk-engine-worker(.exe)</code>, la DLL/SO y sus dependencias.</li><li>Ejecuta <code>nelkmod pack</code> para generar el único <code>.nelkmod</code> que importará el usuario.</li></ol>
            <p>La ABI, el ejecutor, la plantilla Android y un ejemplo están en <code>native/</code>, dentro de la instalación de Studio.</p>
            <h2>Fijar las herramientas de compilación</h2>
            <p>La receta comprueba el commit y los cambios en archivos seguidos por Git. Cada ejecutable debe ser un alias o una ruta absoluta de la lista verificada: se comprueba su hash antes de ejecutarlo, sin buscarlo en <code>PATH</code>. Fija también los compiladores y las herramientas invocadas por CMake.</p>
            <p>La compilación sólo se ejecuta al pedirla. Abrir o guardar el proyecto no lanza la receta.</p>
            <h2>Describir el motor y sus destinos</h2>
            <p><code>nativeEngines</code> declara motor, release, protocolo/ABI, descriptor y hash de su JSON canónico. El descriptor recoge sistemas y extensiones, controles, opciones, recursos o BIOS, API gráficas y compatibilidad de estados y almacenamiento.</p>
            <p>Cada artefacto indica target, ruta, tamaño y SHA-256: <code>engines/id/android-arm64-v8a.apk</code>, <code>windows-x86_64.zip</code> o <code>linux-x86_64.zip</code>. Incluye sus dependencias.</p>
            <ul><li>Android: declara también <code>packageId</code>, <code>service</code> y <code>certificateSha256</code>.</li><li>Escritorio: declara el <code>entryPoint</code> de la DLL/SO.</li><li><code>minApi</code>, CPU y runtime describen restricciones; no hacen compatible un binario con otra plataforma.</li></ul>
            <h2>Límites del paquete V2</h2>
            <p>El contenedor usa ZIP32 STORE. Manifest y firma van primero; no admite ZIP64, cifrado, enlaces, campos extra ni descriptores de datos. La firma Ed25519 incluye la lista de archivos, tamaños y hashes de todos los destinos.</p>
            <ul><li>Paquete completo: 2 GiB, hasta 16 artefactos y 128 entradas combinadas.</li><li>Artefacto nativo: 1 GiB.</li><li>JavaScript y recursos: 8 MiB por archivo y 32 MiB acumulados.</li><li>Metadatos: 128 KiB por archivo.</li><li>ZIP interior de escritorio: 4096 entradas y 2 GiB expandidos, con rutas y tipos comprobados.</li></ul>
            <p>La verificación lee los artefactos por tramos y sólo extrae a disco el destino actual; no los carga en el mapa de bytes de JavaScript. Los paquetes V1 siguen siendo compatibles.</p>
            <h2>Instalar y recuperar un motor</h2>
            <p>En Android, prepara un APK sin interfaz, firmado con tu certificado, distinto del de Nelkano. La app comprueba paquete, servicio, certificado y contrato antes de conceder recursos y superficie gráfica.</p>
            <p>El motor utiliza un proceso con UID propio. La ruta gráfica emplea un UID normal dedicado, sin permisos de red o almacenamiento. En escritorio, el proceso separado utiliza los permisos del usuario. La firma identifica el código; instalarlo requiere confiar en su autor.</p>
            <ol><li>Cada versión del APK usa una identidad instalable propia para conservar la anterior.</li><li>Nelkano guarda la aprobación del módulo, autor y hash antes de abrir el instalador de Android.</li><li>Al volver, comprueba la instalación y retoma esa aprobación. Si cancelas, conserva la revisión pendiente.</li><li>Activa el JavaScript después de verificar archivos y conexión inicial con el motor.</li></ol>
            <p>Recuperar una instalación anterior no rebaja automáticamente un APK ya instalado. Android sigue gestionando esos APK y su desinstalación. El paquete se puede importar localmente sin publicarlo en el catálogo.</p>
          summary: ''
          format: basic_html
        alias: /sdk-de-nelkano/crear-modulo
  -
    uuid: de520020-2026-4000-8000-000000000004
    type: sdk_page
    langcode: es
    parent: de520020-2026-4000-8000-000000000001
    weight: 40
    translations:
      es:
        title: 'Permisos y datos'
        status: true
        body:
          value: |-
            <p>Declara en <code>capabilities</code> los permisos que necesita tu módulo. Por ejemplo, <code>storage.private.cas</code> para guardar un ajuste y <code>library.read</code> para consultar juegos. La app los muestra al instalar y rechaza las llamadas no autorizadas.</p>
            <h2>Permisos básicos</h2>
            <ul><li><strong>library.read</strong>: Consultar juegos.</li><li><strong>library.delete</strong>: Pedir un borrado con confirmación del usuario.</li><li><strong>library.launch</strong>: Abrir o continuar un juego de la biblioteca; puedes indicar un slot de guardado.</li><li><strong>library.cover</strong>: Usar la captura de un guardado como carátula o restaurar la portada.</li><li><strong>saves.read</strong>: Consultar los guardados.</li><li><strong>saves.write</strong>: Guardar la partida actual en un slot manual.</li><li><strong>saves.load</strong>: Cargar un guardado en la partida actual.</li><li><strong>saves.autosave</strong>: Solicitar autoguardados.</li><li><strong>emulation.read</strong>: Consultar la partida y recibir sus eventos.</li><li><strong>emulation.control</strong>: Pausar, reanudar y reiniciar.</li><li><strong>presentation.player</strong>: Cambiar pantalla completa, estiramiento, pantalla NDS/3DS y slot elegido.</li><li><strong>storage.private.cas</strong>: Guardar preferencias propias.</li><li><strong>modules.hooks</strong>: Usar y ofrecer ganchos entre módulos.</li><li><strong>environment.display</strong>: Leer tamaño y densidad de pantalla.</li><li><strong>presentation.control-layouts</strong>: Publicar posiciones, tamaños e iconos de controles.</li><li><strong>presentation.appearance</strong>: Ofrecer estilos de apariencia.</li></ul>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-11-install-review.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/app-11-install-review.webp" width="600" height="672" alt="Autor, compatibilidad y permisos antes de instalar (ejemplo)." data-caption="Autor, compatibilidad y permisos antes de instalar (ejemplo)."></a>
            <h2>Guardar una preferencia</h2>
            <pre><code>const doc = await host.storage.read('preferences');
            const saved = await host.storage.compareAndSwap(
              'preferences', doc.revision, { enabled: true }
            );
            if (!saved) throw new Error('El ajuste cambió. Vuelve a intentarlo.');</code></pre>
            <p>La revisión evita sobrescribir un cambio más reciente. Los datos pertenecen a tu módulo y autor: desactivar los conserva; al desinstalar, el usuario puede borrarlos.</p>
            <h2>Consultar o borrar juegos</h2>
            <pre><code>const games = await host.library.list();
            if (games.length === 0) throw new Error('La biblioteca está vacía.');
            await host.library.requestDelete([games[0].id]);</code></pre>
            <p><code>requestDelete</code> pide confirmación y permite cancelar. En Android elimina la copia privada del juego y sus guardados, conservando el archivo original importado. Studio sólo elimina datos ficticios.</p>
            <a href="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-07-modulos-permisos.webp"><img src="/modules/custom/nelkano_home/assets/docs/sdk/20261018/studio-07-modulos-permisos.webp" width="1440" height="440" alt="Permisos de Colecciones en la consola de Studio." data-caption="Permisos de Colecciones en la consola de Studio."></a>
            <h2>Acceder a la cuenta</h2>
            <ul><li><code>account.session</code>: identidad, inicio de sesión, registro y cierre de sesión.</li><li><code>network.account</code>: peticiones a los endpoints de cuenta aprobados de <code>nelkano.com</code>.</li><li><code>resources.image</code>: referencia de una foto elegida por el usuario, sin revelar su ruta privada.</li></ul>
            <p>Android utiliza una sesión cifrada y permisos firmados. Studio utiliza cuentas ficticias. Para conectar con otro servidor necesitas <code>network.external</code>.</p>
            <h2>Usar funciones del dispositivo</h2>
            <ul><li><code>input.gamepad</code>: detectar mandos y aplicar o capturar asignaciones.</li><li><code>media.second-screen</code>: buscar y conectar un receptor local.</li><li><code>media.streaming</code>: iniciar y detener WebRTC con confirmación del usuario.</li><li><code>appearance.locale</code>: aplicar un diccionario. Elegir un tema requiere también <code>presentation.appearance</code>.</li><li><code>resources.patch</code>: elegir un parche y crear una copia del juego.</li></ul>
            <h2>Qué ocurre si falla un módulo</h2>
            <p>Actualizar la app o perder el proceso no cambia la elección de activar o desactivar un módulo opcional. En Android y escritorio, la recuperación en primer plano funciona así:</p>
            <ul><li>Esenciales: se vuelven a iniciar ante un fallo que detenga su ejecución, sin límite de intentos y con una espera creciente de hasta 30 segundos.</li><li>Opcionales: hasta tres intentos por ronda ante cierres recuperables. Los errores de código se muestran sin repetirlos indefinidamente.</li><li>Una acción que falla sin dañar el proceso muestra el error y mantiene el módulo.</li></ul>
            <p>Los cinco esenciales permanecen habilitados: Apariencia, Nelkano básicos, Editor de controles, Amigos y Multijugador. Si una versión anterior los dejó apagados o desinstalados, la app los recupera con los datos que existan.</p>
            <h2>Trabajar con memoria, recursos y multijugador</h2>
            <ul><li><strong>emulation.memory.read</strong>: Leer rangos de memoria GBA permitidos.</li><li><strong>emulation.memory.write</strong>: Cambiar RAM con comprobación de los bytes anteriores.</li><li><strong>emulation.resources</strong>: Leer o buscar en la ROM y obtener una imagen reducida de la emulación.</li><li><strong>emulation.handoff</strong>: Crear y restaurar checkpoints, preparar una copia privada de un proyecto y usar su puente RGSS.</li><li><strong>presentation.overlay</strong>: Dibujar imágenes y etiquetas sobre la pantalla del juego.</li><li><strong>network.multiplayer</strong>: Conectar con un amigo aceptado usando la cuenta de Nelkano y su relay.</li><li><strong>runtime.events</strong>: Suscribirse al aviso runtime-tick de la sesión activa.</li></ul>
            <p>Consulta las capacidades antes de ofrecer una acción que dependa del motor. Usa la sesión actual: una referencia antigua se rechaza. El SDK entrega datos y referencias limitadas, sin revelar al JavaScript rutas privadas ni tokens de cuenta.</p>
            <h2>Modificar un juego durante la sesión</h2>
            <p><code>host.gameMod</code> requiere <code>emulation.game-mod</code> y el permiso de cada operación:</p>
            <ul><li><code>emulation.read</code>: consultar capacidades.</li><li><code>emulation.memory.read</code>: leer y listar reglas.</li><li><code>emulation.memory.write</code>: escribir o retirar una regla.</li><li>Lectura y escritura: instalar reglas.</li></ul>
            <p>Los hosts antiguos rechazan el permiso nuevo; no ejecutan el paquete parcialmente. Consulta los límites y la retirada de cambios en <a href="book://de520020-2026-4000-8000-000000000021/es">Modificar un juego</a>. Estos permisos no dan acceso a archivos privados ni envían datos a servidores.</p>
            <h2>Guardar registros y consultarlos</h2>
            <p>Con <code>storage.entities</code>, define los tipos mediante <code>entities.define({name,version,schema,indexes,relations})</code>. Después utiliza <code>get</code>, <code>query</code>, <code>transact</code> y <code>migrate</code>.</p>
            <p>Admite relaciones dentro del módulo, filtros de igualdad, índices, ordenación y páginas. Los lotes usan <code>expectedRevision</code> y se aplican completos; las migraciones son transaccionales.</p>
            <ul><li>64 tipos y 10.000 registros por tipo.</li><li>32 KiB por registro y 16 MiB por identidad.</li><li>128 cambios por lote; respuestas de consultas y lotes de hasta 96 KiB.</li></ul>
            <p>Los datos pertenecen al módulo y autor. Se guardan localmente en SQLite en Android/escritorio y en JSON en Studio; no se suben a Nelkano. Una actualización fallida recupera las entidades anteriores. Las preferencias CAS mantienen su formato.</p>
            <h2>Conectar con otro servidor</h2>
            <ol><li>Declara <code>network.external</code> y los destinos en <code>origins</code>, con origen HTTP o HTTPS, servidor y puerto concretos.</li><li>Usa <code>connections.request/socket/read/send/close</code>. Un origen autoriza también su WebSocket WS o WSS correspondiente.</li><li>Para añadir un destino, solicita <code>requestOrigin</code>. La decisión se conserva para el módulo y autor.</li></ol>
            <p>Android admite HTTPS/WSS; escritorio y Studio también HTTP/WS. Las peticiones no heredan cookies ni claves de la cuenta Nelkano y no siguen redirecciones.</p>
            <p>Hay hasta 12 trabajos simultáneos: 8 HTTP y 4 sockets. Los cuerpos y mensajes admiten 64 KiB. <code>onEvent</code> recibe <code>connection-changed</code> y <code>connection-origin-reviewed</code>; desactivar cancela las conexiones. Studio sí utiliza la red: usa datos de prueba.</p>
            <h2>Programar una tarea</h2>
            <p>Con <code>runtime.tasks</code> puedes consultar <code>host.tasks.capabilities()</code> y utilizar:</p>
            <ul><li><code>schedule({id,delayMs,intervalMs?,payload?,background?})</code>: programar.</li><li><code>read(id)</code>: consultar el estado.</li><li><code>update(id,{state?,progress?,message?,result?})</code>: publicar avances y resultado.</li><li><code>cancel(id)</code>: cancelar.</li></ul>
            <p>Las tareas normales entregan <code>task-due</code> a <code>onEvent</code>. Admiten 32 registros por módulo, intervalos de 100 ms a 24 h y datos de 32 KiB. Comprueba <code>persistent</code> y <code>closedApp</code> antes de ofrecer trabajo con la interfaz cerrada.</p>
            <h2>Continuar una tarea con la interfaz cerrada</h2>
            <p>Declara también <code>runtime.tasks.background</code> y programa con <code>background:true</code>. El planificador nativo conserva el registro y ejecuta <code>onBackground(event)</code>. Puede reutilizar la instancia activa o crear otra sin llamar a <code>activate()</code>.</p>
            <ul><li>Retraso mínimo: un minuto. Intervalo periódico mínimo: quince minutos.</li><li>El sistema decide cuándo ejecutar y puede repetir un intento interrumpido. Diseña la tarea para que repetirla no duplique sus efectos y publica el progreso con <code>update</code>.</li><li>Cerrar la interfaz conserva el registro; desactivar o desinstalar lo cancela.</li></ul>
            <p>Android utiliza JobScheduler. En escritorio se utiliza Task Scheduler del usuario o <code>systemd --user</code>, con la sesión iniciada y acceso exclusivo a los datos. Antes de ejecutar se comprueban paquete, firma, habilitación y permisos.</p>
            <p>En esa ejecución puedes usar tareas, transferencias, secretos, CAS, listados de biblioteca y guardados, y HTTP a destinos autorizados. No abre juegos, ventanas ni sockets, ni solicita permisos. Las transferencias requieren la partida cerrada.</p>
            <h2>Guardar archivos privados</h2>
            <p>Declara <code>storage.files</code>. Puedes listar, leer y eliminar con <code>files.list/read/remove</code>; para escribir:</p>
            <ol><li><code>begin</code> recibe <code>name</code>, <code>expectedRevision</code> y, opcionalmente, <code>mimeType</code>.</li><li><code>write</code> añade tramos consecutivos de hasta 64 KiB.</li><li><code>commit</code> publica el archivo completo. Si otra revisión ha cambiado, devuelve un conflicto. <code>abort</code> descarta la escritura.</li></ol>
            <p>Límites: 16 archivos, 1 MiB por archivo, 4 MiB por módulo/autor y dos escritores abiertos por módulo. Desactivar descarta escrituras sin publicar y conserva los archivos terminados. Una actualización fallida recupera los anteriores.</p>
            <h2>Importar y exportar archivos del usuario</h2>
            <p><code>files.import/export</code> requiere también <code>resources.documents</code>. Abre el selector de Android o escritorio para que el usuario elija origen o destino; el módulo no recibe rutas ni URI.</p>
            <p>Studio guarda archivos locales, pero anuncia <code>importExport:false</code> para el selector nativo. Una página puede usar un PNG privado con <code>resource: file:imagen.png</code>, ligado al registro activo y de hasta 1024×1024.</p>
            <h2>Guardar claves de servicios propios</h2>
            <p>Con <code>storage.secrets</code>, usa <code>secrets.get/put/remove/capabilities</code>. Admite 64 claves, 4 KiB por valor y 64 KiB por módulo/autor.</p>
            <ul><li>Android: clave Keystore separada y almacenamiento excluido de las copias de seguridad.</li><li>Windows: cifrado DPAPI.</li><li>Linux: Secret Service si está disponible; si falla, los cambios permanecen sólo en memoria.</li><li>Studio: sólo memoria; utiliza claves de prueba.</li></ul>
            <p>Consulta <code>persistent</code> después de guardar. La recuperación de actualizaciones utiliza copias cifradas o referencias opacas, sin escribir secretos en texto plano en el registro de recuperación. Este servicio no comparte la sesión de Nelkano.</p>
            <h2>Transferir juegos y partidas</h2>
            <p><code>library.transfer</code> y <code>saves.transfer</code> permiten importar y exportar mediante <code>host.transfers</code>, con referencias privadas del módulo y autor. La app verifica los archivos antes de incorporarlos.</p>
            <p>Reemplazar guardados exige la revisión actual del destino: si cambió, se rechaza. La importación sustituye el conjunto completo de progreso y elimina los archivos de progreso que no estén en la copia recibida. La categoría de juegos no sustituye silenciosamente otro contenido con la misma identidad.</p>
            <p>Para transferir por red necesitas sus permisos y orígenes. Consulta <a href="book://de520020-2026-4000-8000-000000000014/es">Emulación y transferencias</a> para el contrato completo.</p>
            <h2>Traducir, capturar y preparar recursos</h2>
            <ul><li><code>translation.local</code>: analizar, editar y reconstruir traducciones con los proveedores anunciados por el host.</li><li><code>media.capture</code>: capturar la imagen del juego.</li><li><code>media.record</code>: grabar clips.</li><li><code>resources.packs</code>: preparar capas de archivos propias del módulo.</li></ul>
            <h2>Incluir preferencias en el perfil</h2>
            <ol><li>Declara <code>profile.provide</code> y registra los documentos CAS con <code>host.profile.register({version:1,keys})</code>.</li><li>Implementa <code>onProfile({operation:'validate',version,documents})</code>. Devuelve <code>{documents}</code> normalizados con las mismas claves; el host valida un documento por llamada y no permite llamadas al SDK durante ella.</li><li>Al recibir <code>profile-restored</code>, recarga el estado publicado.</li></ol>
            <h2>Exportar y restaurar el perfil</h2>
            <p>Declara <code>profile.backup</code>. Consulta <code>host.profile.capabilities()</code> y <code>list()</code>; después:</p>
            <ul><li>Exportar: <code>export({moduleIds?})</code> devuelve ID, tamaño y SHA-256. Lee con <code>read({id,offset,length})</code>.</li><li>Importar: <code>beginImport({size,sha256})</code>, <code>write({id,offset,dataBase64})</code> y <code>preview({id})</code>. La vista previa devuelve la revisión agregada del destino.</li><li>Confirmar: <code>commit({id,expectedRevision})</code>.</li><li>Descartar o liberar una referencia: <code>abort({id})</code> o <code>release({id})</code>.</li></ul>
            <p>La restauración requiere proveedores activos con la misma identidad y autor. Valida todos los documentos y publica el lote completo con revisiones locales nuevas. El módulo importador no puede restaurarse a sí mismo durante esa llamada.</p>
            <p>Básicos, Editor y Apariencia registran preferencias, colecciones/favoritos y controles. Restaurar no reconecta el streaming. El perfil excluye secretos, archivos arbitrarios, entidades y partidas; para el progreso utiliza <code>host.transfers</code>. Tampoco incluye claves que no se hayan registrado.</p>
            <p>Límites: 32 proveedores, 16 claves por proveedor, 96 KiB por documento y 64 MiB por contenedor. Tramos de 64 KiB, dos referencias abiertas por módulo y ocho globales; caducan tras diez minutos sin actividad.</p>
            <h2>Procesar imagen y audio</h2>
            <ul><li><strong><code>graphics.shaders</code></strong>: Postprocesar en GPU la imagen presentada del juego, separado de controles y texto superpuesto.</li><li><strong><code>graphics.options</code></strong>: Cambiar opciones gráficas que anuncie el core, inicialmente raster GameCube 1×/2×/4×.</li><li><strong><code>graphics.textures</code></strong>: Cargar PNG privados y sustituir texturas observadas por su hash dentro del core compatible.</li><li><strong><code>media.microphone</code></strong>: Capturar PCM del micrófono después del permiso nativo; se detiene al pasar a segundo plano.</li><li><strong><code>audio.dsp</code></strong>: Procesar el PCM del core antes de reproducirlo mediante ganancias, biquads y FIR.</li><li><strong><code>runtime.tasks.background</code></strong>: Junto con <code>runtime.tasks</code>, conservar y ejecutar registros <code>background:true</code> con la interfaz cerrada.</li></ul>
            <p>Consulta <code>capabilities</code> antes de ofrecer la función. Los permisos gráficos no entregan contextos GPU, JNI ni rutas y rechazan sesiones antiguas. Grabar el juego no autoriza el micrófono.</p>
            <h2>Rebobinado, sonido y cámara</h2>
            <ul><li><code>emulation.timeline</code>: historial, rebobinado, runahead, avance y repeticiones editables cuando el core lo admite; inicialmente CHIP-8.</li><li><code>audio.mix</code>: clips PCM16LE privados, sincronizados con la partida antes del DSP y la reproducción.</li><li><code>media.camera</code>: captura Camera2 en Android con permiso nativo. Entregar la imagen a CAM 3DS necesita también <code>emulation.input</code>.</li></ul>
            <p>Cada servicio requiere su permiso. Las tareas con la interfaz cerrada mantienen sus restricciones: estos permisos no les permiten abrir juegos, mostrar interfaz, solicitar permisos ni usar cámara, reproducción o un core.</p>
            <h2>Instalar y ejecutar un motor externo</h2>
            <p><code>native.execute</code> autoriza los artefactos nativos declarados y revisados de un paquete V2; <code>native.gpu</code>, su integración gráfica. El JavaScript no recibe punteros, JNI, contextos GL ni rutas privadas.</p>
            <p>Las operaciones de <code>host.engines</code> requieren además <code>emulation.read</code>, <code>emulation.control</code>, <code>emulation.input</code> o <code>emulation.resources</code>, según la acción. <code>engines.importGame</code> necesita también <code>library.transfer</code> y <code>resources.documents</code>: abre el selector con motor y sistema explícitos.</p>
            <p>El código nativo se ejecuta fuera de QuickJS y requiere confiar en su autor. Desactivar retira su proveedor y recursos, y cierra las sesiones que dependían de él. Declarar una capacidad no demuestra que el motor implemente memoria, cámara o timeline.</p>
            <h2>Comprobar si puedes publicarlo en el catálogo</h2>
            <p>El catálogo web acepta V1 de hasta 32 MiB con los siguientes permisos:</p>
            <ul><li>Juegos y guardados: <code>library.read</code>, <code>library.delete</code>, <code>library.launch</code>, <code>library.cover</code>, <code>saves.read</code>, <code>saves.autosave</code>, <code>saves.write</code>, <code>saves.load</code>.</li><li>Emulación: <code>emulation.game-mod</code>, <code>emulation.memory.read</code>, <code>emulation.memory.write</code>, <code>emulation.resources</code>, <code>emulation.handoff</code>, <code>emulation.read</code>, <code>emulation.control</code>.</li><li>Interfaz: <code>presentation.overlay</code>, <code>presentation.player</code>, <code>presentation.appearance</code>, <code>presentation.control-layouts</code>, <code>environment.display</code>, <code>appearance.locale</code>.</li><li>Datos e integración: <code>runtime.events</code>, <code>storage.private.cas</code>, <code>modules.hooks</code>.</li><li>Cuenta y conexiones: <code>account.session</code>, <code>network.account</code>, <code>network.multiplayer</code>.</li><li>Dispositivo y recursos: <code>resources.image</code>, <code>resources.patch</code>, <code>input.gamepad</code>, <code>media.second-screen</code>, <code>media.streaming</code>.</li></ul>
            <p>Los demás permisos de esta página requieren un paquete compatible instalado mediante Importar módulo. Ser V1 no basta para entrar en el catálogo. V2 se distribuye por importación local.</p>
          summary: ''
          format: basic_html
