langcode: es
es:
  title: 'Guía de uso'
  eyebrow: Documentación
  intro: 'Empieza con tu primer juego y aprende a guardar la partida. Después, configura Nelkano a tu gusto.'
  toc_label: Índice
  empty_label: 'La guía de uso está siendo preparada. Vuelve pronto.'
  zoom_label: 'Ampliar imagen'
  close_label: 'Cerrar imagen'
  sections:
    -
      title: 'Añadir tu primer juego'
      group: 'Empieza a jugar'
      description: 'Necesitas el archivo de un juego, también llamado ROM.'
      steps: |-
        Abre Biblioteca y pulsa +.
        Busca el archivo en tu dispositivo. Puedes elegir la ROM o un archivo ZIP, RAR o 7z que la contenga.
        Selecciónalo para importarlo a la biblioteca.
      notes: |-
        Para un disco CUE, incluye todas sus pistas y conserva sus nombres.
        Para RPG Maker, comprime el proyecto completo: XP funciona en Android y PC; MV/MZ, en Android.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/01-importar-juegos.webp
      image_alt: 'Selector de archivos de Android con el paquete de juegos de demostración.'
      image_caption: 'Selecciona el archivo del juego.'
      image_focus: top
    -
      title: 'Abrir el juego'
      group: 'Empieza a jugar'
      description: ''
      steps: |-
        En Biblioteca, pulsa la carátula del juego que has importado.
        Pulsa Jugar para iniciarlo.
      notes: ''
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/03-ficha-juego.webp
      image_alt: 'Ficha de un juego de demostración con sus estados guardados.'
      image_caption: 'La ficha del juego.'
      image_focus: lower
    -
      title: 'Guardar y retomar la partida'
      group: 'Empieza a jugar'
      description: 'Un estado guarda el punto exacto de la partida para volver a él después.'
      steps: |-
        Durante la partida, abre el engranaje y entra en Guardados rápidos.
        Selecciona un espacio S0–S5 y pulsa Guardar. Para volver a ese punto, elige el mismo espacio y pulsa Cargar.
        La próxima vez, abre la ficha y pulsa Continuar. Para escoger otro estado, pulsa su captura en la ficha o en Guardados.
      notes: |-
        Guardar en un espacio ocupado sustituye su estado anterior.
        Autoguardados utiliza el espacio Auto y lo renueva aproximadamente cada minuto; Continuar le da prioridad.
        Los guardados del propio juego son independientes. Los estados solo están disponibles en los sistemas que los admiten.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/05-guardados-rapidos.webp
      image_alt: 'Ajustes de una partida de demostración con sus espacios de guardado rápido.'
      image_caption: 'Selecciona un espacio antes de guardar o cargar.'
      image_focus: middle
    -
      title: 'Organizar los juegos'
      group: Biblioteca
      description: 'Agrupa tus juegos en colecciones o marca los que más usas como favoritos.'
      steps: |-
        Mantén pulsado un juego y selecciona los que quieras agrupar.
        Pulsa Añadir a colección. Elige una existente o pulsa Crear colección, escribe un nombre y confirma con Crear.
        Abre Colecciones junto al buscador para ver solo los juegos de una colección.
      notes: |-
        La estrella de la ficha añade el juego a Favoritos.
        Las flechas ordenan por fecha de importación; ABC, por nombre.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/02-biblioteca.webp
      image_alt: 'Biblioteca de Nelkano con juegos de demostración y controles de búsqueda.'
      image_caption: 'Busca, ordena o filtra tu biblioteca.'
      image_focus: top
    -
      title: 'Cambiar una carátula'
      group: Biblioteca
      description: 'Puedes usar como carátula una captura de tus estados guardados.'
      steps: |-
        Abre la ficha del juego y pulsa el icono de carpeta de la imagen.
        Elige la captura que quieres usar.
      notes: 'Si todavía no hay capturas, guarda primero un estado durante la partida.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/09-seleccionar-caratula.webp
      image_alt: 'Selector de carátula con capturas de estados de un juego de demostración.'
      image_caption: 'Elige una captura como carátula.'
      image_focus: middle
    -
      title: 'Colocar los controles táctiles'
      group: 'Controles y pantalla'
      description: 'Ajusta los botones sin cambiar los controles de otros sistemas.'
      steps: |-
        Abre Ajustes → General → Controles → Editor de controles, o entra al editor desde los ajustes de una partida.
        Elige el sistema y la orientación de la pantalla.
        Selecciona un botón para moverlo, cambiar su tamaño u ocultarlo. Pulsa Guardar al terminar.
      notes: 'Guarda las posiciones verticales y horizontales por separado. Game Boy y Game Boy Color comparten perfil.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/06-editor-controles.webp
      image_alt: 'Editor de controles de Nelkano con los botones de un perfil.'
      image_caption: 'Selecciona y coloca cada botón en el editor.'
      image_focus: bottom
    -
      title: 'Usar un mando o el teclado'
      group: 'Controles y pantalla'
      description: 'Puedes asignar los botones del mando para cada sistema.'
      steps: |-
        Conecta el mando al dispositivo y abre Ajustes → General → Controles → Mando Bluetooth.
        Elige el sistema, selecciona un control y pulsa el botón del mando que quieres asignarle.
        Durante la partida, activa Pantalla completa para controlar el juego con el mando.
      notes: |-
        En PC: flechas para la dirección, Z/X y A/S para los botones, Enter para Start y Mayús derecha para Select. F11 alterna pantalla completa.
        CHIP-8 utiliza 1234, QWER, ASDF y ZXCV.
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Ajustar la imagen o pausar'
      group: 'Controles y pantalla'
      description: 'Los botones de sistema aparecen alrededor de la imagen del juego.'
      steps: |-
        Pulsa el botón de pausa para detener o reanudar el juego.
        Usa Estirar para llenar la zona de juego; cambia las proporciones de la imagen.
        En DS y 3DS, abre Pantallas para elegir Ambas, Superior o Inferior.
      notes: 'Para reiniciar el juego, abre el engranaje y pulsa Reiniciar.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/04-partida-gba.webp
      image_alt: 'Partida de demostración con los controles táctiles de Nelkano.'
      image_caption: 'La partida con los controles en pantalla.'
      image_focus: top
    -
      title: 'Instalar un módulo'
      group: 'Módulos y actualizaciones'
      description: 'Los módulos añaden funciones a Nelkano.'
      steps: |-
        Abre Ajustes → General → Módulos y entra en Explorar.
        Elige un módulo y pulsa Instalar para descargarlo y verificarlo.
        Revisa el autor y los permisos que solicita. Confirma la instalación si estás de acuerdo.
      notes: |-
        Si tienes un archivo .nelkmod, usa Instalados → Importar módulo.
        Desde Instalados puedes desactivar o desinstalar los módulos opcionales. Eliminar también sus datos borra sus datos guardados.
        Los módulos exclusivos para Tester solo aparecen para cuentas con ese acceso.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/07-modulos.webp
      image_alt: 'Pantalla de módulos de Nelkano con los módulos incluidos.'
      image_caption: 'Gestiona los módulos desde Instalados.'
      image_focus: top
    -
      title: 'Actualizar la app y los módulos'
      group: 'Módulos y actualizaciones'
      description: 'Los módulos incluidos se actualizan con la app; los opcionales tienen sus propias versiones.'
      steps: |-
        Para actualizar la app, cierra la partida y abre Ajustes → General → Actualización de Nelkano.
        Para los módulos, abre Módulos → Instalados → Comprobar actualizaciones.
        Elige la actualización. Si el módulo está activo, pulsa Desactivar y continuar; después revisa los permisos y confirma la instalación.
      notes: 'La actualización del módulo conserva sus datos.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Iniciar sesión y añadir amigos'
      group: 'Cuenta y conexiones'
      description: ''
      steps: |-
        Abre Ajustes → Cuenta → Iniciar sesión. Si acabas de registrarte, activa la cuenta con el enlace del correo.
        En Biblioteca o Guardados, pulsa Amigos junto al buscador.
        Busca al usuario y envíale una solicitud. Desde Amigos también puedes aceptar las que recibas.
      notes: 'Iniciar sesión no sincroniza los juegos ni las partidas entre dispositivos.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Jugar con amigos'
      group: 'Cuenta y conexiones'
      description: 'Ambos debéis iniciar sesión y teneros añadidos en Amigos.'
      steps: |-
        Abre un juego compatible y entra en Multijugador.
        Una persona pulsa Crear partida y selecciona a los amigos. Las demás pulsan Unirse y eligen al anfitrión.
        Para cable link de GBA, usad dos dispositivos con la misma versión exacta del juego. Pulsad Conectar con cable link y entrad en el modo multijugador del propio juego.
      notes: 'La partida de cable link es temporal: al salir se restaura la sesión anterior y se descarta el progreso de la sesión multijugador.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Usar una segunda pantalla'
      group: 'Cuenta y conexiones'
      description: 'Puedes repartir las pantallas de DS o 3DS entre dos dispositivos conectados a la misma red local.'
      steps: |-
        En el dispositivo que recibirá la imagen, abre Ajustes → Segunda pantalla → Cambiar modo y confirma con Sí.
        En el dispositivo donde juegas, abre Segunda pantalla → Buscar pantallas. Elige el receptor y pulsa Conectar.
        Acepta la conexión en el receptor si lo solicita. Usa Intercambiar pantallas para cambiar dónde se ve cada una.
      notes: 'La pantalla inferior admite entrada táctil o ratón desde el receptor.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Ver la partida desde la web'
      group: 'Cuenta y conexiones'
      description: 'Necesitas una cuenta con permiso para emitir.'
      steps: |-
        Durante la partida, abre el engranaje → Streaming → Iniciar emisión.
        En nelkano.com, inicia sesión con la misma cuenta y abre Streaming para verla.
        Al terminar, pulsa Detener emisión en la app.
      notes: 'Se comparte el audio del juego, sin micrófono.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Cambiar el idioma o el tema'
      group: 'Ajustes y archivos'
      description: ''
      steps: |-
        Abre Ajustes → Idioma y tema.
        Elige el idioma de la interfaz y el tema que prefieras.
      notes: 'El idioma de la interfaz no cambia el idioma de los juegos.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/08-apariencia.webp
      image_alt: 'Ajustes de idioma y tema de Nelkano para Android.'
      image_caption: 'Ajustes de idioma y tema.'
      image_focus: middle
    -
      title: 'Aplicar un parche'
      group: 'Ajustes y archivos'
      description: 'Para juegos de GBA y Nintendo DS, con parches IPS o xdelta/VCDIFF.'
      steps: |-
        Abre la ficha del juego y pulsa Aplicar parche.
        Selecciona el archivo del parche y el juego original. El parche debe corresponder a esa versión exacta del juego.
        Busca el resultado en Biblioteca: se añade como otro juego, con guardados propios.
      notes: 'El juego original se conserva.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Conservar tus juegos y partidas'
      group: 'Ajustes y archivos'
      description: ''
      steps: |-
        Conserva los archivos originales de tus juegos fuera de Nelkano.
        Antes de eliminar un juego, asegúrate de que ya no necesitas sus partidas ni sus estados guardados.
      notes: |-
        Eliminar un juego también borra sus partidas y estados.
        Borrar los datos de la app o desinstalarla elimina la biblioteca y los guardados.
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Traducciones de juegos'
      description: 'Para jugar en otro idioma, utiliza una traducción del juego o un parche compatible.'
      bullets: |-
        El cambio de idioma de Nelkano solo afecta a la interfaz.
        La aplicación no traduce automáticamente el texto de los juegos.
      visible: '0'
      image_uri: ''
    -
      title: 'Enviar un reporte de error'
      description: 'Las cuentas autorizadas para enviar reportes pueden usar el módulo oficial Reportes de errores en Android.'
      bullets: |-
        Instala el módulo si está disponible para tu cuenta y revisa sus permisos.
        Abre un juego local que admita estados guardados, crea uno y utiliza Reportar un error en los ajustes de la partida. Completa el formulario y acepta el envío del estado y los datos técnicos antes de pulsar Enviar reporte.
        Si tu cuenta no tiene acceso, utiliza el contacto de la web para contar qué ha ocurrido.
      visible: '0'
      image_uri: ''
en:
  title: 'User guide'
  eyebrow: Documentation
  intro: 'Start with your first game and learn how to save your progress. Then set up Nelkano the way you like.'
  toc_label: Contents
  empty_label: 'The user guide is being prepared. Check back soon.'
  zoom_label: 'Enlarge image'
  close_label: 'Close image'
  sections:
    -
      title: 'Add your first game'
      group: 'Start playing'
      description: 'You need a game file, also called a ROM.'
      steps: |-
        Open Library and press +.
        Find the file on your device. You can choose the ROM or a ZIP, RAR or 7z archive containing it.
        Select it to import it into your library.
      notes: |-
        For CUE discs, include every track and keep the original filenames.
        For RPG Maker, archive the whole project: XP works on Android and PC; MV/MZ, on Android.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/01-importar-juegos.webp
      image_alt: 'Android file picker with the demonstration game archive.'
      image_caption: 'Select the game file.'
      image_focus: top
    -
      title: 'Open the game'
      group: 'Start playing'
      description: ''
      steps: |-
        In Library, select the cover of the game you imported.
        Press Play to start it.
      notes: ''
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/03-ficha-juego.webp
      image_alt: 'Demonstration game details with save states.'
      image_caption: 'Game details.'
      image_focus: lower
    -
      title: 'Save and resume your game'
      group: 'Start playing'
      description: 'A save state captures the exact point in a game so you can return to it later.'
      steps: |-
        During gameplay, open the gear button and choose Quick saves.
        Select a slot, S0–S5, and press Save. To return to that point, select the same slot and press Load.
        Next time, open the game details and press Continue. To choose a different state, select its screenshot in the game details or Save States.
      notes: |-
        Saving into an occupied slot replaces the previous state.
        Autosaves uses the Auto slot and replaces it roughly every minute; Continue gives it priority.
        The game's own saves are separate. Save states are only available on systems that support them.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/05-guardados-rapidos.webp
      image_alt: 'Demonstration game settings with quick-save slots.'
      image_caption: 'Select a slot before saving or loading.'
      image_focus: middle
    -
      title: 'Organize your games'
      group: Library
      description: 'Group games into collections or mark your most-played games as favorites.'
      steps: |-
        Hold a game and select the titles you want to group.
        Press Add to collection. Choose an existing collection, or press Create collection, enter a name and confirm with Create.
        Open Collections beside the search bar to show only games in a collection.
      notes: |-
        The star in the game details adds it to Favorites.
        The arrows sort by import date; ABC sorts by name.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/02-biblioteca.webp
      image_alt: 'Nelkano library with demonstration games and search controls.'
      image_caption: 'Search, sort or filter your library.'
      image_focus: top
    -
      title: 'Change a cover'
      group: Library
      description: "Use one of your save-state screenshots as a game's cover."
      steps: |-
        Open the game details and press the folder icon on the image.
        Choose the screenshot you want to use.
      notes: 'If there are no screenshots yet, save a state during gameplay first.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/09-seleccionar-caratula.webp
      image_alt: 'Cover selector with demonstration game save-state screenshots.'
      image_caption: 'Choose a screenshot for the cover.'
      image_focus: middle
    -
      title: 'Arrange the touch controls'
      group: 'Controls and display'
      description: "Adjust the buttons without changing other systems' controls."
      steps: |-
        Open Settings → General → Controls → Control editor, or open the editor from a game's settings.
        Choose the system and screen orientation.
        Select a button to move, resize or hide it. Press Save when finished.
      notes: 'Save portrait and landscape layouts separately. Game Boy and Game Boy Color share a profile.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/06-editor-controles.webp
      image_alt: 'Nelkano Control editor with a control profile.'
      image_caption: 'Select and position each button in the editor.'
      image_focus: bottom
    -
      title: 'Use a controller or keyboard'
      group: 'Controls and display'
      description: 'Assign controller buttons for each system.'
      steps: |-
        Connect your controller to the device and open Settings → General → Controls → Bluetooth controller.
        Choose the system, select a control and press the controller button you want to assign.
        During gameplay, enable Fullscreen to control the game with the controller.
      notes: |-
        On PC: arrows for directions, Z/X and A/S for buttons, Enter for Start and right Shift for Select. F11 toggles full screen.
        CHIP-8 uses 1234, QWER, ASDF and ZXCV.
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Adjust the picture or pause'
      group: 'Controls and display'
      description: 'System buttons appear around the game picture.'
      steps: |-
        Press the pause button to pause or resume the game.
        Use Stretch to fill the game area; this changes the picture's proportions.
        On DS and 3DS, open Screens to choose Both, Upper or Lower.
      notes: 'To restart the game, open the gear button and press Restart.'
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/04-partida-gba.webp
      image_alt: 'A demonstration game running with Nelkano touch controls.'
      image_caption: 'Gameplay with on-screen controls.'
      image_focus: top
    -
      title: 'Install a module'
      group: 'Modules and updates'
      description: 'Modules add features to Nelkano.'
      steps: |-
        Open Settings → General → Modules and choose Explore.
        Choose a module and press Install to download and verify it.
        Review the author and requested permissions. Confirm installation if you agree.
      notes: |-
        For a .nelkmod file, use Installed → Import module.
        From Installed, disable or uninstall optional modules. Delete its data too removes their saved data.
        Tester-only modules appear only for accounts with access.
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/07-modulos.webp
      image_alt: 'Nelkano Modules screen with the included modules.'
      image_caption: 'Manage modules from Installed.'
      image_focus: top
    -
      title: 'Update the app and modules'
      group: 'Modules and updates'
      description: 'Included modules update with the app; optional modules have their own versions.'
      steps: |-
        To update the app, close your game and open Settings → General → App update.
        For modules, open Modules → Installed → Check for updates.
        Choose the update. If the module is active, press Disable and continue, then review its permissions and confirm installation.
      notes: 'Updating a module keeps its data.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Sign in and add friends'
      group: 'Account and connections'
      description: ''
      steps: |-
        Open Settings → Account → Log in. If you just registered, activate your account using the email link.
        In Library or Save States, press Friends beside the search bar.
        Find the user and send a request. You can also accept incoming requests from Friends.
      notes: 'Signing in does not sync games or saves across devices.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Play with friends'
      group: 'Account and connections'
      description: 'Both players must sign in and add each other in Friends.'
      steps: |-
        Open a compatible game and choose Multijugador.
        One person presses Crear partida and selects their friends. The others press Unirse and choose the host.
        For GBA link cable, use two devices with the exact same game version. Press Conectar con cable link and enter the game's own multiplayer mode.
      notes: 'The link session is temporary: leaving restores the previous session and discards progress made during multiplayer.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Use a second screen'
      group: 'Account and connections'
      description: 'Split DS or 3DS screens across two devices on the same local network.'
      steps: |-
        On the receiving device, open Settings → Second screen → Cambiar modo and confirm with Yes.
        On the gaming device, open Second screen → Buscar pantallas. Choose the receiver and press Conectar.
        Accept the connection on the receiver if prompted. Use Swap screens to change where each screen appears.
      notes: 'The lower screen accepts touch or mouse input from the receiver.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Watch your game from the web'
      group: 'Account and connections'
      description: 'You need an account allowed to broadcast.'
      steps: |-
        During gameplay, open the gear button → Streaming → Iniciar emisión.
        On nelkano.com, sign in with the same account and open Streaming to watch.
        When finished, press Detener emisión in the app.
      notes: 'Game audio is shared; the microphone is excluded.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Change the language or theme'
      group: 'Settings and files'
      description: ''
      steps: |-
        Open Settings → Language and theme.
        Choose your interface language and preferred theme.
      notes: "The interface language does not change games' language."
      bullets: ''
      visible: '1'
      image_uri: ''
      image_asset: /modules/custom/nelkano_home/assets/docs/guide/20261018/08-apariencia.webp
      image_alt: 'Language and theme settings in Nelkano for Android.'
      image_caption: 'Language and theme settings.'
      image_focus: middle
    -
      title: 'Apply a patch'
      group: 'Settings and files'
      description: 'For GBA and Nintendo DS games, using IPS or xdelta/VCDIFF patches.'
      steps: |-
        Open the game details and press Apply patch.
        Select the patch file and original game. The patch must match that exact game version.
        Find the result in Library: it appears as a separate game with its own saves.
      notes: 'The original game is kept.'
      bullets: ''
      visible: '1'
      image_uri: ''
    -
      title: 'Keep your games and saves'
      group: 'Settings and files'
      description: ''
      steps: |-
        Keep your original game files outside Nelkano.
        Before deleting a game, make sure you no longer need its saves or save states.
      notes: |-
        Deleting a game also removes its saves and save states.
        Clearing app data or uninstalling removes the library and saves.
