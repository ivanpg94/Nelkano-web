    -
      title: 'Game translations'
      description: 'To play in another language, use a translated game or a compatible patch.'
      bullets: |-
        Nelkano's language setting only changes its interface.
        The app does not automatically translate game text.
      visible: '0'
      image_uri: ''
    -
      title: 'Send an error report'
      description: 'Accounts authorized to send error reports can use the official Reportes de errores module on Android.'
      bullets: |-
        Install the module if it is available to your account and review its permissions.
        Open a local game that supports save states, create one and use Report an error in its settings. Complete the form and agree to send the state and technical data before pressing Send report.
        If your account does not have access, use the website's contact page to explain what happened.
      visible: '0'
