  releases_filename: 'Nelkano 1.0.0-beta.apk'
  releases_date: 'Pendiente de publicacion'
  releases_requirements: 'Android compatible con la version publicada; se recomienda un dispositivo actual y espacio suficiente para biblioteca y guardados.'
  releases_changes: 'Consulta las notas de cada descarga publicada; las funciones pueden variar entre versiones y plataformas.'
  releases_notice: 'Las condiciones y avisos de los componentes están en Créditos y licencias. Usa únicamente archivos de juego y recursos que tengas derecho a utilizar.'
  releases_items:
    -
      visible: true
      version: 1.0.0-beta
      platform: android
      version_code: ''
      apk_file: 'public://nelkano-releases/Nelkano 1.0.0-beta.apk'
      filename: 'Nelkano 1.0.0-beta.apk'
      date: 27/06/2026
      changes: "Primera beta publica para Android.\r\nBiblioteca local, guardados y save states.\r\nCuenta Nelkano, amigos, gba nelkano online y streaming web.\r\nSincronizacion opcional con Google Drive.\r\nCores disponibles: Chip8, Game boy, Game boy color, Game boy advance, Megadrive, NES"
    -
      visible: true
      version: 2.0.0-beta
      platform: android
      version_code: ''
      apk_file: 'public://nelkano-releases/Nelkano 2.0.0-beta.apk'
      filename: 'Nelkano 2.0.0-beta.apk'
      date: 'Pendiente de publicacion'
      changes: "Nuevo core de Master System.\r\nCorrección del registro desde la app para solucionar la falta del correo de registro.\r\nBiblioteca con favoritos, colecciones, búsqueda, filtros por sistema, ordenación y vistas compacta, grande y de lista. Selección de varios juegos con una pulsación larga.\r\nImportación de juegos comprimidos en ZIP, RAR y 7z, incluidos paquetes con varios juegos. Importación de discos de PlayStation con sus archivos CUE y pistas, y de juegos de RPG Maker con todos sus recursos.\r\nOpción Continuar para retomar un estado guardado. Si eliges la captura de un estado manual como imagen del juego, ese estado tiene prioridad al continuar.\r\nCinco espacios de guardado manual por juego y un espacio independiente para el autoguardado, que se realiza aproximadamente cada minuto. Gestión de estados con filtros y ordenación, según el soporte de cada sistema.\r\nPersonalización de la ficha del juego: cambiar el nombre y la portada o utilizar la captura de un estado manual.\r\nConfiguración de mandos físicos: comprobación de botones, asignación por sistema, guardado y carga de configuraciones y restauración de los valores predeterminados.\r\nEditor de controles táctiles para mover y cambiar el tamaño de los botones, previsualizar el resultado y guardar una disposición para cada sistema y orientación.\r\nOpciones durante la partida: pausa, reinicio, volumen, pantalla completa, ajuste de imagen e indicador de FPS. Botón AUTO para repetir A y botones RECORD y REPLAY para grabar y repetir una secuencia de pulsaciones.\r\nSegunda pantalla para Nintendo DS y Nintendo 3DS: utiliza otro dispositivo Android conectado a la misma red local, intercambia las pantallas y controla la pantalla táctil desde el dispositivo receptor.\r\nAplicación de parches xdelta/VCDIFF a juegos de Nintendo DS. El juego modificado se añade por separado y conserva sus propios guardados, sin sustituir el original.\r\nSincronización de estados, tarjetas de memoria y datos asociados de PlayStation con Google Drive. Las imágenes de disco deben importarse por separado en el dispositivo de destino.\r\nTemas Oscuro, Claro, Azul marino, Pizarra y Grafito, y selección de español o inglés para la interfaz."
    -
      visible: true
      version: 3.0.0-beta
      platform: android
      version_code: '10'
      apk_file: 'private://nelkano-releases/Nelkano 3.0.0-beta.apk'
      filename: 'Nelkano 3.0.0-beta.apk'
      date: 12/10/2026
      changes: "Organización por módulos: Apariencia, Nelkano Básicos, Editor de controles, Amigos y Parches vienen incluidos y activos.\r\nInstalación de módulos adicionales en formato .nelkmod, con revisión de autor y permisos y opciones para activarlos, desactivarlos o desinstalarlos.\r\nActualizador integrado: consulta las nuevas versiones, verifica la descarga y permite iniciar su instalación con la confirmación de Android.\r\nSeis espacios de guardado manual por juego, frente a cinco en la beta 2, con miniaturas en el selector rápido y autoguardado separado. La disponibilidad depende del sistema.\r\nMejoras en la distribución de los controles táctiles y los botones de sistema al cambiar de orientación.\r\nImportación con indicador de progreso y nombre del archivo. Los paquetes ZIP, RAR y 7z pueden contener varios juegos.\r\nGoogle Drive y Nelkano online no están disponibles en esta beta se añadirán mas adelante mediante módulos descargables."
