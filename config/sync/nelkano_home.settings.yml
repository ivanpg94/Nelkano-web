      question: 'Que sistemas soporta Nelkano?'
      answer: 'El proyecto trabaja con CHIP-8, Game Boy, Game Boy Color, Game Boy Advance, NES, Mega Drive, RPG Maker y Nintendo DS, cada uno con un nivel de compatibilidad distinto.'
    -
      question: 'Nelkano es gratis?'
