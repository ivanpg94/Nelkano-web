      overview: 'Nelkano conecta su core de PlayStation Portable en Android y escritorio. Permite importar imágenes ISO y CSO compatibles, utilizar los controles de PSP y conservar los guardados internos del juego en una Memory Stick privada. El soporte es experimental: las pruebas de determinados títulos no garantizan el funcionamiento de todo el catálogo.'
      features: |-
        Importar juegos compatibles en ISO y CSO.
        Jugar con controles táctiles en Android o teclado y mandos compatibles en escritorio.
        Recibir imagen y sonido de los juegos que funcionan en el core.
        Pausar, reanudar y reiniciar la sesión.
        Conservar los guardados que crea el propio juego en una Memory Stick privada.
        Introducir texto cuando el juego lo solicita mediante el formulario de Nelkano.
      limitations: |-
        Algunos juegos pueden no arrancar, bloquearse o presentar errores gráficos y de sonido.
        La velocidad y la continuidad del audio dependen del juego y del dispositivo; no se garantiza velocidad completa.
        No hay estados de emulación: Guardar, Cargar y Continuar mediante un autoguardado de estado no están disponibles.
        Un recorrido inicial probado no garantiza completar el juego.
        Las funciones disponibles pueden variar entre plataformas y versiones.
