        nintendo-ds
      steps:
        -
          title: 'Añade los archivos de sistema'
          description: 'En Configuración → BIOS, pulsa Añadir archivos de sistema 3DS e importa boot9.bin, boot11.bin y aes_keys.txt. Necesitas disponer de estos archivos y tener permiso para utilizarlos. La app los exige antes de abrir un juego.'
        -
          title: 'Añade tu juego'
          description: 'Prepara un juego o una aplicación que tengas permiso para utilizar. Abre la biblioteca, toca el botón + y selecciona su archivo. Espera a que termine la importación.'
        -
          title: 'Abre el juego y elige las pantallas'
          description: 'Selecciona el juego en la biblioteca. Puedes mostrar ambas pantallas o elegir una de ellas. Para utilizar la pantalla táctil, mantén visible la inferior y toca directamente sobre ella.'
      faq:
        -
          question: '¿Qué necesito para empezar?'
          answer: 'Un juego compatible y los archivos boot9.bin, boot11.bin y aes_keys.txt añadidos desde Configuración → BIOS. Algunos títulos pueden necesitar otros archivos de apoyo; los ajustes también permiten importar seeddb.bin, shared_font.bin y dspfirm.cdc.'
        -
          question: '¿Funcionan todos los juegos de Nintendo 3DS?'
          answer: 'No. La compatibilidad es experimental. Un juego puede mostrar el menú o una cinemática y fallar después, y otros todavía no llegan a mostrar imagen.'
        -
          question: '¿Puedo guardar y continuar después?'
          answer: 'Nelkano permite crear y cargar estados, aunque esta función todavía tiene limitaciones. No todas las situaciones permiten guardar y la recuperación puede presentar problemas según el título.'
        -
          question: '¿Un móvil potente garantiza que los juegos funcionen bien?'
          answer: 'No. La velocidad depende del dispositivo, pero también del juego y de las funciones que necesita. Un dispositivo más potente no resuelve los errores de compatibilidad.'
