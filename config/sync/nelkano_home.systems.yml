    chip-8:
      enabled: true
      show_on_home: true
      card_title: CHIP-8
      title: CHIP-8
      short_name: CHIP-8
      status: 'Very stable'
      category: 'Getting started'
      summary: 'The virtual machine from the 1970s. High compatibility and an accessible starting point for understanding emulation.'
      tagline: 'Where it all began. A virtual machine that helped start the story. Simple games, pixel graphics and a 16-key keypad. Discover CHIP-8 on Android.'
      manufacturer: 'Joseph Weisbecker (RCA)'
      year: '1977'
      formats: ".ch8\r\n.c8\r\n.chip8"
      overview: |-
        CHIP-8 is a programming language created by Joseph Weisbecker to make it easier to develop games for computers such as the COSMAC VIP. Its games use simple graphics and a 16-key keypad.
        With Nelkano, you can open these games on your phone and use on-screen touch controls. You can also run programs you have written yourself.
      features: |-
        Open CHIP-8 games and programs stored on your device.
        Import individual files or games inside a ZIP archive.
        Play with an on-screen 16-key keypad.
        Hear the game's sounds.
        Save a game session and resume it by loading its state.
        Try your own CHIP-8 programs.
      limitations: |-
        Some games may have issues or fail to work correctly. Check each title's test results to see what has been verified.
        Programs can be up to 3,584 bytes. This limit applies to the program, not the ZIP archive containing it.
      step_1_title: 'Save a game on your device'
      step_1_text: 'You need a .ch8, .c8 or .chip8 file. You can use a program you created or one its author allows you to download and use.'
      step_2_title: 'Add it to Nelkano'
      step_2_text: 'Open the library, tap + and select the file. Nelkano will add it to your library and open the game.'
      step_3_title: 'Start playing'
      step_3_text: 'The virtual keypad will appear on screen. Each program uses different keys; check its instructions if something does not respond as expected.'
      faq_1_question: 'Is CHIP-8 a console?'
      faq_1_answer: 'No. It is a language designed for making simple games. Nelkano interprets those programs so you can run them on Android.'
      faq_2_question: 'Which keys should I use?'
      faq_2_answer: "It depends on the game. The keypad has 16 keys, from 0 to 9 and A to F, but each program chooses which ones to use. Check the game's instructions for its controls."
      faq_3_question: 'Can I open my own programs?'
      faq_3_answer: "Yes. Once you have generated your program's CHIP-8 file, add it using the + button in the library. It must stay within the 3,584-byte limit."
      seo_title: 'CHIP-8 emulator for Android | Nelkano'
      seo_description: 'Explore CHIP-8 support in Nelkano for Android. Find out how to open compatible games and programs, use the controls and check the current limitations.'
      tier: jugable
      status_note: ''
      image_uri: ''
      related_ids: |-
        game-boy
        nes
      steps:
