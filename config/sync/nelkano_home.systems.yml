      faq_3_answer: 'Sí. Indica la versión de Nelkano, el dispositivo, el sistema y los pasos para reproducirlo.'
      seo_title: 'Emulador Nintendo 3DS Android (básico) — Nelkano'
      seo_description: 'Nelkano incluye soporte básico para Nintendo 3DS. El core está en las primeras fases de desarrollo.'
      tier: basico
      status_note: 'Algunos títulos permiten avanzar por menús y escenas interactivas. La compatibilidad sigue en desarrollo y puede haber pantallas negras, errores gráficos, bloqueos y ralentizaciones importantes.'
