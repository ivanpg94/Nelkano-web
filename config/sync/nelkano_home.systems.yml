      overview: 'La Nintendo 3DS (2011) es la sucesora de la NDS con pantalla 3D sin gafas, cámara y un catálogo extensísimo. Emularla en Android es uno de los retos más complejos que afronta Nelkano: su arquitectura ARM11 a doble núcleo, los múltiples coprocesadores y el hardware gráfico específico hacen que el desarrollo sea largo. El core está en sus primeras fases.'
      features: "Importar juegos y aplicaciones de 3DS en los formatos admitidos.\r\nMostrar ambas pantallas o elegir solo la superior o la inferior.\r\nUtilizar los controles en pantalla o un mando compatible con Android.\r\nInteractuar con la pantalla táctil inferior.\r\nGuardar y cargar estados en las situaciones compatibles."
      limitations: "Algunos títulos no arrancan, se quedan en negro o se bloquean durante la ejecución.\r\nPueden aparecer errores gráficos y problemas de sonido.\r\nLa velocidad puede ser insuficiente para jugar con fluidez, incluso en dispositivos potentes.\r\nLos estados guardados todavía tienen limitaciones según el juego y la situación.\r\nLa ejecución gráfica requiere compatibilidad con Vulkan."
