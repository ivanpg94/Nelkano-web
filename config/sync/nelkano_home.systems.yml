      card_title: CHIP-8
      title: CHIP-8
      short_name: CHIP-8
      status: 'Muy estable'
      category: 'Para empezar'
      summary: 'La máquina virtual de los años 70. Alta compatibilidad, punto de entrada ideal para entender la emulación.'
      tagline: 'El origen de todo. Una máquina virtual que empezó la historia. Juegos sencillos, gráficos de píxeles y un teclado de 16 teclas. Descubre CHIP-8 en tu Android.'
      manufacturer: 'Joseph Weisbecker (RCA)'
      year: '1977'
      formats: ".ch8\r\n.c8\r\n.chip8"
      overview: "CHIP-8 es un lenguaje de programación creado por Joseph Weisbecker para facilitar el desarrollo de juegos en ordenadores como el COSMAC VIP. Sus juegos usan gráficos sencillos y un teclado de 16 teclas.\r\nCon Nelkano puedes abrir estos juegos en tu móvil y controlarlos desde la pantalla táctil. También puedes ejecutar programas que hayas creado tú."
      features: "Abrir juegos y programas CHIP-8 guardados en tu dispositivo.\r\nImportar archivos sueltos o juegos dentro de un ZIP.\r\nJugar con un teclado de 16 teclas en pantalla.\r\nEscuchar los sonidos del juego.\r\nGuardar una partida y retomarla cargando su estado.\r\nProbar tus propios programas CHIP-8."
      limitations: "Algunos juegos pueden presentar errores o no funcionar correctamente. Consulta las pruebas de cada título para saber qué se ha comprobado.\r\nLos programas pueden ocupar hasta 3584 bytes. Este límite se aplica al programa, no al ZIP que lo contiene."
      step_1_title: 'Revisa el alcance disponible'
      step_1_text: 'Consulta las limitaciones de esta ficha y comprueba que tu versión de Nelkano incluye este sistema.'
      step_2_title: 'Prepara tus archivos'
      step_2_text: 'Utiliza archivos compatibles que tengas derecho a usar. Conserva juntos los archivos complementarios que necesite el juego.'
      step_3_title: 'Abre el contenido compatible'
      step_3_text: 'Si el sistema está disponible en tu versión, importa el contenido en la biblioteca y revisa los controles antes de jugar.'
      faq_1_question: '¿Se incluyen juegos?'
      faq_1_answer: 'No. Nelkano no incluye juegos comerciales. Utiliza tu contenido compatible con los derechos necesarios.'
      faq_2_question: '¿El estado se aplica a todos los juegos?'
      faq_2_answer: 'Las extensiones y variantes de CHIP-8 pueden comportarse de forma diferente.'
      faq_3_question: '¿Puedo comunicar un problema?'
      faq_3_answer: 'Sí. Indica la versión de Nelkano, el dispositivo, el sistema y los pasos para reproducirlo.'
      seo_title: 'CHIP-8 en Nelkano — Emulador de máquina virtual retro en Android'
      seo_description: 'Ejecuta programas CHIP-8 en Android con Nelkano. Compatible con archivos .ch8 y .c8. Emulador gratuito, sin publicidad.'
      tier: jugable
      status_note: ''
      image_uri: ''
      related_ids: |-
        game-boy
        nes
      steps:
        -
          title: 'Guarda un juego en tu dispositivo'
          description: 'Necesitas un archivo .ch8, .c8 o .chip8. Puedes usar un programa creado por ti o uno que su autor permita descargar y utilizar.'
        -
          title: 'Añádelo a Nelkano'
          description: 'Abre la biblioteca, pulsa + y selecciona el archivo. Nelkano lo añadirá a tu biblioteca y abrirá el juego.'
        -
          title: ¡Juega!
          description: 'El teclado virtual aparecerá en pantalla. Cada programa usa teclas distintas; consulta la documentación del programa si algo no responde como esperas.'
      faq:
        -
          question: '¿CHIP-8 es una consola?'
          answer: 'No. Es un lenguaje pensado para crear juegos sencillos. Nelkano interpreta esos programas para que puedas ejecutarlos en Android.'
        -
          question: '¿Qué teclas tengo que usar?'
          answer: 'Depende del juego. El teclado tiene 16 teclas, del 0 al 9 y de la A a la F, pero cada programa decide cuáles utiliza. Encontrarás los controles en las instrucciones del juego.'
        -
          question: '¿Puedo abrir mis propios programas?'
          answer: 'Sí. Una vez que hayas generado el archivo CHIP-8 de tu programa, añádelo desde el botón + de la biblioteca. Debe respetar el límite de 3584 bytes.'
        -
          question: '¿Puedo guardar la partida?'
          answer: 'Sí. Puedes guardar el estado del juego y cargarlo después para continuar desde ese punto.'
